  const E = SMP_EXT[kit];
  smpLoading[key] = fetchDecode(E ? E.src : smpSrc(SMP_KITS[kit].dir), file)
    .then(buf => { smpBuffers[kit].set(midi, buf); smpRRBufs[kit].set(midi, [buf]); smpPickCache.clear(); })
    .catch(() => { smpFailed[kit].add(midi); });   // 這一顆掉回合成,其他的照常
  return smpLoading[key];
}
/* 其餘的 round robin 等真的開始播了才補(跟鼓同一個 `drumFillGate`),一顆一顆排隊 */
function fillSmpRR(kit){
  const E = SMP_EXT[kit];
  if (!E || !E.rr || E.rr < 2) return;
  drumFillGate().then(() => {
    const todo = [];
    for (const m of smpBuffers[kit].keys())
      for (let r = 2; r <= E.rr; r++) if (!(smpRRBufs[kit].get(m) || [])[r - 1]) todo.push([m, r]);
    return todo.reduce((c, [m, r]) => c.then(() => fetchDecode(E.src, E.file(m, r))
      .then(buf => { const a = smpRRBufs[kit].get(m); if (a) a[r - 1] = buf; }).catch(() => {})), Promise.resolve());
  }).catch(() => {});
}
/* 這次進行會用到哪幾顆音,就抓哪幾顆(跟鋼琴同一個做法) */
function ensureSmp(kit, midis){
  const table = SMP_TABLE[kit];
  if (!table) return Promise.resolve();
  const want = new Set();
  for (const m of midis) {
    let best = table[0];
    for (const e of table) if (Math.abs(e[0] - m) < Math.abs(best[0] - m)) best = e;
    want.add(best);
  }
  const list = [...want].filter(e => !smpFailed[kit].has(e[0]) && !smpBuffers[kit].has(e[0]));
  /* **一顆一顆排隊抓,不要十幾顆一起**。`decodeAudioData` 是在主執行緒上做的,
     十幾顆 mp3 同時解碼會跟排程器搶同一個執行緒。
     這條鏈是**在按下播放之前**跑完的(見 `prewarmGuitar` 與 `startPlayback`),
     所以它只影響「等多久才開始」,不影響已經在播的時候。
     一開始是邊播邊載,CPU 降速 6× 時排程一跳從 46ms 跳到 73ms 還開始
     「來不及」——那是解碼跟排程器搶同一個執行緒,踩過 */
  return list.reduce((chain, e) => chain.then(() => loadSmpOne(kit, e[0], e[1])),
                     Promise.resolve()).catch(() => {}).then(() => fillSmpRR(kit));
}
/* 「這顆音要用哪一份取樣」memo 起來。刷弦一小節十幾下、放克的切音更多,
   每一下都去掃一遍 buffer 的 key 是白花的——載到新的取樣時整個清掉就好 */
const smpPickCache = new Map();
/* 這一顆音有沒有真的取樣可以用。**差太多就不要硬拉**:`playbackRate` 拉過頭會把
   箱體的共振一起搬走,吉他會變成玩具琴。弦樂的取樣點本來就疏(小提琴只有 14 顆),
   所以它容許拉到五個半音,吉他只給三個 */
function smpNorm(kit, m){
  const E = SMP_EXT[kit];
  if (!E || !E.db) return 1;
  const d = E.db[m - E.lo];
  return d == null ? 1 : Math.min(4, Math.pow(10, (E.target - d) / 20));
}
function smpPick(kit, midi, maxStretch){
  const bank = smpBuffers[kit];
  if (!bank || !bank.size) return null;
  const key = kit + ":" + midi;
  if (smpPickCache.has(key)) return smpPickCache.get(key);
  let best = -1;
  for (const k of bank.keys()) if (best < 0 || Math.abs(k - midi) < Math.abs(best - midi)) best = k;
  const got = Math.abs(best - midi) > (maxStretch || 3) ? null
            : { buffer: bank.get(best), rate: Math.pow(2, (midi - best) / 12), at: best,
                norm: smpNorm(kit, best) };
  smpPickCache.set(key, got);
  return got;
}
function gtrSample(midi, toneName, rrSeed){
  const kit = gtrKitFor(toneName);
  const got = kit ? smpPick(kit, midi, 3) : null;
  /* 有 round robin 的那一組,照「這一下在音樂上的位置」挑一份(不是亂數,可以重現) */
  if (got && rrSeed != null && smpRRBufs[kit]) {
    const all = (smpRRBufs[kit].get(got.at) || []).filter(Boolean);
    if (all.length > 1) return { buffer: all[Math.floor(hash01(rrSeed, 911) * all.length) % all.length],
                                 rate: got.rate, at: got.at, norm: got.norm };
  }
  return got;
}

/* 這段進行的貝斯會用到哪幾個音(根音與五音,移調之後的) */
function bassMidisOf(){
  const out = [];
  if (typeof parsed === "undefined" || !parsed) return out;
  for (const b of flatChords(parsed.bars)) {
    if (!b.ok) continue;
    for (const raw of [b.chord.bassPc, b.chord.rootPc + 7]) {
      const m = bassMidiFor((((raw + transposeOn) % 12) + 12) % 12);
      out.push(m);
      /* City Pop 的貝斯會跳八度、跑過門(到八度與七度),那幾顆要載**高一點的錄音**,
         不然從 E2 的取樣拉一個八度上去,聽起來是玩具不是貝斯 */
      if (typeof feel === "function" && feel().bass === "citypop") out.push(m + 12, m + 7);
    }
  }
  return out;
}

/* 貝斯一律待在 E1–D#2 這個八度裡:移調時跟著換音級,但不跟著跑到別的音域去,
   不然移個幾度貝斯就飛到鋼琴中間,整個低音就空了 */
function bassMidiFor(pc){
  return 28 + ((((pc - 4) % 12) + 12) % 12);
}

/* 鼓件在鼓組裡的左右位置(從聽眾的角度)。全部塞在正中間是「合成的」最明顯的特徵:
   真的鼓組 hi-hat 偏右一點、tom 一高一低分開、ride 在右邊。
   幅度都很小(±0.3 以內)——這是把鼓組擺開,不是做效果 */
const DRUM_PAN = { kick: 0, snare: -0.05, hihat: 0.22, hhped: 0.24, ohat: 0.22, ride: -0.26,
                   xstick: -0.05, htom: -0.18, ltom: 0.2, crash: -0.3, clap: 0 };

/* `vel` 是 0–1 的「打多用力」。真的鼓**打輕的時候不只是小聲,還比較暗**——
   幽靈音、ride 的 skip note 都是這樣。只調音量的話,一小節八下 hi-hat
   會全部一樣亮、只是大小聲不同,那就是「像機器人」的另一半原因
   (另一半是節奏型,見 COMP_CELLS 那節)。
   取樣只有一層力度,所以用一顆低通把弱拍的高頻收掉,模擬出力度層 */
function velFilter(vel){
  if (vel >= 0.92) return null;
  const f = ctx.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.value = 900 + 15000 * Math.pow(Math.max(0.05, vel), 1.7);
  f.Q.value = 0.4;
  return f;
}

/* 這一下該用哪一層力度。`DRUM_LAYERS[piece].vl` 裡的層平均鋪在 0–1 上,
   所以 vel 0.2 會拿到最輕那幾層、1.0 拿到最重的。
   那一層沒載到就退到最近的(載入是漸進的,前幾秒可能只有中間那層) */
function pickDrumLayer(piece, vel){
  const list = drumBuffers[piece];
  if (!list || !list.length) return null;
  const L = DRUM_LAYERS[piece];
  const n = L ? L.vl.length : list.length;
  const wantVl = L ? L.vl[Math.max(0, Math.min(n - 1, Math.round(vel * (n - 1))))] : 0;
  let best = list[0];
  for (const slot of list) {
    if (!slot.mid.length) continue;
    if (!best.mid.length || Math.abs(slot.vl - wantVl) < Math.abs(best.vl - wantVl)) best = slot;
  }
  return best && best.mid.length ? best : null;
}

/* ── open hat 的掐音 ──────────────────────────────────────────
   open hat 的取樣會響 8–9 秒,真的 hi-hat 是踩下去就停。下一顆 closed hat(或踩鈸)
   落下時把還在響的那一顆在 12ms 內收掉——少了這一下,反拍的 open hat 會一路疊成一片噪音 */
let lastOhat = null;
function chokeOhat(when){
  if (!lastOhat || when <= lastOhat.at + 0.02) return;
  for (const gn of lastOhat.gains) { try { gn.gain.cancelScheduledValues(when); gn.gain.setTargetAtTime(0, when, 0.012); } catch (e) {} }
  lastOhat = null;
}
/* ── 八〇年代的 gated room ─────────────────────────────────────
   Phil Collins〈In the Air Tonight〉、Hugh Padgham 在 Townhouse 的石頭房間:房間麥被壓得很重、
   再過一顆 noise gate,所以是**一段很密的空間聲撐住,然後突然切斷**,不是慢慢衰減的殘響。
   做法是一顆卷積:脈衝響應是 6ms 預延遲 + 150ms 幾乎不衰減的雜訊 + 12ms 硬收。
   雜訊用固定種子、左右不同(跟 `buildImpulseResponse` 同一條規則)。只有小鼓送進來 */
let gateSend = null;
function buildGateIR(){
  const sr = ctx.sampleRate, len = Math.floor(sr * 0.2);
  const b = ctx.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c), rnd = mulberry32(9100 + c * 77);
    const pre = Math.floor(sr * 0.006), hold = Math.floor(sr * 0.15), rel = Math.floor(sr * 0.012);
    for (let i = pre; i < Math.min(len, pre + hold + rel); i++) {
      const t = i - pre;
      const env = t < hold ? 1 - 0.3 * t / hold : Math.max(0, 0.7 * (1 - (t - hold) / rel));
      d[i] = (rnd() * 2 - 1) * env;
    }
  }
  /* **能量一定要正規化**(兩聲道各自平方和開根號 = 1)。第一版沒做,150ms 的雜訊每個取樣 0.35,
     卷積出來比乾的小鼓大 **28dB**——送 0.14 的「一點」gated 其實比小鼓本身還大聲,
     鼓那一軌的相似度從 112% 掉到 56%(`消去法8`,拿掉 gated 就回來)。
     正規化之後送量就等於「比乾的小鼓小幾 dB」:0.3 ≈ −10dB */
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c); let e = 0;
    for (let i = 0; i < len; i++) e += d[i] * d[i];
    const k = e > 0 ? 1 / Math.sqrt(e) : 0;
    for (let i = 0; i < len; i++) d[i] *= k;
  }
  return b;
}
function playDrum(piece, when, gain, vel){
  /* 鼓也要抖,但**比別人緊**:它是整個樂團對時間的基準。
     大鼓最緊(2.5ms)、鈸最鬆(4.5ms)——真的鼓手右手比右腳鬆,
     那正是「人在打」聽得出來的地方 */
  /* 鼓也有 pocket(`FEELS[x].pocket.kick/snare/hat`):backbeat 往後靠一點
     是「放鬆」的來源,hi-hat 往前一點是「往前走」。沒寫就是 0 */
  const pk = piece === "kick" ? "kick"
           : (piece === "snare" || piece === "clap" || piece === "rim" || piece === "xstick") ? "snare" : "hat";
  when += humanTime(pk, when, 303 + piece.length);
  // 實錄鼓組的大鼓也要能觸發側鏈(原本只有 808 的大鼓會);給不給看 FEELS[x].duck
  if (piece === "kick") duckBass(when);
  // closed hat / 踩鈸落下時,上一顆還在響的 open hat 要停(808 的 open hat 另外有 D808_CUT)
  if (piece === "hihat" || piece === "hhped") chokeOhat(when);
  /* 808 先用真的取樣,載不到才掉回合成(`synth808` 是備援不是主角) */
  if (drumKit() === "e808") {
    if (!play808Sample(piece, when, gain)) synth808(piece, when, gain);
    return;
  }
  /* 沒特別給 vel 的話就拿音量當力度。鼓件自己的基準音量差很多
     (hi-hat 的 0.3 已經是很用力了、小鼓的 0.3 是幽靈音),
     所以要除掉那個基準才是真的「打多用力」 */
  const ref = piece === "hihat" || piece === "hhped" || piece === "ride" || piece === "ohat" ? 0.34
            : piece === "kick" ? 0.9 : 0.7;
  const v = Math.max(0, Math.min(1, vel === undefined ? gain / ref : vel));
  // City Pop 的大鼓、小鼓、hi-hat 走 SM Drums(載不到就往下走原本的 Virtuosity)
  if (smKitOn() && playSMSample(piece, when, gain, v)) return;
  const slot = pickDrumLayer(piece, v);
  if (!slot) { synthDrum(piece, when, gain); return; }

  const rr = drumRR[piece]++;
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const g = ctx.createGain();
  /* **力度層已經帶著音色差了,所以 gain 要往回補**:輕的那層本來就錄得小聲,
     再照 gain 打一次會輕到聽不見。這裡把「層自己的相對音量」除掉一部分,
     讓 gain 主要負責平衡、層負責音色 */
  const L = DRUM_LAYERS[piece];
  const idx = L ? L.vl.indexOf(slot.vl) : 0;
  const steps = L ? Math.max(1, L.vl.length - 1) : 1;
  const layerNorm = 1 + (0.5 - idx / steps) * 0.55;   // 輕的層補一點、重的層收一點
  g.gain.value = gain * layerNorm;
  if (pan) { pan.pan.value = DRUM_PAN[piece] || 0; g.connect(pan); pan.connect(drumBus); }
  else g.connect(drumBus);
  if (gateSend && (piece === "snare" || piece === "clap")) g.connect(gateSend);
  if (piece === "ohat") lastOhat = { gains: [g], at: when };

  const src = ctx.createBufferSource();
  src.buffer = slot.mid[rr % slot.mid.length];
  /* **鼓件的音色 EQ 與悶音**(`FEELS[x].drumTone` / `drumDamp`,沒寫就是原樣)。
     Virtuosity 是實錄的**爵士鼓組**:鼓皮開著、餘音長、房間大。City Pop 的鼓是
     八〇年代初錄音室那種**悶住、調緊、乾**的聲音(鼓皮上貼膠帶、大鼓塞枕頭)。
     分軌跟三首參考曲比,我們的真鼓反而比合成鼓更不像 City Pop——差在音色不在音量。
     悶音 = 撐 `hold` 秒之後照 `tau` 收掉(真的貼了膠帶的鼓就是這樣:音頭一樣,尾巴沒了) */
  const f0 = feel();
  let head = g;
  const tone = f0.drumTone && f0.drumTone[piece];
  if (tone) for (let i = tone.length - 1; i >= 0; i--) {
    const [type, hz, db, q] = tone[i];
    const bq = ctx.createBiquadFilter(); bq.type = type; bq.frequency.value = hz; bq.gain.value = db; bq.Q.value = q || 0.9;
    bq.connect(head); head = bq;
  }
  src.connect(head);
  const damp = f0.drumDamp && f0.drumDamp[piece];
  if (damp) { g.gain.setValueAtTime(g.gain.value, when + damp[0]); g.gain.setTargetAtTime(0, when + damp[0], damp[1]); }
  src.start(when, leadOf(src.buffer));
  activeSources.add(src);
  src.onended = () => { activeSources.delete(src);
    try { src.disconnect(); g.disconnect(); if (pan) pan.disconnect(); } catch (e) {} };

  /* **空間麥克風**:同一次演奏的另一支麥,不是殘響。
     人造殘響給的是「一個空間」,房間麥給的是「這一組鼓真的在那個房間裡」——
     鼓皮的餘韻、其他鼓件的共鳴、地板的反射全都在裡面,那是合成不出來的。
     它自己走一條 bus(`roomBus`),所以量可以獨立調 */
  /* 空間麥克風只抓了中間那一層(見 loadDrumPiece),所以這裡要從整顆鼓裡找一個有的。
     力度層的差別在近麥已經有了,空間麥只是給空氣感,借哪一層都行 */
  const roomSlot = slot.room.length ? slot : (drumBuffers[piece] || []).find(x => x.room.length);
  if (roomSlot && roomBus) {
    const rsrc = ctx.createBufferSource();
    rsrc.buffer = roomSlot.room[rr % roomSlot.room.length];
    const rg = ctx.createGain();
    rg.gain.value = gain * layerNorm;
    if (piece === "ohat" && lastOhat) lastOhat.gains.push(rg);
    if (damp) { rg.gain.setValueAtTime(rg.gain.value, when + damp[0]); rg.gain.setTargetAtTime(0, when + damp[0], damp[1] * 1.5); }
    rsrc.connect(rg); rg.connect(roomBus);
    rsrc.start(when, leadOf(src.buffer));   // 跟近麥跳過同一段,兩支麥克風才對得齊
    activeSources.add(rsrc);
    rsrc.onended = () => { activeSources.delete(rsrc);
      try { rsrc.disconnect(); rg.disconnect(); } catch (e) {} };
  }
}

/* 取樣載不到時的備援鼓:大鼓是往下掉的正弦、小鼓是雜訊加一點中頻、hi-hat 是高通雜訊 */
function synthDrum(piece, when, gain){
  const g = ctx.createGain();
  g.connect(drumBus);
  if (piece === "kick") {
    const o = ctx.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(150, when);
    o.frequency.exponentialRampToValueAtTime(48, when + 0.11);
    g.gain.setValueAtTime(gain, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.34);
    o.connect(g); o.start(when); o.stop(when + 0.36);
    activeSources.add(o);
    o.onended = () => { activeSources.delete(o); try { o.disconnect(); g.disconnect(); } catch (e) {} };
    return;
  }
  if (piece === "htom" || piece === "ltom") {
    const o = ctx.createOscillator();
    const f0 = piece === "htom" ? 260 : 170;
    o.type = "sine";
    o.frequency.setValueAtTime(f0, when);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.62, when + 0.22);
    g.gain.setValueAtTime(gain, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.4);
    o.connect(g); o.start(when); o.stop(when + 0.42);
    activeSources.add(o);
    o.onended = () => { activeSources.delete(o); try { o.disconnect(); g.disconnect(); } catch (e) {} };
    return;
  }
  const dur = piece === "crash" ? 1.4 : piece === "ride" ? 0.6
            : piece === "snare" ? 0.19 : piece === "xstick" ? 0.045 : 0.05;
  // 雜訊走共用的那份(見 noiseSrc),衰減交給下面的 gain 包絡,不要每次重做一個 buffer
  const { src, offset } = noiseSrc(dur);
  const f = ctx.createBiquadFilter();
  f.type = (piece === "snare" || piece === "xstick") ? "bandpass" : "highpass";
  f.frequency.value = piece === "snare" ? 1900 : piece === "xstick" ? 2400
                    : piece === "crash" ? 3500 : piece === "ride" ? 5200 : 8000;
  const lvl = gain * (piece === "snare" ? 1 : piece === "crash" ? 0.5
                    : piece === "ride" ? 0.45 : 0.8);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(lvl, when + 0.001);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  src.connect(f); f.connect(g);
  src.start(when, offset); src.stop(when + dur + 0.02);
  activeSources.add(src);
  src.onended = () => { activeSources.delete(src); try { src.disconnect(); f.disconnect(); g.disconnect(); } catch (e) {} };
}

/* ══ 合成樂器的共用零件 ════════════════════════════════════════
   這幾條都是**流暢度**的規則,不是音色的規則:

   - **雜訊只做一份**。原本每打一下 hi-hat 就 `createBuffer` 一次,
     放克一小節十六下就是十六次配置;改成開場做一份兩秒的,每次從隨機位置起播。
     聽起來完全一樣(雜訊本來就沒有「第幾秒」的差別),但配置歸零
   - **波形表(PeriodicWave)只做一份**。風琴的音栓、鋪底的鋸齒都是固定頻譜,
     一顆振盪器就彈得出來——不要用四五顆正弦去疊,那是四五倍的節點
   - **撥弦的取樣先算好再快取**(`ksBuffer`)。Karplus-Strong 一次算完存成 buffer,
     之後就跟播取樣一樣便宜;**一定要在載入階段算**,排程中途算會卡一下 */
/* **雜訊也要是可重現的**,跟 `hash01` 同一條規則:`Math.random()` 的話
   每次重新整理頁面的音色都不一樣,量到的尖峰也跟著飄
   (踩過:同一段 K-Pop 兩次量出 0.93 與 1.19,查了半天才發現是雜訊不一樣)。
   固定種子的 mulberry32,聽起來跟真亂數完全沒有差別 */
let sharedNoise = null, noiseCursor = 0;
function noiseBuf(){
  if (!sharedNoise) {
    const len = Math.floor(ctx.sampleRate * 2);
    sharedNoise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = sharedNoise.getChannelData(0);
    let a = 0x9e3779b9;
    for (let i = 0; i < len; i++) {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      d[i] = (((t ^ (t >>> 14)) >>> 0) / 4294967296) * 2 - 1;
    }
  }
  return sharedNoise;
}
/* 一顆雜訊來源:共用那份 buffer,每次從不同位置起播(所以每一下的顆粒不一樣),
   但那個位置是**依序走**的不是亂數的,重播同一段會得到同一個結果 */
function noiseSrc(dur){
  const src = ctx.createBufferSource();
  const buf = noiseBuf();
  src.buffer = buf;
  const max = Math.max(0.001, buf.duration - dur - 0.01);
  src.loop = true;
  src.loopStart = 0; src.loopEnd = buf.duration;
  noiseCursor = (noiseCursor + 0.0371) % 1;
  return { src, offset: noiseCursor * max };
}

const waveCache = {};
/* `parts` 是諧波振幅(index 0 是直流,不用)。做成 PeriodicWave 之後
   一顆振盪器就有整組泛音,不必疊一堆 */
function waveOf(name, parts){
  if (!waveCache[name]) {
    const n = parts.length;
    const real = new Float32Array(n), imag = new Float32Array(n);
    for (let i = 1; i < n; i++) imag[i] = parts[i];
    waveCache[name] = ctx.createPeriodicWave(real, imag, { disableNormalization: false });
  }
  return waveCache[name];
}
/* Hammond 的音栓:8' 當基音,上面疊 4'、2⅔'、2' 與兩顆很輕的高泛音。
   爵士常用的 888800000 就是這個形狀——低八度的 16' 刻意不給,
   那一段是貝斯的位置,加了只會糊 */
const ORGAN_PARTS = [0, 1, 0.55, 0.42, 0.30, 0, 0.16, 0, 0.12, 0, 0, 0, 0.06];
/* 鋪底:鋸齒但高頻收得快(1/n^1.35),後面再過一顆低通。
   真的鋸齒(1/n)在四個音疊起來時會刺 */
const PAD_PARTS = (() => { const a = [0]; for (let n = 1; n <= 16; n++) a.push(1 / Math.pow(n, 1.35)); return a; })();

/* ── 撥弦:Karplus-Strong ──────────────────────────────────────
   吉他不是用取樣是算出來的,理由跟 808 一樣:**檔案下載是延遲與風險**,
   而撥弦剛好是物理模型做得最像的一種樂器。但要像,三件事不能省:

   1. **撥弦位置的梳狀濾波**(`pluckPos`):把激發訊號減掉「延遲 1/5 週期的自己」。
      少了這一步,KS 聽起來是合成器的 pluck,不是吉他——那條梳狀凹陷就是
      「靠近琴橋撥」跟「在音孔上撥」的差別
   2. **激發要先低通**(`exciteLp`):尼龍弦暗、撥片亮,差別在這裡不在音量
   3. **迴圈裡的一階低通**(`damp`):高頻先衰減,弦才會越響越暗。
      固定衰減(只乘 loss)會得到一顆從頭到尾一樣亮的音,很假

   音準用 `playbackRate` 修:延遲線長度一定是整數,所以先用四捨五入的長度算,
   播的時候再乘「整數長度 ÷ 真正的週期」,音準就完全正確(誤差 < 1%,音色聽不出來)。
   這比在迴圈裡塞一顆全通濾波器便宜也穩定得多 */
/* `pick` 是撥片碰弦那一聲的量、`pickHz` 是它的頻率。
   指彈(尼龍)幾乎沒有,撥片刷弦最明顯 */
const GUITAR_TONES = {
  // 尼龍弦:暗、長、靠音孔撥。bossa 的 João Gilberto 就是這個
  nylon:  { sec: 1.9, exciteLp: 0.28, pluckPos: 0.24, damp: 0.46, loss: 0.9965, bright: 1600,
            pick: 0.08, pickHz: 1900 },
  // archtop:爵士的四分音符 comping,很短、很悶(Freddie Green 是用手掌壓住的)
  archtop:{ sec: 0.85, exciteLp: 0.22, pluckPos: 0.16, damp: 0.38, loss: 0.9930, bright: 1250,
            pick: 0.14, pickHz: 2400 },
  // 乾淨電吉他:city pop 的十六分切音,亮一點、短
  clean:  { sec: 1.1, exciteLp: 0.55, pluckPos: 0.13, damp: 0.60, loss: 0.9958, bright: 3200,
            pick: 0.22, pickHz: 3400 },
  // 悶音切音:放克的那種「喀」,幾乎沒有延音
  chop:   { sec: 0.42, exciteLp: 0.72, pluckPos: 0.11, damp: 0.70, loss: 0.9880, bright: 3800,
            pick: 0.3, pickHz: 3800 },
  // 鋼弦刷弦:流行歌的木吉他
  steel:  { sec: 1.6, exciteLp: 0.50, pluckPos: 0.18, damp: 0.55, loss: 0.9968, bright: 2600,
            pick: 0.26, pickHz: 3000 },
};
const ksCache = new Map();          // "tone:midi" -> { buffer, rate }
function ksBuffer(midi, toneName){
  const key = toneName + ":" + midi;
  const hit = ksCache.get(key);
  if (hit) return hit;
  const T = GUITAR_TONES[toneName] || GUITAR_TONES.nylon;
  const sr = ctx.sampleRate;
  const period = sr / (440 * Math.pow(2, (midi - 69) / 12));
  const L = Math.max(4, Math.round(period));
  const len = Math.max(64, Math.floor(sr * T.sec));
  const buf = ctx.createBuffer(1, len, sr);
  const out = buf.getChannelData(0);

  /* 激發:低通過的雜訊。**種子固定**(拿 midi 當種子),
     所以同一個音每次算出來完全一樣——不然重新整理一次音色就變了 */
  const line = new Float32Array(L);
  let lp = 0, seed = (midi * 2654435761) >>> 0;
  const rnd = () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  for (let i = 0; i < L; i++) {
    lp += T.exciteLp * ((rnd() * 2 - 1) - lp);
    line[i] = lp;
  }
  // 撥弦位置的梳狀濾波
  const pk = Math.max(1, Math.round(L * T.pluckPos));
  const ex = Float32Array.from(line);
  for (let i = pk; i < L; i++) ex[i] -= line[i - pk] * 0.85;
  // 去直流,不然整條弦會有一個不會消失的偏壓
  let mean = 0;
  for (let i = 0; i < L; i++) mean += ex[i];
  mean /= L;
  for (let i = 0; i < L; i++) ex[i] -= mean;

  let idx = 0, prev = ex[L - 1];
  for (let i = 0; i < len; i++) {
    const cur = ex[idx];
    out[i] = cur;
    const filt = T.damp * cur + (1 - T.damp) * prev;
    prev = filt;
    ex[idx] = filt * T.loss;
    idx = (idx + 1) % L;
  }
  // 尾巴淡出,不要硬切(硬切會有一聲「喀」)
  const fade = Math.min(len, Math.floor(sr * 0.04));
  for (let i = 0; i < fade; i++) out[len - fade + i] *= 1 - i / fade;
  let peak = 0;
  for (let i = 0; i < len; i++) { const a = Math.abs(out[i]); if (a > peak) peak = a; }
  if (peak > 0) { const g = 0.92 / peak; for (let i = 0; i < len; i++) out[i] *= g; }

  /* **音準要把迴圈裡那顆低通的群延遲算進去**。
     `y[n] = damp·x[n] + (1−damp)·y[n−1]` 在直流的群延遲是 `(1−damp)/damp` 個取樣,
     所以真正的迴圈長度是 `L + 那個延遲`,不是 L。

     漏掉它的症狀:整把吉他**偏低**,而且**越高音偏得越多**——
     實測 steel 在 E2 只低 2.4 音分、E5 就低 20.5 音分,archtop 更誇張到 40 音分。
     一個刷弦和弦裡低音幾乎準、高音低二十音分,那不是「有味道」是走音,
     被回報過「Pop 的吉他聲聽起來很怪」。
     damp 一改就要重量一次音準(見 pitch 測試) */
  const loopLen = L + (1 - T.damp) / T.damp;
  const made = { buffer: buf, rate: loopLen / period };
  ksCache.set(key, made);
  return made;
}

/* 彈一顆弦。`mute` 是「多快放掉」:0 是讓它自然響完,越大越像悶音;
   `str` 是第幾條弦(0 是最低的那條),用來給每條弦一點點自己的音準偏差 */
function pluck(midi, when, gain, toneName, mute, str, take){
  /* 刷弦本來就已經一條一條錯開了(`strumTake` 的 `spread`),
     這裡抖的是「這一下整把琴落在哪」,兩件事不衝突 */
  when += humanTime("gtr", when, 304 + (take ? 7 : 0));
  const T = GUITAR_TONES[toneName] || GUITAR_TONES.nylon;
  /* **有真的取樣就用真的**,沒有才掉回 KS(取樣還在路上、載失敗、
     或這顆音超出錄音的音域)。位置跟 `synthDrum` 一樣是備援不是主角 */
  const smp = gtrSample(midi, toneName, Math.round(when * 96) + (str || 0) * 7 + (take ? 3 : 0));
  const ks = smp || ksBuffer(midi, toneName);
  const src = ctx.createBufferSource();
  src.buffer = ks.buffer;
  /* **每條弦差個兩三音分**。真的吉他不可能六條弦都完全準
     (而且三弦的 G 幾乎一定偏高,那是品的位置造成的)。
     全部彈得一模一樣準是合成器才有的事,聽起來就是假。
     偏差是照弦號固定的,不是亂數——同一顆和弦每次刷出來一樣 */
  /* 第二軌要換一組偏差:雙軌的重點是「兩次不同的演奏」,
     兩遍音準偏差一模一樣的話疊起來只是變大聲,不會變寬 */
  const OFFS = [-2.4, 1.6, 3.1, -1.2, 2.2, -0.8];
  const off = OFFS[(((str || 0) + (take ? 3 : 0)) % 6 + 6) % 6];
  src.playbackRate.value = ks.rate * Math.pow(2, off / 1200);
  const tone = ctx.createBiquadFilter();
  tone.type = "lowpass";
  /* `bright` 是**為了 KS 訂的**:合成的弦高頻太多太齊,要收掉才不刺。
     真的錄音本來就是對的,同一顆低通會把箱體的空氣感一起切掉,
     所以取樣這一路開高一階(`sbright`),只留一點點修飾 */
  tone.frequency.value = smp ? (T.sbright || Math.min(12000, T.bright * 1.9)) : T.bright;
  tone.Q.value = 0.6;
  const g = ctx.createGain();
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  /* 吉他整體偏右一點(鋼琴的低音偏左),兩件和聲樂器才不會疊在正中間 */
  /* 吉他整體偏右一點(鋼琴的低音偏左);**第二軌擺到另一邊**,
     那個左右分離就是雙軌聽起來「寬」的全部原因 */
  if (pan) pan.pan.value = (take ? -1 : 1) * (0.16 + ((midi % 5) - 2) * 0.035);
  src.connect(tone); tone.connect(g);
  if (pan) { g.connect(pan); pan.connect(combBus); } else { g.connect(combBus); }
  /* 取樣本身錄到自然衰減完,但 Freddie Green 是用手掌壓住的、放克是悶音——
     **那個「短」不是音色是演奏法**,所以長度照舊由 `sec` 決定,不是讓它響完 */
  const dur = mute ? Math.min(T.sec, mute) : T.sec;
  // 起音給 1 毫秒,理由跟 808 的鼓一樣:比限幅器還快的爆點會整個穿過去
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(gain * ((smp && smp.norm) || 1), when + 0.001);

  /* 撥片碰到弦的那一聲。KS 本身只有「弦在振動」,沒有「東西碰到弦」——
     少了它聽起來是撥弦合成器,不是有人拿著撥片在刷。
     尼龍弦用指腹所以幾乎沒有,鋼弦與撥片的最明顯 */
  if (T.pick > 0 && !smp) {
    const { src: n, offset: no } = noiseSrc(0.012);
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = T.pickHz; bp.Q.value = 1.4;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, when);
    ng.gain.linearRampToValueAtTime(gain * T.pick, when + 0.0012);
    ng.gain.exponentialRampToValueAtTime(0.0001, when + 0.011);
    n.connect(bp); bp.connect(ng);
    if (pan) ng.connect(pan); else ng.connect(combBus);
    n.start(when, no); n.stop(when + 0.014);
    activeSources.add(n);
    n.onended = () => { activeSources.delete(n);
      try { n.disconnect(); bp.disconnect(); ng.disconnect(); } catch (e) {} };
  }
  if (mute) g.gain.setTargetAtTime(0.0001, when + dur * 0.55, dur * 0.16);
  /* KS 的 buffer 本來就只有 `sec` 這麼長(算完就沒了),取樣不是——
     它會一路響到錄音結束。不收的話 Freddie Green 的四分音符會全部疊在一起,
     一小節四顆和弦 × 三條弦 = 十二條弦同時在響 */
  else if (smp) g.gain.setTargetAtTime(0.0001, when + dur * 0.8, dur * 0.2);
  const stopAt = when + dur + 0.12;
  src.start(when, leadOf(src.buffer)); src.stop(stopAt);
  activeSources.add(src);
  src.onended = () => { activeSources.delete(src);
    try { src.disconnect(); tone.disconnect(); g.disconnect(); if (pan) pan.disconnect(); } catch (e) {} };
}

/* ── 打擊小物 ──────────────────────────────────────────────────
   沙鈴、鈴鼓、cabasa、指響:全是帶通過的雜訊,差別在頻率、長度與包絡。
   **起音一定要有一點斜坡**(1–2 毫秒):硬邊緣的雜訊爆點會穿過限幅器,
   808 的拍手就踩過這個坑 */
const PERC_SPEC = {
  shaker: { f: 6800, q: 1.2, dur: 0.055, atk: 0.004, lvl: 0.5,  pan: -0.28 },
  cabasa: { f: 5200, q: 0.9, dur: 0.075, atk: 0.005, lvl: 0.5,  pan: -0.3 },
  tamb:   { f: 7600, q: 2.6, dur: 0.16,  atk: 0.002, lvl: 0.42, pan: -0.24 },
  snap:   { f: 2300, q: 3.2, dur: 0.05,  atk: 0.001, lvl: 0.7,  pan: 0.18 },
};
function playPerc(kind, when, gain){
  const P = PERC_SPEC[kind] || PERC_SPEC.shaker;
  const { src, offset } = noiseSrc(P.dur);
  const bp = ctx.createBiquadFilter();
  bp.type = "bandpass"; bp.frequency.value = P.f; bp.Q.value = P.q;
  const g = ctx.createGain();
  const lvl = gain * P.lvl;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(lvl, when + P.atk);
  g.gain.exponentialRampToValueAtTime(0.0001, when + P.dur);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  // 打擊小物擺在 hi-hat 的另一邊,兩個都在右邊的話高頻會擠成一坨
  if (pan) { pan.pan.value = P.pan || 0; src.connect(bp); bp.connect(g); g.connect(pan); pan.connect(percBus); }
  else { src.connect(bp); bp.connect(g); g.connect(percBus); }
  src.start(when, offset); src.stop(when + P.dur + 0.02);
  activeSources.add(src);
  src.onended = () => { activeSources.delete(src);
    try { src.disconnect(); bp.disconnect(); g.disconnect(); if (pan) pan.disconnect(); } catch (e) {} };
}

/* 鋸齒波:1/n 的諧波。K-Pop 的 pluck 與 supersaw 都用它 */
const SAW_PARTS = (() => { const a = [0]; for (let n = 1; n <= 24; n++) a.push(1 / n); return a; })();

/* ── 合成 pluck(K-Pop 的和聲樂器)───────────────────────────────
   兩顆差七音分的鋸齒 → 一顆會關起來的低通(5kHz 掉到 700Hz,Q 開到 5)
   → 很快衰減的包絡。那個「叮——」就是現在流行歌裡到處都是的 pluck。
   濾波器的包絡比音量的包絡更重要:只有音量衰減會得到一顆悶悶的鋸齒,
   要讓**亮度**跟著掉下來才有撥的感覺 */
function synthKeyNote(midi, when, dur, peak){
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const g = ctx.createGain();
  const lp = ctx.createBiquadFilter();
  lp.type = "lowpass";
  /* Q 收到 3.2、開口也收窄:開太大那個「叮」會變成刺耳的尖點,
     在 808 上面整個跳出來(被回報「lead synth 太突出」)。
     pluck 要有形狀但不要有存在感 */
  lp.Q.value = 3.2;
  /* ── 濾波器的落點要**絕對**,不可以整個跟著基頻跑 ──────────────
     原本是 `lo = max(380, f × 1.6)`。量出來的落點是:
     midi 36 落在 **5.8 倍**基頻、midi 53 落在 2.2 倍、midi 69 落在 **1.6 倍**
     ——**越高的音越暗**,1.6 倍等於只剩基音加一點二次諧波,
     高音在 0.17 秒後就變成一顆正弦。
     而聽的人是把**和弦最高音當旋律**的,所以整組裡最該亮的那顆最鈍,
     低音區反而相對最亮:音色的方向整個是反的(被回報「lead 聽起來很怪」)。

     真的合成器上這叫 **key tracking**,而且沒有人開到 100%——
     濾波器本來就是絕對頻率的東西,鍵盤追蹤通常只給二三成。
     `(f/262)^0.3` 就是三成:高音的落點會往上,但走得比基頻慢得多,
     所以**高音保住絕對亮度**,而「幾倍基頻」自然往下掉——
     真的樂器就是這樣(越高的音泛音越少),只是這裡的走向終於是對的。
     現在:midi 55 落在 1053Hz(5.4 倍)、midi 69 落在 1344Hz(3.1 倍)、
     midi 79 落在 1597Hz(2.0 倍) */
  /* 係數是量出來收過一次的:第一版寫 1150 與 (3.2 + 3.4×vel),
     方向對了但**整組太亮**——K-Pop 的 2kHz 一口氣多了 3.1dB,
     比 Pop 高 8dB,那就是以前被回報的「lead synth 太突出」。
     收到 950 與 (2.8 + 2.8×vel):落點照樣隨音高往上
     (midi 55 → 870Hz、69 → 1110Hz、79 → 1320Hz),只是整條低一階 */
  const vel = Math.max(0.25, Math.min(1, peak / 0.22));
  const track = Math.pow(f / 262, 0.3);
  const lo = 950 * track;
  const hi = Math.min(9500, lo * (2.8 + 2.8 * vel));
  lp.frequency.setValueAtTime(hi, when);
  lp.frequency.exponentialRampToValueAtTime(lo, when + 0.17);
  lp.connect(g);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  if (pan) {
    pan.pan.value = Math.max(-0.3, Math.min(0.3, (midi - 64) / 90));
    g.connect(pan); pan.connect(masterGain);
  } else g.connect(masterGain);
  // pluck 要濕:K-Pop 的和聲層一定掛著殘響。濕一點也是把它推遠的手段
  const send = ctx.createGain();
  send.gain.value = 0.52;
  (pan || g).connect(send); send.connect(reverbBus);
  /* **再送一份進乒乓延遲**。這是 K-Pop 的 pluck 跟「一台合成器」最大的差別:
     乾的是一顆一顆分開的音,掛上延遲才連成一條線 */
  let echo = null;
  if (echoBus) {
    /* 送多一點(0.34 → 0.44):lead 現在只住在高音的一小段,
       `pan` 那條音高對應的擺位幾乎擺不開(midi 62–69 只有 −0.02～+0.06)。
       真的 K-Pop 的 pluck 本來就泡在延遲裡,而延遲是硬擺左右 ±0.7 的,
       所以寬度交給它比硬拉 pan 誠實 */
    echo = ctx.createGain();
    echo.gain.value = 0.44;
    (pan || g).connect(echo); echo.connect(echoBus);
  }

  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(peak, when + 0.004);
  g.gain.setTargetAtTime(0.0001, when + 0.004, 0.16);
  const relStart = when + Math.max(dur, 0.05);
  g.gain.setTargetAtTime(0.0001, relStart, 0.08);
  const stopAt = relStart + 0.4;

  const wave = waveOf("saw", SAW_PARTS);
  const oscs = [];
  for (const cents of [-7, 7]) {
    const o = ctx.createOscillator();
    o.setPeriodicWave(wave);
    o.frequency.value = f * Math.pow(2, cents / 1200);
    o.connect(lp);
    o.start(when); o.stop(stopAt);
    oscs.push(o); activeSources.add(o);
  }
  let left = oscs.length;
  for (const o of oscs) {
    o.onended = () => {
      activeSources.delete(o);
      try { o.disconnect(); } catch (e) {}
      if (--left === 0) try { lp.disconnect(); g.disconnect(); send.disconnect();
        if (echo) echo.disconnect(); if (pan) pan.disconnect(); } catch (e) {}
    };
  }
}

/* ── 風琴與鋪底 ────────────────────────────────────────────────
   一顆和弦共用一條低通與一顆總 gain:四個音各自開濾波器的話節點翻四倍,
   而且四條濾波器的相位不一樣,和弦會散掉 */
/* 一顆音要疊幾顆振盪器、各差幾音分。**`spread` 與排程迴圈要吃同一份**,
   分開寫兩份的話聲部數一改就對不上(pan 會落在不存在的聲部上)。
   **低音鋪底一顆音只用一顆**:低頻的拍頻很慢很明顯,失諧疊兩顆會變成
   一秒抖兩下的嗡嗡聲(supersaw 的 ±13 在這個音域完全不能用) */
function voicesOf(kind){
  if (kind === "organ" || kind === "low") return [0];
  /* ── supersaw 是**七顆不等距**,不是三顆 ±13 ────────────────────
     三顆 ±13 音分的拍頻算得出來,C4 (261.63Hz) 上是
     **1.96 / 1.97 / 3.93 Hz**——三個離散的慢拍頻,耳朵數得出來,
     所以聽起來是「一組走音的三和弦」不是 supersaw(被回報 pad 很怪)。
     真的 supersaw(JP-8000)是**七顆、失諧不等距**:同一顆和弦上會有
     0.75 到 7.5Hz 之間一整片互不重合的拍頻,疊起來才糊成 shimmer。
     所以要加的是**顆數與不等距**,不是把 ±13 拉得更開——拉開只會更走音。
     刻意用不整齊的數字(−13.5 / 6.5 / 25.5)就是為了不讓拍頻對在一起 */
  if (kind === "supersaw") return [-24, -13.5, -5, 0, 6.5, 15, 25.5];
  return [-5, 5];
}
function playKeysChord(midis, when, dur, gain, kind){
  if (!midis.length) return;
  const organ = kind === "organ";
  /* `low` 是**低音鋪底**:一層只住在 120–400Hz 的鋸齒,不亮、不掃、不搶。
     它補的是量出來的那個洞(見 `FEELS.kpop.parts.klow`),所以濾波器兩邊都要關:
     上面切在 420Hz(再高就跟 pluck 撞),下面用高通切在 110Hz
     ——**一定要留給 808**,不切的話兩層低頻相加,尖峰直接爆掉 */
  const low = kind === "low";
  const g = ctx.createGain();
  const lp = ctx.createBiquadFilter();
  lp.type = "lowpass";
  lp.Q.value = organ ? 0.5 : 0.8;
  /* **supersaw 不掃濾波器,它一進來就是滿的**。原本是 1400 → 3400Hz 掃
     `min(dur × 0.7, 1.4)` = **1.4 秒**,而量到的和弦長度是 2.3 秒——
     等於每顆和弦有六成的時間在「打開」,每一下都「哇——」一聲。
     那是弦樂 swell 的手勢(八〇年代的),現在的 K-Pop supersaw 是
     **靜態而且亮**,它的起伏來自側鏈(`FEELS.kpop.duck.pad`)不是濾波器。
     `pad`(City Pop 的 Prophet-5)**保留那個掃**:那個年代就是這樣按的 */
  const swell = !organ && !low && kind !== "supersaw";
  lp.frequency.setValueAtTime(low ? 420 : organ ? 2600 : kind === "supersaw" ? 2900 : 900, when);
  if (swell) lp.frequency.linearRampToValueAtTime(2100, when + Math.min(dur * 0.7, 1.4));
  let head = lp;
  if (low) {
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 110; hp.Q.value = 0.7;
    lp.connect(hp); head = hp;
  }
  head.connect(g);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  if (pan) { pan.pan.value = organ ? -0.18 : 0; g.connect(pan); pan.connect(padBus); }
  else g.connect(padBus);
  /* Leslie / 合唱:共用那顆慢 LFO,但**深度要跟著這顆和弦的音量算**。
     直接把一顆固定振幅的 LFO 接到 `g.gain` 上是錯的——它是相加不是相乘,
     所以鋪底的音量只要一調小(0.075),±0.055 的 LFO 就變成 ±73% 的抖動,
     而且尖峰會被它推上去。這裡多開一顆 gain 把 LFO 縮成「音量的百分之幾」,
     一顆和弦一個節點,不是一個音一個 */
  /* 低音鋪底不掛 Leslie/合唱:那一層的工作是「穩穩撐住身體」,
     一抖就變成會呼吸的低頻,跟 808 的側鏈打架 */
  const lfoAmt = ctx.createGain();
  lfoAmt.gain.value = gain * (organ ? 0.17 : 0.09);
  if (slowLfo && !low) { try { slowLfo.connect(lfoAmt); lfoAmt.connect(g.gain); } catch (e) {} }

  /* supersaw 的起音從 0.16 收到 0.03:160 毫秒的淡入配上那條 1.4 秒的
     濾波器掃,等於整顆和弦都在進場。K-Pop 的那一片是**按下去就在那裡** */
  const atk = organ ? 0.012 : low ? 0.10 : kind === "supersaw" ? 0.03 : 0.34;
  const rel = organ ? 0.09 : low ? 0.4 : 0.7;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(gain, when + atk);
  g.gain.setTargetAtTime(0.0001, when + Math.max(dur, atk + 0.05), rel / 3);
  const stopAt = when + Math.max(dur, atk + 0.05) + rel + 0.3;

  const saw = kind === "supersaw" || low;
  const wave = organ ? waveOf("organ", ORGAN_PARTS)
             : saw ? waveOf("saw", SAW_PARTS) : waveOf("pad", PAD_PARTS);
  /* ── supersaw 要**寬**,不是只要厚 ───────────────────────────
     K-Pop 的招牌就是那一片又寬又厚的鋸齒。三顆失諧的鋸齒全部擺在正中間
     只會變厚不會變寬——量過 K-Pop 的左右相關係數是 **0.993**(幾乎是單聲道),
     對一個以 supersaw 為招牌的曲風來說那是錯的。
     失諧的那兩顆各自推到左右(±0.62)、中間那顆留在正中間,
     這就是 supersaw 的立體聲寬度真正的來源(不是殘響也不是 chorus)。
     一顆和弦只多三個節點(不是一個音三個),便宜 */
  /* **`pad` 也要分左右,不是只有 supersaw**。漏掉那一版量到 City Pop 的
     L/R 相關係數 0.914–0.938(目標 0.3–0.9)——那層鋪底是撐著的長音、
     又整個擺在正中間,一個人就把整首拉回單聲道。
     位置照聲部數量算(兩顆就 ±0.5、三顆就 ±0.62 加中間),
     不要拿固定三格去 mod:兩顆和弦用前兩格會變成「一顆左、一顆中」的偏心 */
  /* **位置照失諧量走**:失諧越多的擺越外側,沒失諧的那顆留正中間。
     這樣「寬」跟「厚」變成同一件事的兩面——中間乾淨、邊緣飄。
     原本是寫死的三格再拿 `vi % 3` 去對,顆數一改就對不上
     (七顆會變成兩顆半擠在同一個位置);照失諧量算就永遠是對的 */
  const vlist = voicesOf(kind);
  const wide = (kind === "supersaw" || kind === "pad") && ctx.createStereoPanner;
  const vmax = Math.max(...vlist.map(Math.abs)) || 1;
  /* 用開根號不用線性:線性的話失諧小的那幾顆會全部擠在中間
     (七顆的平均 |pan| 只有 0.43,比原本三顆的 0.41 幾乎沒進步,
      量到 L/R 相關反而從 0.883 升到 0.901,出了 0.3–0.9 那一帶)。
     開根號把中間那幾顆也推出去,中央只留真正沒失諧的那一顆 */
  const spread = wide ? vlist.map(c => {
    const sp = ctx.createStereoPanner();
    sp.pan.value = c === 0 ? 0
      : Math.sign(c) * 0.70 * Math.sqrt(Math.abs(c) / vmax);
    sp.connect(lp);
    return sp;
  }) : null;
  const oscs = [];
  for (const m of midis) {
    const f = 440 * Math.pow(2, (m - 69) / 12);
    /* 鋪底疊兩顆微微失諧的,風琴只要一顆(Hammond 的泛音是齒輪轉出來的,不會飄)。
       **supersaw 疊三顆、失諧拉到 ±13 音分**:K-Pop 的和聲層就是那一片
       又寬又厚的鋸齒,兩顆差五音分聽起來只是「有點抖」,不是 supersaw */
    for (let vi = 0; vi < vlist.length; vi++) {
      const cents = vlist[vi];
      const o = ctx.createOscillator();
      o.setPeriodicWave(wave);
      o.frequency.value = f * Math.pow(2, cents / 1200);
      o.connect(spread ? spread[vi] : lp);
      o.start(when); o.stop(stopAt);
      oscs.push(o);
      activeSources.add(o);
    }
  }
  let left = oscs.length;
  for (const o of oscs) {
    o.onended = () => {
      activeSources.delete(o);
      try { o.disconnect(); } catch (e) {}
      if (--left === 0) {
        try { if (slowLfo && !low) slowLfo.disconnect(lfoAmt); } catch (e) {}
        try { lfoAmt.disconnect(); lp.disconnect(); if (head !== lp) head.disconnect();
              if (spread) for (const sp of spread) sp.disconnect();
              g.disconnect(); if (pan) pan.disconnect(); } catch (e) {}
      }
    };
  }
  /* Hammond 的招牌:按鍵瞬間那一聲「喀」。沒有它就只是一組正弦疊音 */
  if (organ) {
    const { src, offset } = noiseSrc(0.02);
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 2200;
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(gain * 0.5, when);
    cg.gain.exponentialRampToValueAtTime(0.0001, when + 0.02);
    src.connect(hp); hp.connect(cg); cg.connect(padBus);
    src.start(when, offset); src.stop(when + 0.03);
    activeSources.add(src);
    src.onended = () => { activeSources.delete(src);
      try { src.disconnect(); hp.disconnect(); cg.disconnect(); } catch (e) {} };
  }
}

/* ── 808:整套都是算出來的 ─────────────────────────────────────
   每一顆都接在 drumBus 上,跟取樣鼓走同一條音量鏈路,所以不用另外調整體音量。
   雜訊一律走共用的那份(`noiseSrc`),不要每打一下就配置一個新的 buffer——
   放克一小節十六下 hi-hat 就是十六次配置,那是卡頓的來源之一 */

/* 合成音沒有「錄音時的音量」可言:同一個 gain 下,808 的正弦大鼓比實錄大鼓大十二倍、
   疊方波的 hi-hat 甚至是取樣的四十倍(gain=1 時量的 peak:取樣大鼓 0.084 / 808 大鼓 1.065、
   取樣 hi-hat 0.022 / 808 hi-hat 0.917)。這張表先把每一顆拉回跟爵士鼓組同一個刻度,
   `FEELS[x].kickGain` 那幾個數字對兩套鼓才是同一個意思。
   沒有它的話 K-Pop 一按下去就削波(踩過:peak 1.12、rms −6.4 dBFS) */
/* 808 金屬音色(hi-hat / ride / crash 共用)。六顆方波疊起來再過兩段一階高通,
   整段直接用 JS 算完存成 buffer——這是固定音色,沒有理由每打一下重做一次 */
let hat808Cache = null;
function hat808Buf(){
  if (hat808Cache) return hat808Cache;
  const sr = ctx.sampleRate;
  const len = Math.floor(sr * 1.3);
  const buf = ctx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  const ratios = [2, 3, 4.16, 5.43, 6.79, 8.21];
  const base = 180;
  for (let i = 0; i < len; i++) {
    const t = i / sr;
    let v = 0;
    for (let k = 0; k < ratios.length; k++) {
      const ph = t * base * ratios[k];
      v += (ph - Math.floor(ph)) < 0.5 ? 1 : -1;
    }
    d[i] = v / ratios.length;
  }
  // 兩段一階高通 ≈ 原本 biquad 那組的落點
  const hp = (fc) => {
    const a = 1 / (1 + 2 * Math.PI * fc / sr);
    let yp = 0, xp = 0;
    for (let i = 0; i < len; i++) {
      const x = d[i];
      const y = a * (yp + x - xp);
      d[i] = y; yp = y; xp = x;
    }
  };
  hp(7600); hp(7600);
  let peak = 0;
  for (let i = 0; i < len; i++) { const av = Math.abs(d[i]); if (av > peak) peak = av; }
  if (peak > 0) { const gg = 0.95 / peak; for (let i = 0; i < len; i++) d[i] *= gg; }
  hat808Cache = buf;
  return buf;
}

/* ══ 真的 TR-808 取樣 ═══════════════════════════════════════════
   **被回報「City Pop 的音色比 K-Pop 好聽多了」**。查下去原因很直接:
   City Pop 是 Rhodes 取樣 + 真吉他取樣 + 實錄鼓,**K-Pop 從頭到尾一顆取樣都沒有**
   ——pluck、supersaw、arp、808 鼓、808 低音、人聲切片全部是振盪器。

   而且量過之後發現合成的 808 hi-hat 是錯的:原本六顆方波排在
   360–1478Hz(`ratios × 180`),真的 TR-808 是 **205.3 / 304.4 / 369.6 /
   522.7 / 540 / 800 Hz** 過一顆 10kHz 帶通。頻率整組不對,而且再兩段 7.6kHz
   高通之後剩下的其實是方波的混疊——那就是它聽起來不金屬的原因。
   hi-hat 是這個曲風打最多下的東西(一小節十六下),它不像就整首不像。

   所以改成**真的 TR-808 取樣**(Dirt-Samples,TidalCycles 那組,授權可用)。
   這條改掉了原本「808 是合成的,一個檔案都不下載」那條規則——
   理由是那條當初寫的是「TR-808 本來就是合成鼓機」,沒錯,但**真的製作是用
   那台機器的取樣**,不是自己重寫它的電路。整組八個檔案加起來不到 400KB。

   **WAV 不是 mp3 也不是 FLAC**:`decodeAudioData` 對 WAV 的支援是最好的
   (鼓那組 FLAC 在舊 iOS 上踩過)。
   **`synth808` 留著當備援**,位置跟 `synthDrum` 一樣——載不到就掉回去 */
/* ══ SM Drums(City Pop 的大鼓、小鼓、hi-hat)════════════════════════
   **為什麼換**:三首參考曲(Midnight Pretenders / Plastic Love / 真夜中のドア)的鼓軌,
   跟同一個鼓型換不同鼓組打出來的比 MERT 相似度(`tools/realism/kitcmp.py`,兩次不同力度):
   Virtuosity 0.860 / 0.847、Big Rusty 0.890 / 0.867、**SM Drums 0.920 / 0.912**。
   Virtuosity 是現場感的爵士鼓組,City Pop 要的是六七〇年代錄音室那種悶、緊、乾的鼓。
   SM Drums 是 1960 年代的 Ludwig Oyster Blue Pearl,小鼓取 **Snare65_NR**(NR = 悶住不共鳴)。
   **授權**:作者 Scott McLean 聲明免費、royalty free,商用也可以(App 上架沒問題)。
   使用者同意換的(換音源之前要先問,這條還是在)。

   - **只換大鼓、小鼓、hi-hat**,tom、鈸照舊用 Virtuosity——過門的鼓件一小節才一兩下
   - **響度照 Virtuosity 的力度曲線對齊**(`VIRT_DB`):兩組錄的電平不一樣,
     SM 最輕的小鼓(−27.9dB)比 Virtuosity 的幽靈音(−43.3dB)大 15dB,直接換的話幽靈音會變成正拍。
     所以每一下先照原本的規則算「要多大聲」,再挑 SM 裡音量最接近的那一層、差多少補多少
   - **檔案是 24-bit 立體聲 WAV,一顆 ~430KB**(Virtuosity 的十倍)。擋住播放的只有三件的中間那一層
     RR1(三個檔案),其餘力度層與 round robin 等真的開始播了才補(`drumFillGate`),解碼一顆一顆排隊
   - **載不到就掉回 Virtuosity**(`playSMSample` 回 false),跟 808 同一個做法:
     「取樣一定載得到」這個假設從來不能做
   - 沒有房間麥(這組的立體聲檔本來就是混好的),所以 SM 的鼓不送 `roomBus` */
const SRC_SM = [
  "https://cdn.jsdelivr.net/gh/sfzinstruments/SMDrums@main/",
  "https://raw.githubusercontent.com/sfzinstruments/SMDrums/main/",
];
// [檔名前綴(力度), 這一層前 150ms 的 RMS dB](量出來的,換層就要重量)
const SM_KIT = {
  kick:  { dir: "Samples/SMDrum Stereo (Samples)/Kik_Stereo", name: "Kik_Stereo",
           layers: [["10", -35.2], ["20", -25.9], ["28", -18.7]] },
  snare: { dir: "Samples/SMDrum Stereo (Samples)/Snare65_NR_Stereo", name: "Snare65_NR_Stereo",
           layers: [["08", -27.9], ["18", -23.9], ["28", -18.9]] },
  hihat: { dir: "Samples/SMD Cymbals Stereo (Samples)/Hi-Hat (Samples)/01 Hat Tight 1", name: "Hat_Tight_Cnt",
           layers: [["15", -47.0], ["30", -37.9], ["42", -34.8]] },
};
const SM_RR = [1, 2];
// Virtuosity 每一層(照 DRUM_LAYERS 的順序)前 150ms 的 RMS dB——SM 要對齊的目標
const VIRT_DB = { kick: [-52.5, -40.3, -28.6, -22.5], snare: [-43.3, -33.2, -29.9, -24.6, -20.6],
                  hihat: [-64.1, -54.3, -47.6, -34.2] };
const smBuffers = {}, smRR = {};
let smLoading = null;
function smKitOn(){ return typeof FEELS !== "undefined" && typeof feelNow !== "undefined" && (FEELS[feelNow] || {}).drumSet === "sm"; }
function smPath(piece, layer, rr){
  const K = SM_KIT[piece];
  return encodeURI(`${K.dir}/RR${rr}/${layer}_${K.name}_RR${rr}.wav`);
}
function ensureSM(){
  if (smLoading) return smLoading;
  const one = (piece, layer, rr) => fetchDecode(SRC_SM, smPath(piece, layer, rr)).then(buf => {
    const byLayer = smBuffers[piece] || (smBuffers[piece] = {});
    (byLayer[layer] || (byLayer[layer] = []))[rr - 1] = buf;
  }).catch(() => {});
  const pieces = Object.keys(SM_KIT);
  const mid = p => SM_KIT[p].layers[1][0];
  smLoading = pieces.reduce((c, p) => c.then(() => one(p, mid(p), 1)), Promise.resolve());
  smLoading.then(() => drumFillGate()).then(() => {
    const rest = [];
    for (const p of pieces) for (const [l] of SM_KIT[p].layers) for (const r of SM_RR)
      if (!(l === mid(p) && r === 1)) rest.push([p, l, r]);
    return rest.reduce((c, [p, l, r]) => c.then(() => one(p, l, r)), Promise.resolve());
  }).catch(() => {});
  return smLoading;
}
/* 播一顆 SM 的鼓。這一件沒載到任何一層就回 false,呼叫端照原本的 Virtuosity 走 */
function playSMSample(piece, when, gain, v){
  const K = SM_KIT[piece], got = smBuffers[piece], L = DRUM_LAYERS[piece];
  if (!K || !got || !L || !VIRT_DB[piece]) return false;
  const n = L.vl.length, idx = Math.max(0, Math.min(n - 1, Math.round(v * (n - 1))));
  const target = VIRT_DB[piece][idx];
  let best = null;
  for (const [name, db] of K.layers) {
    const bufs = (got[name] || []).filter(Boolean);
    if (!bufs.length) continue;
    if (!best || Math.abs(db - target) < Math.abs(best[1] - target)) best = [name, db, bufs];
  }
  if (!best) return false;
  const buf = best[2][(smRR[piece] = (smRR[piece] || 0) + 1) % best[2].length];
  const layerNorm = 1 + (0.5 - idx / Math.max(1, n - 1)) * 0.55;   // 跟 playDrum 同一條補償
  const g = ctx.createGain();
  g.gain.value = gain * layerNorm * Math.pow(10, (target - best[1]) / 20);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  if (pan) { pan.pan.value = DRUM_PAN[piece] || 0; g.connect(pan); pan.connect(drumBus); }
  else g.connect(drumBus);
  if (gateSend && piece === "snare") g.connect(gateSend);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  // 鼓件音色與悶音照樣吃 FEELS[x].drumTone / drumDamp(跟 playDrum 同一套)
  const f0 = feel();
  let head = g;
  const tone = f0.drumTone && f0.drumTone[piece];
  if (tone) for (let i = tone.length - 1; i >= 0; i--) {
    const [type, hz, db, q] = tone[i];
    const bq = ctx.createBiquadFilter(); bq.type = type; bq.frequency.value = hz; bq.gain.value = db; bq.Q.value = q || 0.9;
    bq.connect(head); head = bq;
  }
  src.connect(head);
  const damp = f0.drumDamp && f0.drumDamp[piece];
  if (damp) { g.gain.setValueAtTime(g.gain.value, when + damp[0]); g.gain.setTargetAtTime(0, when + damp[0], damp[1]); }
  src.start(when, leadOf(src.buffer));
  activeSources.add(src);
  src.onended = () => { activeSources.delete(src);
    try { src.disconnect(); g.disconnect(); if (pan) pan.disconnect(); } catch (e) {} };
  return true;
}

const SRC_D808 = [
  "https://cdn.jsdelivr.net/gh/tidalcycles/Dirt-Samples@master/",
  "https://raw.githubusercontent.com/tidalcycles/Dirt-Samples/master/",
];
/* 哪一顆用哪一個檔案。**長度是挑出來的不是隨便拿的**(量過每一顆)。
   `808bd/` 那一櫃是同一顆鼓的不同衰減設定,差距大得嚇人——
   量前 0.55 秒的能量(那是 100 BPM 一小節裡大鼓真的在響的窗):
   `BD0010` 1875、`BD0025` 233、`BD0000` 76,**第一顆是第二顆的八倍**。
   一開始拿了 `BD0010`(3 秒),結果 K-Pop 的 RMS 從 −11.2 衝到 −9.0、
   L/R 相關係數從 0.880 跳到 0.943——**一層一層關掉量出來,兩個數字
   整整齊齊都是這一顆大鼓造成的**(關掉它 −10.9 / 0.867,
   hi-hat、拍手、開放 hi-hat 關掉則是一點差別都沒有)。

   **那條三秒的長尾巴本來就不是大鼓的工作**:K-Pop 的長低音是
   `BASS_KITS.sub808` 那顆**有音高**的 808 在撐的,大鼓只負責音頭。
   兩層都撐三秒就是兩條四十赫茲的正弦疊在一起,那正是
   「808 大鼓的尾巴 0.52 秒」那條規則早就寫過的事。
   所以改取 **`BD0025`(0.5 秒)**,跟合成那版的 0.52 秒對得起來。
   - 開放 hi-hat 取 `OH10`(0.75 秒);`OH00` 只有 0.25 秒,聽起來是悶掉的閉合
   - rim 疊在拍手下面給音頭(見 `snareStack`) */
const D808_FILES = {
  kick:  "808bd/BD0025.WAV", snare: "808sd/SD0010.WAV",
  hihat: "808hc/HC00.WAV",   ohat:  "808oh/OH10.WAV",
  clap:  "cp/HANDCLP0.wav",  rim:   "808/RS.WAV",
  crash: "808cy/CY0050.WAV", ride:  "808cy/CY0000.WAV",
  htom:  "808mc/MC00.WAV",   ltom:  "808lc/LC00.WAV",
  xstick: "808/RS.WAV",      hhped: "808hc/HC10.WAV",
};
/* 取樣的電平跟合成那版完全不是同一個刻度(量過 peak:拍手 0.962、
   大鼓 0.705、hi-hat 0.573、cymbal 0.415),所以**另外一張 trim 表**。
   不要拿 `E808_TRIM` 硬套——那張是為合成音校正的 */
const D808_TRIM = { kick: 0.62, snare: 0.36, hihat: 0.24, ohat: 0.21,
                    clap: 0.36, rim: 0.3, crash: 0.18, ride: 0.21,
                    htom: 0.36, ltom: 0.36, xstick: 0.3, hhped: 0.21 };
/* **有幾顆要把尾巴剪掉**。鈸那兩顆錄了好幾秒,一小節打好幾下會疊起來。
   **大鼓不在這張表裡**:試過拿 `BD0010` 配 `gain` 的包絡去剪,
   剪完 RMS 只從 −8.6 回到 −9.0——**因為那三秒裡的能量幾乎全在前 0.55 秒,
   剪的是已經沒聲音的那一段**。換成本來就短的 `BD0025` 才是對的做法:
   選對錄音,不要用包絡去救錯的錄音 */
const D808_CUT = { ohat: 0.45, crash: 1.2, ride: 0.7, clap: 0.35 };
const d808Buffers = {};
let d808Loading = null;
function ensure808(){
  if (d808Loading) return d808Loading;
  /* 一顆一顆排隊解碼,跟吉他取樣同一條規則:`decodeAudioData` 在主執行緒上做,
     十二顆一起解會跟排程器搶(踩過,吉他那次 46ms → 73ms) */
  d808Loading = Object.keys(D808_FILES).reduce((chain, piece) =>
    chain.then(() => fetchDecode(SRC_D808, D808_FILES[piece])
      .then(buf => { d808Buffers[piece] = buf; })
      .catch(() => {})), Promise.resolve());
  return d808Loading;
}
/* 播一顆 808 取樣。找不到就回 false,呼叫端掉回 `synth808` */
function play808Sample(piece, when, gain){
  const buf = d808Buffers[piece];
  if (!buf) return false;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const g = ctx.createGain();
  const lvl = Math.max(0.0001, gain * (D808_TRIM[piece] || 0.4));
  g.gain.setValueAtTime(lvl, when);
  const cut = D808_CUT[piece];
  if (cut) g.gain.setTargetAtTime(0.0001, when + cut, cut * 0.28);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  if (pan) { pan.pan.value = DRUM_PAN[piece] || 0; src.connect(g); g.connect(pan); pan.connect(drumBus); }
  else { src.connect(g); g.connect(drumBus); }
  src.start(when, leadOf(src.buffer));
  if (cut) src.stop(when + cut * 2.2);
  activeSources.add(src);
  src.onended = () => { activeSources.delete(src);
    try { src.disconnect(); g.disconnect(); if (pan) pan.disconnect(); } catch (e) {} };
  return true;
}
const E808_TRIM = { kick: 0.056, snare: 0.30, clap: 1.05, xstick: 1.05,
                    /* 金屬那幾顆的數字跟別人差一個量級,因為它們走的是預先算好的
                       buffer(見 `hat808Buf`),絕對電平跟現場疊方波那版不一樣。
                       改了那個 buffer 的濾波就要重量這幾個 */
                    hihat: 0.145, hhped: 0.145, ride: 0.145, crash: 0.10,
                    htom: 0.10, ltom: 0.10 };
/* ── 側鏈:大鼓一落,低音讓一下 ────────────────────────────────
   808 的大鼓與 808 的低音**是同一顆音色**,都是四五十赫茲的正弦。
   兩條正弦疊在一起是直接相加(正弦的波峰因數是 1,所有能量都在尖峰上),
   所以只要相位對上就會衝破 1.0——量到過 1.16 並且真的削波。

   把低音調小不是辦法,那樣尖峰反而更高:大鼓本來在踩限幅器、順便壓住別人,
   一收小限幅器就放手,撐著的那幾層整個爬上來(實測 0.98 → 1.04)。

   對的做法是**側鏈**:大鼓落下的那一瞬間把低音壓掉三分之二,110 毫秒後放回來。
   這不是為了修 bug 才加的補丁——真的 K-Pop / trap 混音一定會做這件事,
   那個「一呼一吸」就是這個曲風的味道。只有 808 低音的曲風才套 */
/* ── 側鏈:深度寫在 `FEELS[x].duck` 裡,不是寫死給 808 ─────────────
   **哪些曲風要側鏈是有答案的,而且不是「全部都要」**:

   - **K-Pop 要而且要深**(bass 0.22 / pad 0.45):808 的大鼓與 808 的低音
     是同一顆音色,都是四五十赫茲的正弦,波峰因數是 1(能量全在尖峰上),
     相位一對上就直接相加。那個「一呼一吸」就是這個曲風的味道
   - **Funk 要但要很淺**(0.70):真的放克混音會管一下大鼓與貝斯的重疊,
     但放克的身分是**大鼓跟貝斯互相咬合**——壓深了律動就死了。
     而且它們的格子本來就刻意錯開(`[0,3,10]` vs `[0,6,10,14]`),很少真的撞上
   - **Pop 給一點點**(0.80):現代流行混音會讓貝斯在大鼓下面稍微退一步,
     低頻才收得緊
   - **City Pop 不給**:它是 1980 年的日本 AOR,那個年代的混音沒有這種
     「打氣」的聲音。這是年代的事不是技術的事——加了就變成現代流行
   - **Bossa / Swing / Blues 一律不給**。低音提琴在 feathering 的大鼓下面
     一呼一吸,聽起來是壞掉不是混音。**acoustic 的曲風不側鏈**,這條沒有例外 */
function duckBass(when){
  const d = (FEELS[feelNow] || {}).duck;
  if (!d) return;
  if (bassBus && d.bass) {
    const g = bassBus.gain;
    g.cancelScheduledValues(when);
    g.setTargetAtTime(BASS_BUS_LEVEL * d.bass, when, 0.006);
    g.setTargetAtTime(BASS_BUS_LEVEL, when + (d.rel || 0.13), 0.06);
  }
  /* 鋪底也一起讓。trap 的「一呼一吸」是整個混音在動不是只有低音,
     而且鋪底是撐著的那一層——限幅器在大鼓的空隙裡放手時就是它爬上來。
     K-Pop 的 `klow` 住在 110–420Hz,正好疊在大鼓的身體上,所以它一定要跟著讓 */
  if (padBus && d.pad) {
    const pg = padBus.gain;
    pg.cancelScheduledValues(when);
    pg.setTargetAtTime(PAD_BUS_LEVEL * d.pad, when, 0.008);
    pg.setTargetAtTime(PAD_BUS_LEVEL, when + (d.rel || 0.13), 0.07);
  }
}

function synth808(piece, when, gain){
  gain *= (E808_TRIM[piece] || 0.1);
  const g = ctx.createGain();
  g.connect(drumBus);
  const done = (node, stopAt) => {
    activeSources.add(node);
    node.onended = () => { activeSources.delete(node); try { node.disconnect(); g.disconnect(); } catch (e) {} };
    node.stop(stopAt);
  };

  /* 808 大鼓:一顆正弦從 110Hz 滑到 44Hz,尾巴拖很長(0.9 秒)。
     那條尾巴就是 808 跟真大鼓最大的差別——真大鼓是「咚」,808 是「咚——」。
     前面再疊一顆極短的高頻點擊,不然在小喇叭上只剩空氣 */
  if (piece === "kick") {
    // 側鏈已經在 `playDrum` 開頭觸發過了(它是 synth808 唯一的呼叫端),
    // 這裡不要再排一次——同一個 gain 上疊兩組 setTargetAtTime 只會互相打斷
    const o = ctx.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(110, when);
    o.frequency.exponentialRampToValueAtTime(52, when + 0.07);
    /* 尾巴收在 0.52 秒。808 的招牌是「咚——」沒錯,但一小節三顆全部拖 0.9 秒
       就會疊成一條不會停的低頻,整首的 RMS 被它一個人拉高 5dB(量過) */
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(gain * 1.15, when + 0.0015);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.52);
    o.connect(g); o.start(when); done(o, when + 0.56);
    const { src: click, offset: co } = noiseSrc(0.006);
    const cg = ctx.createGain();
    cg.gain.value = gain * 0.22;
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 1200;
    click.connect(hp); hp.connect(cg); cg.connect(drumBus);
    click.start(when, co); click.stop(when + 0.02);
    return;
  }

  /* 808 小鼓:兩顆正弦(基音 + 泛音)加一層帶通雜訊。
     K-Pop 多半拿它當幽靈音,拍手才是 backbeat,所以收得比拍手輕 */
  if (piece === "snare") {
    const o = ctx.createOscillator();
    o.type = "triangle";
    o.frequency.setValueAtTime(190, when);
    o.frequency.exponentialRampToValueAtTime(150, when + 0.09);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, when);
    og.gain.linearRampToValueAtTime(gain * 0.5, when + 0.0012);
    og.gain.exponentialRampToValueAtTime(0.0001, when + 0.11);
    o.connect(og); og.connect(drumBus);
    o.start(when); done(o, when + 0.13);
    const { src: n, offset: no } = noiseSrc(0.2);
    const bp = ctx.createBiquadFilter();
    bp.type = "highpass"; bp.frequency.value = 1500;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(gain * 0.75, when + 0.0012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.16);
    n.connect(bp); bp.connect(g);
    n.start(when, no); n.stop(when + 0.18);
    return;
  }

  /* 拍手:三顆很短的雜訊排在 9 毫秒裡再拖一條尾巴。
     一顆下去只是雜訊,要三顆錯開才聽得出是「一群人在拍」 */
  if (piece === "clap" || piece === "xstick") {
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 1450; bp.Q.value = 1.1;
    bp.connect(g);
    g.gain.value = 1;
    for (let k = 0; k < 3; k++) {
      const { src: n, offset: no } = noiseSrc(0.014);
      const ng = ctx.createGain();
      const t0 = when + k * 0.009;
      /* 每一顆都給 1.5 毫秒的起音。硬邊緣的雜訊爆點會整個穿過限幅器的
         啟動時間,整首的尖峰被它一個人推到 0.98(量過);拍手的聽感不變 */
      ng.gain.setValueAtTime(0.0001, t0);
      ng.gain.linearRampToValueAtTime(gain * (0.7 + k * 0.12), t0 + 0.0015);
      ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.014);
      n.connect(ng); ng.connect(bp);
      n.start(t0, no); n.stop(t0 + 0.016);
    }
    const { src: tail, offset: to } = noiseSrc(0.16);
    const tg = ctx.createGain();
    tg.gain.setValueAtTime(gain * 0.5, when + 0.026);
    tg.gain.exponentialRampToValueAtTime(0.0001, when + 0.17);
    tail.connect(tg); tg.connect(bp);
    tail.start(when + 0.026, to); done(tail, when + 0.19);
    return;
  }

  /* 808 的 hi-hat 是六顆方波疊出來的金屬感,不是雜訊。
     用雜訊做的 hat 在十六分走滿的時候會糊成一片「嘶——」,
     疊方波才有那種一顆一顆分得開的顆粒。

     **但不要每打一下就開六顆振盪器**:K-Pop 與放克一小節走十六下,
     那是一小節九十六顆振盪器,CPU 降速六倍時排程一跳要 80ms(量過)。
     這個音色是固定的,所以**開場算一次存成 buffer**,之後每一下就只是
     一個 buffer source 加一顆 gain——兩個節點取代九個。
     開鈸、ride、crash 用同一份,靠 playbackRate 換明暗、靠包絡換長短 */
  if (piece === "hihat" || piece === "hhped" || piece === "ride" || piece === "crash") {
    const open = piece === "ride" ? 0.32 : piece === "crash" ? 1.1 : piece === "hhped" ? 0.07 : 0.042;
    const rate = piece === "crash" ? 0.62 : piece === "ride" ? 0.85 : piece === "hhped" ? 1.06 : 1;
    const src = ctx.createBufferSource();
    src.buffer = hat808Buf();
    src.playbackRate.value = rate;
    /* **起音不能是瞬間的**。限幅器的 attack 是 1 毫秒,比它還快的爆點會整個穿過去,
       疊在已經在限幅的訊號上就直接衝破 1.0(量過:K-Pop 的尖峰到過 1.19)。
       1.2 毫秒聽起來一樣脆,但限幅器抓得到 */
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(gain * 0.5, when + 0.0012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + open);
    src.connect(g);
    src.start(when); src.stop(when + open + 0.02);
    activeSources.add(src);
    src.onended = () => { activeSources.delete(src);
      try { src.disconnect(); g.disconnect(); } catch (e) {} };
    return;
  }

  // tom:808 的 tom 跟大鼓同一個做法,只是掉得少、收得快
  const f0 = piece === "htom" ? 320 : 190;
  const o = ctx.createOscillator();
  o.type = "sine";
  o.frequency.setValueAtTime(f0, when);
  o.frequency.exponentialRampToValueAtTime(f0 * 0.55, when + 0.2);
  g.gain.setValueAtTime(gain, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 0.42);
  o.connect(g); o.start(when); done(o, when + 0.44);
}

function playBassNote(midi, when, dur, peak){
  when += humanTime("bass", when, 302);
  /* 每個曲風的貝斯份量不一樣,寫在 `FEELS[x].bassGain` 裡,
     跟 `kickGain` / `snareGain` / `cymGain` 同一個做法(沒寫就是 1,零差異)。
     **不要在排程裡針對某一種曲風寫 if** */
  peak *= (feel().bassGain || 1);
  const g = ctx.createGain();
  g.connect(bassBus);
  let src;
  const kitNow = bassKit();

  /* 808 的低音:一顆正弦,音頭從高八度快速滑下來(那一下的「咚」),
     然後整顆音撐著不衰減。K-Pop 的低音跟大鼓其實是同一顆音色,
     所以它跟 synth808 的 kick 用同一組參數想——差別只在它有音高、會撐長 */
  if (BASS_KITS[kitNow].synth) {
    peak *= BASS_KITS[kitNow].trim || 1;
    const o = ctx.createOscillator();
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    o.type = "sine";
    /* **808 的招牌是滑音**。前一顆音還在同一段落裡的時候,這一顆不是「重新彈一次」
       而是從前一顆的音高**滑過來**——現在的 K-Pop / trap 低音線幾乎每一顆都這樣。
       沒有滑音的 808 聽起來只是「一台很低的合成器」,那是被回報
       「聽起來不像 K-Pop」的原因之一。
       第一顆(沒有前一顆可滑)就走原本的音頭:從高八度快速掉下來 */
    const glide = last808.midi >= 0 && when - last808.at < 2.4 && last808.midi !== midi;
    if (glide) {
      const fp = 440 * Math.pow(2, (last808.midi - 69) / 12);
      o.frequency.setValueAtTime(fp, when);
      o.frequency.exponentialRampToValueAtTime(f, when + 0.085);
    } else {
      o.frequency.setValueAtTime(f * 1.9, when);
      o.frequency.exponentialRampToValueAtTime(f, when + 0.045);
    }
    const prev808 = last808.midi;          // 諧波層要跟著同一條滑音,先留起來
    last808.midi = midi; last808.at = when;
    /* ── 808 的中低頻諧波層(「飽和」那一層)─────────────────────
       被回報「K-Pop 的聲音不夠飽滿,太單薄了」。量了八度頻帶之後找到原因:
       **120–250Hz 有一個 10dB 的洞**(K-Pop −14.9dB,Pop −4.1、Funk −5.9)。
       808 的正弦全部擠在 30–60Hz、pluck 從 250Hz 才開始,
       中間那段「身體」沒有人在。那正是單薄的定義。

       真的 808 混音**一定會過飽和**——不是為了破音,是因為純正弦在手機與
       筆電喇叭上根本放不出來,要靠諧波讓耳朵補出基音。
       所以這裡疊一顆**跟著滑音走的鋸齒**,用 100–460Hz 的帶通切出來:
       45Hz 的基音在這一段剛好是第 3 到第 10 泛音,正好把洞填起來。
       原本只有一顆 0.085 的三次諧波,而且**它不跟著滑音走**(音頭會分岔) */
    const h = ctx.createOscillator();
    h.type = "sawtooth";
    if (glide) {
      const fp = 440 * Math.pow(2, (prev808 - 69) / 12);
      h.frequency.setValueAtTime(fp, when);
      h.frequency.exponentialRampToValueAtTime(f, when + 0.085);
    } else {
      h.frequency.setValueAtTime(f * 1.9, when);
      h.frequency.exponentialRampToValueAtTime(f, when + 0.045);
    }
    const hHp = ctx.createBiquadFilter();
    hHp.type = "highpass"; hHp.frequency.value = 100; hHp.Q.value = 0.7;
    const hLp = ctx.createBiquadFilter();
    hLp.type = "lowpass"; hLp.frequency.value = 460; hLp.Q.value = 0.7;
    const hg = ctx.createGain();
    hg.gain.value = 0.5;
    h.connect(hHp); hHp.connect(hLp); hLp.connect(hg); hg.connect(g);
    o.connect(g);
    const len = Math.max(dur, 0.12);
    /* **要衰減,不要撐平**。808 的長音本來就是敲一下之後慢慢消,
       撐在九成音量的話它跟大鼓的尾巴會連成一條不斷的低頻牆
       (整首 RMS 被拉到 −7 dBFS,比其他曲風大 5dB,換曲風會嚇到人) */
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak * 1.1, when + 0.008);
    g.gain.setTargetAtTime(peak * 0.34, when + 0.008, 0.26);
    g.gain.setTargetAtTime(0.0001, when + len, 0.055);
    const stopAt = when + len + 0.5;
    o.start(when); o.stop(stopAt);
    h.start(when); h.stop(stopAt);
    activeSources.add(o); activeSources.add(h);
    const bye = () => { activeSources.delete(o); activeSources.delete(h);
      try { o.disconnect(); h.disconnect(); hHp.disconnect(); hLp.disconnect();
            hg.disconnect(); g.disconnect(); } catch (e) {} };
    o.onended = bye; h.onended = bye;
    return;
  }

  const bank = bassBuffers[kitNow];
  const keys = [...bank.keys()];
  if (keys.length) {
    let best = keys[0];
    for (const k of keys) if (Math.abs(k - midi) < Math.abs(best - midi)) best = k;
    const list = bank.get(best);
    // 同一個音高輪流用不同的那一份:走動低音一小節四顆,用同一份就是機器在按
    const buf = list[bassRR++ % list.length];
    src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = Math.pow(2, (midi - best) / 12);
    const needed = (dur + 0.4) * src.playbackRate.value;
    if (buf.duration < needed && buf.duration > 0.3) {
      src.loop = true;
      const loopLen = Math.min(0.5, buf.duration * 0.3);
      src.loopStart = Math.max(0, buf.duration - loopLen);
      src.loopEnd = buf.duration;
    }
  } else {
    // 備援貝斯:三角波加一顆低通,至少低音還在
    src = ctx.createOscillator();
    src.type = "triangle";
    src.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 700;
    src.connect(lp); lp.connect(g);
  }
  /* **輕的那一顆要暗**,跟鋼琴同一條規則(見 `playNote` 的 velRef)。
     取樣只有 mf 一層力度,走動低音的經過音、放克的幽靈音都是照 gain 調小的——
     只調小聲的話每一顆的指板噪音與弦的亮度都一模一樣,那就是「MIDI 貝斯」。
     真的貝斯手撥輕一點,2–4kHz 那段的撥弦聲整個縮回去。
     0.56 是量出來的「用力撥」的 peak(七個曲風的最大值都落在這裡) */
  const bVelRef = 0.56;
  const bVel = Math.max(0.3, Math.min(1, peak / bVelRef));
  if (src.buffer) {
    // 備援的三角波已經自己接了一顆低通,只有取樣這一路要補
    if (bVel < 0.95) {
      const btone = ctx.createBiquadFilter();
      btone.type = "lowpass";
      btone.frequency.value = 500 + 6000 * Math.pow(bVel, 1.8);
      btone.Q.value = 0.4;
      src.connect(btone); btone.connect(g);
    } else src.connect(g);
  }
  // 貝斯不像鋼琴會一路自然衰減,撐住整個音長再收
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(peak, when + 0.012);
  g.gain.setTargetAtTime(peak * 0.75, when + 0.012, 0.35);
  g.gain.setTargetAtTime(0.0001, when + Math.max(dur, 0.08), 0.07);
  const stopAt = when + Math.max(dur, 0.08) + 0.45;
  src.start(when, leadOf(src.buffer));
  src.stop(stopAt);
  activeSources.add(src);
  src.onended = () => { activeSources.delete(src); try { src.disconnect(); g.disconnect(); } catch (e) {} };
}

/* ══ 播放狀態 ══════════════════════════════════════════════════
   排程用 AudioContext.currentTime 提前排,setInterval 只負責「每隔一陣子來看一下」,
   不決定任何一個音的實際時間點——setTimeout 的抖動會直接變成拍子飄。 */
const LOOKAHEAD_SEC = 0.15;   // 往前排多少秒
const TICK_MS = 25;           // 排程器多久醒來一次

let playing = false;
let tickTimer = null;
let rafId = null;
let spb = 0.6;          // 每拍幾秒
let anchorBeat = 0;     // 錨點:這個拍號…
let anchorTime = 0;     // …對應到這個 ctx 時間
let nextBeat = 0;       // 下一個還沒排的拍
let countInBeats = 0;
let endBeat = Infinity; // 不循環時的結束拍
let voicings = [];
let parsed = { bars: [], overflow: false };

function beatTime(i){ return anchorTime + (i - anchorBeat) * spb; }

/* ── 微時值:真的樂手不會落在同一個取樣上 ──────────────────────────
   被回報「聽起來不夠靈活、不夠專業」。查下去是一件很基本的事:
   **整份檔案裡沒有任何一處對「時間」做人性化**——`humanize()` 只動 gain
   (而且只有 0.92–1.08,±0.7dB),所以每一顆音都精準落在數學格子上,到取樣級。
   鼓、貝斯、鋼琴、吉他同一格的音是**同一個取樣**一起下去的,
   那在真的錄音裡不可能發生,而那正是「像機器」最根本的來源——
   比節奏型固定、比力度平更根本。

   三件事一起做:
   1. **每一層各自抖**(`micro`):量不一樣,鼓最緊、鍵盤最鬆
   2. **每個曲風有自己的 pocket**(`FEELS[x].pocket`):貝斯落後一點、
      切音吉他往前一點,那是「律動」不是「不準」
   3. **和弦的音不要同時落下**(`chordRoll`):鍵盤手的五根手指不可能同時到

   **種子是「音樂上的位置」不是時鐘**(`tickAt`):一拍切 48 格,
   同一個小節的同一格永遠抖同一個量。用 `Math.random()` 的話連
   「這一下到底偏了多少」都不能重現,量出來的尖峰也會跟著飄——
   跟 `hash01` 那條規則是同一件事 */
/* ══ 取樣開頭的空白 ═══════════════════════════════════════════
   **每一套取樣在起音之前都有一段空白,而且長度不一樣**(量到峰值 10% 的中位數):
   SM 鼓 0.4ms、Virtuosity 8.7ms、Salamander **14.3ms**、Gretsch **20.5ms**、
   電貝斯 **25.4ms**、Tone.js 吉他 **29.1ms**(最多 57ms)、低音提琴與 Rhodes 不到 1ms。
   照原樣從第 0 個取樣播,City Pop 等於**鼓準時、鋼琴晚 14ms、吉他晚 20ms、貝斯晚 25ms**——
   整團落在鼓後面、又各晚各的,那就是「不緊」的聲音(分軌量到貝斯比參考曲多落後 19ms)。
   所以每一份 buffer 第一次用到時找它真正的起音(第一個超過前 0.3 秒峰值 10% 的取樣),
   往前留 2ms 不切到音頭,從那裡開始播。算一次就記住(`WeakMap`)。
   **新增任何取樣播放都要 `start(when, leadOf(buffer))`**,不然那一層又會晚 */
const LEADS = new WeakMap();
function leadOf(buf){
  if (!buf) return 0;
  let v = LEADS.get(buf);
  if (v !== undefined) return v;
  const n = Math.min(buf.length, Math.floor(buf.sampleRate * 0.3));
  const chs = [];
  for (let c = 0; c < Math.min(2, buf.numberOfChannels); c++) chs.push(buf.getChannelData(c));
  let pk = 0;
  for (const d of chs) for (let i = 0; i < n; i++) { const a = Math.abs(d[i]); if (a > pk) pk = a; }
  let at = 0;
  if (pk > 0) {
    outer: for (let i = 0; i < n; i++) for (const d of chs) if (Math.abs(d[i]) > pk * 0.1) { at = i; break outer; }
  }
  v = Math.min(0.08, Math.max(0, at / buf.sampleRate - 0.002));
  LEADS.set(buf, v);
  return v;
}
const TICKS = 48;
function tickAt(when){ return Math.round((anchorBeat + (when - anchorTime) / spb) * TICKS); }
/* `ms` 是**毫秒**,回傳要挪多少秒(正負都有)。沒在播的時候回 0:
   那時候 `anchorTime` 還沒錨定,算出來的格號沒有意義 */
function micro(when, salt, ms){
  if (!ms || !playing || !spb) return 0;
  return (hash01(tickAt(when), salt) - 0.5) * (ms / 500);
}
/* ══ 像真人的時間(`FEELS[x].timing`,沒寫就完全照舊 `micro` + `pocket`)══════════
   參考曲分軌量到的(`tools/realism/groove.py`,db/groove.json)加上文獻,四件事:
   1. **偏差是長程相關的,不是每一下各自亂數**(Hennig et al. 2011 PLoS ONE:人的節奏偏差
      是長程相關的,聽眾也明顯偏好這種;Räsänen et al. 2015 分析 Jeff Porcaro〈I Keep Forgettin'〉
      的 hi-hat 也是)。做法:2 / 8 / 32 拍三個尺度的平滑雜訊相加(越長的尺度量越大,近似 1/f),
      `corr` 是這一部分佔的比例;`ens` 是整團共用的比例(一起稍微趕、一起稍微拖,那是一個團在呼吸)
   2. **短程反相關**(同一篇 Porcaro:晚了一下,下一下就往回拉):白雜訊那一部分用
      `e[n] − anti·e[n−1]`(前一個十六分)
   3. **拍點上緊、拍點之間鬆**(`weak`):參考曲的時間標準差拍點上 9ms、其餘 13–20ms
   4. **拍點之間的十六分系統性地晚一點**(`lag16`,毫秒,一拍四格):參考曲量到大鼓、小鼓、
      貝斯、鍵盤在「e」「&」「a」上比拍點晚 10–20ms(我們的只有 0–3)。
      **只取差距的一半**:Senn et al. 2016 / Frühauf et al. 2013 都量到微時值超過真人的量,
      律動評分就往下掉——寧可不足,不要誇張
   量級照舊是 `micro`(毫秒),總標準差不變,只是換成會「走」的偏差 */
function vnoise(x, seed){
  const i = Math.floor(x), f = x - i, u = (1 - Math.cos(f * Math.PI)) / 2;
  const a = hash01(i, seed) * 2 - 1, b = hash01(i + 1, seed) * 2 - 1;
  return a + (b - a) * u;
}
function driftAt(beat, seed){
  // 三個尺度,量 ∝ √週期(近似 1/f),合起來的標準差約 0.58(跟 ±1 均勻分布一樣)
  return (vnoise(beat / 2, seed) * 0.33 + vnoise(beat / 8, seed + 17) * 0.47 + vnoise(beat / 32, seed + 29) * 0.66) * 0.58 / 0.53;
}
const LAYER_SEED = { keys: 11, gtr: 23, bass: 37, kick: 41, snare: 53, hat: 67 };
function humanTime(name, when, salt){
  const T = feel().timing;
  /* `tie`:這一層直接用另一層的偏差(同一個種子、同一個量、同一組 lag16)。
     貝斯綁大鼓 = 兩個人同一格落下時是同一個時間;pocket 還是各自的 */
  const own = name;
  if (T && T.tie && T.tie[name]) { name = T.tie[name]; salt = 303 + name.length; }
  const ms = microOf(name);
  if (!T || !playing || !spb) return micro(when, salt, ms) + pocket(own) / 1000;
  const tick = tickAt(when), beat = tick / TICKS;
  const q = tick % TICKS, pos = q / (TICKS / 4);
  const k = Math.round(pos) % 4, onGrid = Math.abs(pos - Math.round(pos)) < 0.2;
  const onBeat = onGrid && k === 0;
  const w0 = hash01(tick, salt) * 2 - 1, w1 = hash01(tick - TICKS / 4, salt) * 2 - 1;
  const anti = T.anti || 0;
  const white = (w0 - anti * w1) / Math.sqrt(1 + anti * anti);
  const ens = T.ens || 0, seed = LAYER_SEED[name] || 7;
  const drift = Math.sqrt(ens) * driftAt(beat, 5) + Math.sqrt(1 - ens) * driftAt(beat, 100 + seed);
  const corr = T.corr || 0;
  let dev = Math.sqrt(corr) * drift * Math.sqrt(3) + Math.sqrt(1 - corr) * white;   // 兩部分都是「±1 均勻」的尺度
  dev *= onBeat ? (T.strong || 1) : (T.weak || 1);
  const lag = onGrid && T.lag16 && T.lag16[name] ? T.lag16[name][k] || 0 : 0;
  return dev * ms / 1000 + (lag + pocket(own)) / 1000;
}
/* 這一層抖幾毫秒。**寫在 `FEELS[x].micro` 裡,沒寫就是 0**——
   一個曲風一個曲風調,沒調到的那幾種一個取樣都不會動 */
function microOf(name){
  const m = feel().micro;
  return (m && m[name]) || 0;
}
/* 立體聲 chorus(Roland CE-1 / Dimension D 那一類)。八〇年代的 Rhodes 與乾淨電吉他
   幾乎都掛著它——那是 City Pop「亮、寬、會發光」的一大半來源,
   量到 Rhodes 的 L/R 相關 0.987(等於單聲道)就是少了這一顆。
   左右兩條延遲**反相**調變,乾的留在中間;`wet` 是 0 時完全透明 */
function makeChorus(c){
  const input = c.createGain(), output = c.createGain(), wet = c.createGain();
  wet.gain.value = 0;
  input.connect(output);
  const lfo = c.createOscillator();
  lfo.frequency.value = 0.5;
  for (const side of [-1, 1]) {
    const d = c.createDelay(0.05);
    d.delayTime.value = side < 0 ? 0.0071 : 0.0093;   // 兩邊不一樣長,才不會對稱地塌回中間
    const depth = c.createGain();
    /* 深度決定**音高晃多少**:音高偏移 = 深度 × 2π × 速率。
       第一版 0.0017 s × 0.6Hz = **±11 音分**,那已經是走音(被回報「音色更奇怪了」);
       CE-1 / Dimension D 只晃 2–3 音分。0.0005 × 0.5Hz = ±2.7 音分 */
    depth.gain.value = 0.0005 * side;
    lfo.connect(depth); depth.connect(d.delayTime);
    const pan = c.createStereoPanner ? c.createStereoPanner() : null;
    input.connect(d);
    if (pan) { pan.pan.value = side * 0.9; d.connect(pan); pan.connect(wet); }
    else d.connect(wet);
  }
  wet.connect(output);
  lfo.start();
  return { input, output, wet };
}
function shelf(c, type, hz){
  const f = c.createBiquadFilter();
  f.type = type; f.frequency.value = hz; f.gain.value = 0;
  return f;
}
/* 把 `FEELS[x].mix` 套到那兩條 bus 上。**沒寫的欄位一律回到透明值**,
   不要只在「有寫」的時候設——那樣換走曲風之後上一個的 EQ 會留著 */
function applyMix(){
  const m = feel().mix || {};
  if (combHp) combHp.frequency.value = m.gtrHp || 20;
  if (combEq) { combEq.frequency.value = m.gtrEqHz || 3200; combEq.gain.value = m.gtrEq || 0; }
  if (combComp) {
    combComp.threshold.value = m.gtrComp === undefined ? 0 : m.gtrComp;
    combComp.ratio.value = m.gtrRatio || 3;
  }
  if (combMakeup) combMakeup.gain.value = m.gtrMakeup || 1;
  if (padHp) padHp.frequency.value = m.padHp || 20;
  if (padEq) { padEq.frequency.value = m.padEqHz || 380; padEq.gain.value = m.padEq || 0; }
  if (padLp) padLp.frequency.value = m.padLp || 20000;
  if (keysEq) { keysEq.frequency.value = m.keysEqHz || 280; keysEq.gain.value = m.keysEq || 0; }
  if (keysAir) { keysAir.frequency.value = m.keysAirHz || 5000; keysAir.gain.value = m.keysAir || 0; }
  if (keysChorus) keysChorus.wet.gain.value = m.keysChorus || 0;
  if (keysBus) keysBus.gain.value = m.keysLevel || 1;
  if (revTone) revTone.frequency.value = m.revLp || 20000;
  if (drumWidth) drumWidth.set(m.drumWidth === undefined ? 1 : m.drumWidth);
  if (roomBus) roomBus.gain.value = ROOM_BUS_LEVEL * (m.roomLevel === undefined ? 1 : m.roomLevel);
  if (masterMid) { masterMid.frequency.value = m.masterMidHz || 400; masterMid.gain.value = m.masterMid || 0; }
  if (masterAirN) { masterAirN.frequency.value = m.masterAirHz || 5000; masterAirN.gain.value = m.masterAir || 0; }
  if (keysEq) keysEq.Q.value = m.keysEqQ || 1;
  if (drumBus) drumBus.gain.value = 0.8 * (m.drumLevel || 1);
  if (bassEqN) { bassEqN.frequency.value = m.bassEqHz || 900; bassEqN.gain.value = m.bassEq || 0; }
  if (bassCompN) {
    const on = m.bassComp !== undefined;
    bassCompN.threshold.value = on ? m.bassComp : 0;
    bassCompN.ratio.value = m.bassRatio || 4;
    bassDry.gain.value = on ? 0 : 1;
    bassWet.gain.value = on ? 1 : 0;
  }
  if (bassMk) bassMk.gain.value = m.bassMakeup || 1;
  if (drumAir) { drumAir.frequency.value = m.drumAirHz || 8000; drumAir.gain.value = m.drumAir || 0; }
  if (bassHpN) bassHpN.frequency.value = m.bassHp || 20;
  if (drumHpN) drumHpN.frequency.value = m.drumHp || 20;
  if (drumLowN) { drumLowN.frequency.value = m.drumLowHz || 90; drumLowN.gain.value = m.drumLow || 0; }
  if (keysPresN) { keysPresN.frequency.value = m.keysPresHz || 2000; keysPresN.gain.value = m.keysPres || 0; }
  if (drumMidN) { drumMidN.frequency.value = m.drumMidHz || 1000; drumMidN.gain.value = m.drumMid || 0; }
  if (gateSend) gateSend.gain.value = m.snareGate || 0;
  if (masterGain && masterBase) masterGain.gain.value = masterBase * (m.master || 1);
  if (drumRevSend) drumRevSend.gain.value = m.drumRev != null ? m.drumRev : 0.1;
  if (combAir) { combAir.frequency.value = m.gtrAirHz || 6500; combAir.gain.value = m.gtrAir || 0; }
  if (combChorus) combChorus.wet.gain.value = m.gtrChorus || 0;
}

/* 音長的句法(`FEELS[x].artic`):同一個節奏型每一下放開的時間不一樣,
   寬度 w 就是 1 ± w/2。種子跟 `micro` 一樣是音樂上的位置,可重現。
   **沒寫就回 1,零差異** */
function artic(name, when, salt){
  const a = feel().artic;
  const w = a && a[name];
  if (!w || !playing || !spb) return 1;
  return (1 - w / 2) + hash01(tickAt(when), salt) * w;
}
/* 這個曲風的 pocket(毫秒,正 = 落後)。沒寫就是 0,零差異 */
function pocket(name){
  const pk = feel().pocket;
  return (pk && pk[name]) || 0;
}
/* 一顆和弦裡第 i 顆音要晚多少秒。真的鍵盤手一個和弦攤在 4–12 毫秒裡,
   而且每一下的量不一樣(手的角度、力度都會變) */
function chordRoll(when, salt, i){
  if (!i || !playing || !feel().roll2) return 0;
  return i * (0.004 + hash01(tickAt(when), salt + 610) * 0.008);
}
function currentBeat(){ return anchorBeat + (ctx.currentTime - anchorTime) / spb; }

/* 速度改變時不能直接把舊的 anchorTime 拿來減——要重新錨定。
   作法是讓「下一個還沒排的拍」保持原本該響的時間,新的速度從那一拍之後才生效,
   已經排進去的音維持原樣,不會被改到一半 */
function reanchorTempo(newBpm){
  const keepTime = beatTime(nextBeat);
  spb = 60 / newBpm;
  updateEcho();
  anchorBeat = nextBeat;
  anchorTime = keepTime;
}

/* 鼓與貝斯永遠都在,鋼琴左手固定讓一點位置出來,
   不然同一個根音疊兩層,低頻會糊 */
/* 鋼琴左手的低音。貝斯一直都在,所以左手一律讓位(0.55)。
   **boogie 再讓一階**:貝斯一小節走八顆(根-五-六-五),左手同時撐著一顆長的根音,
   兩層低頻疊在一起會糊。
   藍調鋼琴本來就是左手自己在走 boogie 或乾脆不碰低音,不是壓著根音不放 */
/* 鋼琴左手的低音要讓給貝斯。**讓多少是曲風的事**,寫在 `FEELS[x].lh`:
   - 藍調的 boogie 一小節走八顆,左手再撐一顆長根音就糊了 → 0.38
   - K-Pop 的低音是 808 sub,那顆音本來就撐滿整小節,鋼琴再疊一層
     等於兩條正弦低頻相加。**而且它是「撐著的」不是「敲一下的」**——
     限幅器在大鼓的空隙裡放手時,這一層會整個爬上來把尖峰推過 1.0
     (量過:0.55 時 0.98、調小 808 反而更糟 1.04,因為限幅器踩得更少) → 0.3
   其餘維持 0.55 */
function lhGain(){
  const f = feel();
  if (f.lh) return f.lh;
  return f.bass === "boogie" ? 0.38 : 0.55;
}

/* ── 變化的亂數 ─────────────────────────────────────────────────
   同一個伴奏樣式每小節都一模一樣,聽起來就是個 loop。這裡讓每一小節依
   「絕對小節號」去查一組固定的亂數:同一個小節號永遠得到同一種變化(可重現、
   好除錯),但繞第二圈時小節號往上加,所以第二圈跟第一圈不會一樣。

   刻意不用 Math.random():那樣連「這一拍到底加了沒」都無法重現,出問題沒辦法追。

   兩輪 murmur 收尾不能簡化成一輪:一輪版整體分布看起來沒問題(四分位都是 0.25),
   但把 salt 固定、小節號從 0 數上去會連出好幾個很小的值——實測貝斯前五小節
   全部選到同一條路。雪崩不夠就是會這樣。 */
function hash01(a, b){
  let h = Math.imul(a ^ 0x9e3779b9, 2654435761) ^ Math.imul(b ^ 0x85ebca6b, 1597334677);
  h = Math.imul(h ^ (h >>> 15), 2246822519);
  h = Math.imul(h ^ (h >>> 13), 3266489917);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function chance(absBar, salt, p){ return hash01(absBar, salt) < p; }

/* 力度抖動:同一顆鼓每次打不會一樣大力,差個 ±8% 就夠讓它不像機器 */
/* 力度的範圍原本寫死 0.92–1.08,只有 **±0.7dB**——那等於沒有變化。
   真的在彈的人同一個聲部前後差兩三 dB 是常態。
   **寬度寫在 `FEELS[x].velRange` 裡**(沒寫就是原本的 0.16,零差異),
   City Pop 給 0.28(0.86–1.14,±1.1dB) */
function humanize(absBar, salt, gain){
  const w = feel().velRange || 0.16;
  return gain * ((1 - w / 2) + hash01(absBar, salt + 900) * w);
}

/* ══ 感覺:由和弦自己決定,不給使用者選 ═══════════════════════════
   一開始是讓使用者直接挑 Bossa / Pop / Rock / Smooth Jazz,但那樣會組出
   說不通的搭配——Dm9-G13-Cmaj9 套 Rock、C-F-G-F 套 Bossa 都很怪。
   其實「要用哪種感覺」本來就是和弦決定的,所以改成從和弦語彙判斷:

     有九度以上的延伸音(9/11/13/alt) → 搖擺
     只有六度七度(maj7/m7/7/6)        → 拉丁
     只剩三和弦與掛留                  → 直

   使用者選的是另一件事:伴奏要多疏多密(見 PATTERNS)。兩個軸交叉出來的
   九種組合每一種都成立,不會再有「這組和弦不能套這個風格」的問題。 */
const EXT_INTERVALS = [13, 14, 15, 17, 18, 20, 21];   // 九度以上
const SEVENTH_INTERVALS = [9, 10, 11];                // 六度、七度

/* 屬七和弦(大三度 + 小七度)不算拉丁訊號。
   全是屬七的 C7-F7-G7 是藍調,不是 bossa;bossa 的語彙是 maj7 / m7 / 6。
   沒有這一條,12 小節藍調會整組被判成拉丁。 */
function isDominant(iv){
  return iv.indexOf(4) >= 0 && iv.indexOf(10) >= 0 && iv.indexOf(11) < 0;
}

function detectFeel(bars){
  let ext = false, sevBars = 0, total = 0;
  for (const b of flatChords(bars)) {   // 判曲風也是每一顆都算
    if (!b.ok) continue;
    total++;
    const iv = b.chord.intervals;
    let hasSev = false;
    for (const x of iv) {
      if (EXT_INTERVALS.indexOf(x) >= 0) ext = true;
    }
    if (!isDominant(iv)) {
      for (const x of iv) if (SEVENTH_INTERVALS.indexOf(x) >= 0) hasSev = true;
    }
    if (hasSev) sevBars++;
  }
  if (ext) return "swing";
  /* 七和弦要「過半」才算拉丁,不能有一顆就算。
     Em - D - C - B7 是搖滾的安達魯西亞終止,只有最後那顆是屬七;
     C - Am - F - G7 也只是流行進行收在 V7。這兩種都不該變成 bossa。
     延伸音就不一樣了——九度以上很少不小心出現,有一顆就當爵士。 */
  return total && sevBars * 2 >= total ? "latin" : "straight";
}

/* ══ 拍號 ══════════════════════════════════════════════════════════
   4/4 與 3/4 是單拍子:一拍分成兩格,後半格可以搖擺。
   6/8 是複拍子:一小節兩拍(附點四分),一拍分成三格——三連音是拍號自己就有的,
   不要再套搖擺(再搖就變成搖擺的搖擺,晃得很奇怪)。

   所有節奏型一律寫「第幾格」,不寫秒數也不寫拍數,換拍號只是換一小節幾格:
   4/4 八格、3/4 六格、6/8 六格。速度那個數字指的是 note 那一顆音符,
   所以 6/8 的 60 是附點四分音符 60 下,不是四分音符。

   為什麼只有這三個:12/8 的慢藍調跟「4/4 + 搖擺」聽起來是同一件事(差在記譜),
   已經被搖擺那個感覺蓋掉了;2/4 的進行曲寫成 4/4 也一樣。
   5/4、7/8 要另外一整組節奏型才不會是湊數的,先不做 */
const METERS = {
  "4/4": { beats: 4, div: 2, note: "♩" },
  "3/4": { beats: 3, div: 2, note: "♩" },
  "6/8": { beats: 2, div: 3, note: "♩." },
};
const METER_KEYS = ["4/4", "3/4", "6/8"];
let meterOn = "4/4";
function meter(){ return METERS[meterOn] || METERS["4/4"]; }
function beatsInBar(){ return meter().beats; }
/* 一拍切幾格。拍號說了算(單拍子 2、複拍子 3),但**感覺可以再細一層**:
   放克整個律動是十六分的,hi-hat、大鼓、貝斯都踩在十六分上,
   用八分的格子寫不出來。FEELS 的 `sub` 就是這個倍數 */
function subOf(){ const f = FEELS[feelNow]; return (f && f.sub) || 1; }
function divNow(){ return meter().div * subOf(); }
function slotsInBar(){ return meter().beats * divNow(); }
/* 每一拍的正拍落在第幾格:4/4 是 0 2 4 6,6/8 是 0 3 */
function beatSlots(){
  const m = meter(), d = divNow(), out = [];
  for (let i = 0; i < m.beats; i++) out.push(i * d);
  return out;
}
/* 低音要換的地方:四拍以上是一、三,三拍與兩拍的一小節只換一次 */
function midBeat(){ const b = meter().beats; return b >= 4 ? 2 : b - 1; }

/* 感覺:跟拍號無關的那一半(搖擺比例、各軌音量、用哪顆鼓、貝斯走法)。
   真正打在哪幾格是 GROOVES 按拍號給的 */
const FEELS = {
  /* Pop:八分平均的流行與搖滾。圓舞曲與 6/8 抒情也走這一種(差別在拍號) */
  straight: {
    /* 人性化(`micro` / `pocket` / `roll2` / `velRange` / `artic`,原本只有 City Pop 開著)。
       盲聽裡 Pop 被寫了三次「節奏太死板」:它每一顆音都落在格子正中央。
       流行樂團的 pocket:backbeat 往後靠一點、hi-hat 往前一點 */
    micro: { keys: 6, bass: 4.5, gtr: 5, kick: 2, snare: 2.5, hat: 4 },
    pocket: { snare: 3, hat: -1, bass: -1 },
    roll2: true, velRange: 0.24, artic: { keys: 0.2 },
    swing: 0.5, push: true,
    kickGain: 0.85,
    snarePiece: "snare", snareGain: 0.7,
    cym: "hihat", cymGain: 0.33,
    bass: "root5", kit: "electric",
    // 一點點就好:現代流行的低頻是收緊的,但不該聽得出在打氣
    duck: { bass: 0.80, rel: 0.09 },
    /* 木吉他刷弦 + 鈴鼓疊在 backbeat 上。流行歌的節奏組本來就不只鼓貝鍵,
       那把刷弦的木吉他是「歌手自彈自唱」那一層 */
    /* `gdouble` 是**第二軌吉他**:流行唱片的木吉他一定錄兩遍、左右各一把。
       0.72 是「聽得出變寬但不會蓋掉鋼琴」的位置。
       `glevel` 0.26 → 0.13:盲聽第二批的 A/B,吉他 −6dB 拿 3 分、原樣 1 分、關掉 2 分——
       吉他要在,但要退到後面(見 tools/realism/KNOWLEDGE.md) */
    parts: { guitar: "strum", gtone: "steel", glevel: 0.13, gdouble: 0.72,
             perc: { kind: "tamb", on: "back", lvl: 0.26 } },
  },

     它跟 Pop 差在**十六分**(`sub:2`):hi-hat 走十六分但比放克輕、
     大鼓只咬幾顆切分、電鋼琴般的和弦打在反拍。和聲是 maj7/9 加二級屬,
     但**推不出來**——同一串 maj7 也可能是 bossa,差別在律動。
     只有 4/4:city pop 沒有三拍的 */
  citypop: {
    swing: 0.5, push: true, sub: 2,
    kickGain: 0.66,
    snarePiece: "snare", snareGain: 0.6,
    cym: "hihat", cymGain: 0.28,
    bass: "citypop", kit: "electric", meters: ["4/4"],
    /* **鍵盤從 Rhodes 換成平台鋼琴**(照相似度決定,使用者指定「以分數高的為主」)。
       12 段(4 組進行 × 3 種疏密)逐段配對比:Rhodes 89.2%、CP80 87.5%(−1.6,5/12 段贏)、
       **平台鋼琴 95.4%(+6.3 ± 1.2,11/12 段贏)**。三首參考曲的鍵盤層比較接近原聲鋼琴 */
    piano: "acoustic",
    /* 這一種的編制是最厚的:乾淨電吉他切十六分、弦樂在後面鋪、沙鈴走八分。
       八〇年代的日本 AOR 就是這樣配的——錄音室樂手一次錄滿 */
    /* **鋪底維持合成的,不要換成弦樂取樣**。試過換成真的大提琴 + 小提琴取樣,
       被回報「真實弦樂聽起來反而很怪,之前的比較好聽」——而且量出來確實是壞的,
       原因見 CLAUDE.md 的「實錄取樣不是永遠比合成好」那節 */
    /* **兩把吉他、一組銅管**才是真的 City Pop 錄音的編制:
       一把切十六分、一把彈琶音(左右各一把),銅管在句尾打 stab。
       銅管是合成的,理由見 `playBrass` 的註解 */
    /* ── 層級是量出來重訂的,不是憑感覺 ──────────────────────────

       (scratchpad 的 `cpsolo.mjs`,靜音式的量法會被限幅器汙染——
       關掉一層別的反而變大聲),結果是:

         Rhodes −20.6 / 鋪底 −21.4 / 鼓 −24.0 / 貝斯 −24.7
         銅管 −32.0 / 吉他 **−38.5** / 吉他2 **−42.8** / 沙鈴 −47.3

       **兩把吉他比 Rhodes 低 18 與 22dB**——那等於沒有。而十六分切音
       正是 City Pop 最招牌的一層(松原正樹、鈴木茂那兩把),
       真的唱片裡它跟鍵盤是同一個量級的。
       **鋪底反而只比 Rhodes 低 0.8dB**,而且它在 250Hz 是 −23.0、
       比 Rhodes 的 −23.2 還大——中頻最擠的那一段是它塞的。

       全曲風比對也指著同一件事:City Pop 的 60Hz 比 Pop 低 2.5dB、

    /* 兩把吉他的音量**在加壓縮之後要往回收 3dB**:壓縮把尖峰壓平,
       平均電平就上去了(2kHz 量到從 −21.0 衝到 −17.0)。
       那不是混音決定,是壓縮器的副作用——要收回來,
       壓縮留下的是「顆粒變齊」不是「變大聲」 */
    /* 切音吉他用 Gretsch 的真斷奏錄音(`SMP_EXT.gretsch`):12 段配對 +1.5 ± 0.4、11/12 段贏 */
    parts: { guitar: "chop", gtone: "clean", gkit: "gretsch", glevel: 0.28,

             chopCells: [[2, 6, 10, 14], [2, 7, 10, 14], [2, 6, 11, 15], [3, 6, 10, 14],

             guitar2: { lvl: 0.18, modes: 3 },
             brass: { lvl: 0.115, cells: [[6, 10], [10, 14], [6, 14], [10], [14], [3, 6], [11, 14]] },
             /* 鋪底 −2dB、過 3kHz 低通:盲聽 6 次寫「太尖銳、太突出、要溫暖一點、不夠後面」 */
             keys: "pad", klevel: 0.025,
             /* 沙鈴從十六分退回八分、−1.4dB:三首參考曲分軌量到高頻每拍 2.5–3 下,

             perc: { kind: "shaker", lvl: 0.16 },

             /* 切音的長度 0.09 → 0.2 秒:12 首真歌的吉他切音量到約半拍長,我們只有 0.17 拍 */
             chopLen: 0.2 },
    /* AOR 的貝斯是往前的(後藤次利、細野晴臣那一路),不是墊在後面。
       量到 60Hz 比 Pop 低 2.5dB,補回來 */
    /* 1.3 → 0.68(−5.6dB):三首參考曲(Midnight Pretenders / Plastic Love / 真夜中のドア)
       分軌之後貝斯相對整軌 −3.4～−6.6dB(平均 −5.2),我們是 −1.5～−2.0,貝斯站得太前面 */
    /* 0.68 → 0.34(−6dB,第七輪):第六輪把貝斯改成撐滿(連奏)、多了幾顆、起音空白也修掉之後,

       整體伴奏相似度從 98.8% 掉到 32–55%,每一軌單獨看卻都正常。**是比例壞了,不是哪一件樂器壞了** */
    bassGain: 0.24,     // 四組並排量過:0.34 → 伴奏 89.5%、0.24(加上鍵盤吉他各推一點)→ 101.9%
    drumSet: "sm",   // 大鼓、小鼓、hi-hat 用 SM Drums(見 `SM_KIT`)
    /* **變化**(使用者:「每個模式都多幾種彈法,過門也是」)。全部走通用欄位,沒寫的曲風零差異 */
    padVar: 3,                                                   // 墊底的鋼琴三種彈法
    /* ── 配器輪換(第八輪:照 12 首真歌的六軌拆解)──────────────────────
       htdemucs_6s 把 12 首拆成鼓/貝斯/吉他/鋼琴/其他/人聲(`tools/realism/orch.py`,db/orch.json):
       **鋼琴(含電鋼琴)在 9/12 首只是點綴**(−22～−33dB),**「其他」(銅管、弦樂、合成器)才是主角**
       (−5～−11dB、亮度 2.5kHz),吉他 −12dB、切音約半拍長。我們原本剛好反過來(鋼琴 −8～−11、
       其他 −12～−19、吉他切音 0.17 拍)。使用者:「每次生成都不一樣的配器沒關係,聽起來更靈活」。
       所以每按一次播放換下一組(`applyOrch`,計數存在 localStorage,不是亂數——出問題查得到是哪一組)。
       每一組是**蓋在這個曲風上的覆寫**,寫法跟 render.mjs 的 ovr 一樣 */
    orchs: [
      /* 1 銅管弦樂型(〈SPARKLE〉〈WINDY LADY〉〈Telephone Number〉〈Tokai〉):銅管每小節、鋪底亮 */
      { name: "brass", parts: { klevel: 0.05, brass: { lvl: 0.15, every: 1 } },
        mix: { padLp: 5500 }, arrange: { layers: { brass: "01110111", keys: "11111111" } } },
      /* 2 合成器鋪底型(〈Midnight Joke〉〈Midnight Pretenders〉):大片合成器鋪底,銅管很少 */
      { name: "synth", parts: { klevel: 0.075, glevel: 0.22, brass: { every: 4 } },
        mix: { padLp: 4500 }, arrange: { layers: { keys: "11111111", brass: "00000001" } } },
      /* 3 鋼琴型(〈Plastic Love〉):鋼琴往前,其他照常 */
      { name: "piano", mix: { keysLevel: 1.1 } },
      /* 4 雙吉他型(〈Fantasy〉〈STAY BY ME〉):兩把吉他一直都在,鋪底淡 */
      { name: "guitars", parts: { glevel: 0.34, guitar2: { lvl: 0.24 }, klevel: 0.035 },
