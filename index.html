    ensureDrums(),
    ensureBass(bassMidis),
    guitarReady,
  ]).then(() => {
    endLoadProgress();
    playBtn.disabled = false;
    /* 狀態列講的是「這首真的在用的那一台琴」:Rhodes 整組沒載到時
       ensureSamples 已經把平台鋼琴補上了,這裡就會看到平台鋼琴那一組。
       **合成的那一台(K-Pop 的 pluck)沒有 bank**,不要去讀它的 size */
    const want = pianoKit();
    const synthKit = !!(PIANO_KITS[want] && PIANO_KITS[want].synth);
    const kitNow = synthKit ? null
                 : (pianoBanks[want] && pianoBanks[want].size) ? want : "acoustic";
    if (synthKit) setStatus(T("statusSynthKeys"), false);
    else if (!pianoBanks[kitNow].size) setStatus(T("statusSynth"), true);
    else if (pianoFailed[kitNow].size) setStatus(T("statusPartial", { n: pianoFailed[kitNow].size }), true);
    else setStatus(T("statusSamples", { n: pianoBanks[kitNow].size }), false);

    playing = true;
    // 已經在播了,這時候才放行「補完整組鼓」那一大包(見 drumFillGate)
    openDrumFill();
    spb = 60 / bpmOn;
    updateEcho();
    countInBeats = countInOn ? beatsInBar() * 2 : 0;
    endBeat = loopOn ? Infinity : countInBeats + voicings.length * beatsInBar();
    anchorBeat = 0;
    // 起點往後推一點點,第一個和弦才不會被排在「已經過去的時間」上而被吃掉
    anchorTime = ctx.currentTime + 0.12;
    nextBeat = 0;
    setPlayIcon(true);
    schedulerTick();
    tickTimer = setInterval(schedulerTick, TICK_MS);
    rafId = requestAnimationFrame(paintPlayhead);
  });
}

function stopPlayback(){
  playing = false;
  if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  for (const s of [...activeSources]) { try { s.stop(); } catch (e) {} }
  activeSources.clear();
  setPlayIcon(false);
  clearHighlight();
  updateTransportIdle();
}

function togglePlay(){
  if (playing) stopPlayback(); else startPlayback();
}

/* ══ 畫面 ══════════════════════════════════════════════════════ */
const chordInput = $("chordInput");
const barsGrid = $("barsGrid");
const playBtn = $("playBtn");

let bpmOn = 100, transposeOn = 0, styleOn = "comp", countInOn = true, loopOn = true;
let lastHighlight = -1;

/* SVGElement 沒有 hidden 這個 IDL 屬性,el.hidden = true 只會掛上一個沒人看的 JS 屬性,
   內容屬性不會變,上面那條 svg[hidden]{display:none} 也就永遠比對不到。
   一定要走 setAttribute / removeAttribute,圖示才真的會換 */
function hideSvg(el, hide){
  if (hide) el.setAttribute("hidden", "");
  else el.removeAttribute("hidden");
}
function setPlayIcon(isPlaying){
  hideSvg($("iconPlay"), isPlaying);
  hideSvg($("iconStop"), !isPlaying);
  const lbl = isPlaying ? T("stopLabel") : T("playLabel");
  playBtn.setAttribute("aria-label", lbl);
  playBtn.setAttribute("title", lbl);
}

function setTransport(l1, l2){
  $("transportLine1").textContent = l1;
  $("transportLine2").textContent = l2;
}

function setStatus(text, warn){
  const el = $("statusLine");
  el.textContent = text || "";
  el.classList.toggle("warn", !!warn);
}

/* ══ 速度:跟感覺與拍號有關 ═══════════════════════════════════════
   同一組和弦在 4/4 與在 3/4 的常用速度差很多(爵士圓舞曲本來就比中速搖擺快),
   6/8 的那個數字又是附點四分音符,50 就已經是抒情歌的速度了。
   所以快捷鍵不是固定的 70 / 100 / 120,是這張表裡的三個:慢 / 中 / 快。
   只換快捷鍵,不會自己去動使用者打的數字——只有「單拍子↔複拍子」那一下例外,
   因為那顆音符換掉了,同一個數字不再是同一個速度 */
const TEMPO_QUICK = {
  straight: { "4/4": [80, 100, 120],  "3/4": [90, 120, 150],  "6/8": [50, 65, 80] },
  latin:    { "4/4": [110, 130, 150], "3/4": [120, 150, 180], "6/8": [80, 100, 120] },
  swing:    { "4/4": [100, 140, 180], "3/4": [130, 170, 210], "6/8": [40, 55, 70] },
  funk:     { "4/4": [90, 105, 120] },
  citypop:  { "4/4": [95, 110, 125] },
  /* K-Pop 的譜面速度通常寫成 120–130,但那是 half-time 的寫法——
     拍手在第 3 拍,聽起來是一半。這裡的數字是四分音符,所以給 85–120 */
  kpop:     { "4/4": [85, 100, 120] },
  blues:    { "4/4": [70, 90, 110],   "6/8": [40, 55, 70] },
};
function tempoQuick(){
  const byFeel = TEMPO_QUICK[feelNow] || TEMPO_QUICK.straight;
  return byFeel[meterOn] || byFeel["4/4"];
}
function renderTempoQuick(){
  const box = $("bpmQuick");
  if (!box) return;
  box.innerHTML = "";
  for (const v of tempoQuick()) {
    const b = document.createElement("button");
    b.className = "btn";
    b.type = "button";
    b.textContent = v;
    b.addEventListener("click", () => setBpm(v));
    box.appendChild(b);
  }
}

/* 換拍號。鼓的打法、貝斯的位置、一小節幾拍、count-in 幾下全部跟著換,
   播放中換會有一小節接不齊(排程只提前 0.2 秒),下一小節就回到正軌 */
/* 曲風那一排:實心的那一顆**永遠**是現在在彈的(feelNow),不管是自動挑的還是自己點的。
   旁邊的「自動」只講「這一顆是跟著和弦挑的」。Funk 在非 4/4 變暗。
   更新時機跟著 updateFeel / setMeter 走 */
function updateFeelSeg(){
  const seg = $("feelSeg");
  if (!seg) return;
  for (const b of seg.children) {
    const k = b.dataset.feel;
    b.setAttribute("aria-pressed", k === feelNow ? "true" : "false");
    // 變暗 = 這個拍號沒有這種曲風的節奏型。點下去會連拍號一起換(提示不是鎖)
    b.classList.toggle("dim", !feelFitsMeter(k));
  }
  const auto = $("feelAutoBtn");
  if (auto) auto.setAttribute("aria-pressed", feelPick === "auto" ? "true" : "false");
}

function setFeelPick(k){
  /* 這個曲風在現在的拍號沒有節奏型(在 3/4 點 Funk)→ 連拍號一起換過去,
     不是不理他。變暗跟拍號那排一樣是「提示不是鎖」:點下去就當使用者要這個曲風,
     而 Funk 的進行全是 4/4,擋住的話那五組就永遠碰不到了 */
  if (k !== "auto" && !feelFitsMeter(k)) {
    const ms = (FEELS[k] || {}).meters;
    if (!ms || !ms.length) return;
    formMeter = null;
    setMeter(ms[0], true);
  }
  feelPick = k;
  updateFeel();            // 重算 feelNow、建議速度、貝斯那一把
  /* **點曲風就把速度帶過去**(點「自動」不算,那不是在指定曲風)。
     原本的規則是「不會自己去動使用者打的數字」,那是只有三種曲風、
     速度範圍差不多的時候訂的。現在七種曲風橫跨 55–180:
     同一個數字下 Bossa、Swing、Blues、Funk 聽起來會像同一件事,
     被回報過「除了 City Pop,其他連風格都聽不出來」——
     **速度是曲風的一部分**,Swing 在 100 就不是 swing。
     點膠囊是明確的「我要這個曲風」,所以連速度一起換;
     和弦改變導致的自動判斷不會動速度(那不是使用者在指定) */
  if (k !== "auto") {
    const q = tempoQuick();
    if (q && q.length) setBpm(q[1]);      // 那個曲風的中速
  }
  if (playing) voicings = buildVoicings(barsNow());
  saveState();
}

function setMeter(m, quiet){
  const divBefore = meter().div;
  meterOn = METERS[m] ? m : "4/4";
  const seg = $("meterSeg");
  if (seg) for (const b of seg.children) {
    b.setAttribute("aria-pressed", b.dataset.meter === meterOn ? "true" : "false");
  }
  const note = $("bpmNote");
  if (note) note.textContent = meter().note;
  if (!quiet && divBefore !== meter().div) {
    const q = tempoQuick();
    if (bpmOn < q[0] || bpmOn > q[2]) setBpm(q[1]);
  }
  if (!feelFitsMeter(feelPick)) { feelPick = "auto"; updateFeel(); }
  renderTempoQuick();
  updateMeterDim();
  updateFeelSeg();

  if (playing && !loopOn) endBeat = countInBeats + voicings.length * beatsInBar();
  if (!quiet) saveState();
}

/* 從段落庫點來的進行有「本來的拍號」,另外兩顆就變暗。
   變暗是提示不是鎖:還是點得下去(有人就是想把丸サ進行彈成圓舞曲),
   點下去就當作使用者自己要換,提示收起來 */
function updateMeterDim(){
  const seg = $("meterSeg");
  if (!seg) return;
  for (const b of seg.children) {
    const dim = !!formMeter && b.dataset.meter !== formMeter;
    b.classList.toggle("dim", dim);
    if (dim) b.setAttribute("title", T("meterDimTip", { m: formMeter }));
    else b.setAttribute("title", T("meterTip" + b.dataset.meter.replace("/", "")));
  }
}
function clearFormMeter(){
  formFeel = null;   // 自己打字/清空之後就沒有「本來是什麼曲風」可言了
  if (formMeter === null) return;
  formMeter = null;
  updateMeterDim();
}

const STYLE_I18N = { pad: "stylePad", comp: "styleComp", drive: "styleDrive", mix: "styleMix" };
/* 曲風的 key → 畫面上的名字。程式裡的 key 不跟著畫面改(存檔與網址都用它) */
const FEEL_I18N = { straight: "feelStraight", citypop: "feelCitypop", kpop: "feelKpop",
                    latin: "feelLatin", blues: "feelBlues", swing: "feelSwing", funk: "feelFunk" };
/* 混合時把現在走到哪一種也寫出來:不講的話會以為是自己亂變的。
   這跟「感覺」不一樣——感覺是和弦決定的、不顯示;疏密本來就是使用者選的那一軸 */
function styleName(absBar){
  if (styleOn === "mix" && typeof absBar === "number") {
    return T("styleMixNow", { now: T(STYLE_I18N[styleAt(absBar)] || "styleComp") });
  }
  return T(STYLE_I18N[styleOn] || "styleComp");
}

/* 感覺是和弦決定的,和弦一改就要重算 */
function feelAuto(){ return detectFeel(parsed.bars); }
function updateFeel(){
  const before = typeof feelNow !== "undefined" ? bassKit() : "";
  /* 音色也跟著曲風換:換到 Funk 就從平台鋼琴變 Rhodes、換到 K-Pop
     連鼓都變成 808。播放中換的話那一台琴還沒載,要在背景補上 */
  const pianoBefore = typeof feelNow !== "undefined" ? pianoKit() : "";
  const feelBefore = feelNow;
  /* 這個曲風在這個拍號沒有節奏型(放克、city pop 只有 4/4,藍調沒有三拍)
     就退回「自動」——留著會變成「格子數對不上」的靜音小節 */
  if (!feelFitsMeter(feelPick)) feelPick = "auto";
  feelNow = feelPick === "auto" ? feelAuto() : feelPick;
  updateFeelSeg();
  /* 曲風變了,段落庫列的東西就要跟著換:改成爵士和弦,列的就該是爵士的進行 */
  if (feelNow !== feelBefore && typeof renderExamples === "function") renderExamples();
  renderTempoQuick();   // 換了和弦語彙,建議速度也不一樣了
  /* bus 上的 EQ / 壓縮也要跟著換。`applyMix` 對沒寫的欄位一律回到透明值,
     所以從 City Pop 換走時它自己會把高通與壓縮解掉 */
  if (feelNow !== feelBefore) applyMix();
  /* 播放中把和弦改成爵士的語彙,貝斯就從電貝斯換成低音提琴——
     那一把還沒載,先在背景抓(不要 await,擋住的話下一拍就沒聲音了) */
  if (playing && before && before !== bassKit()) {
    ensureBass(bassMidisOf());
    /* 從 K-Pop 換走時把側鏈壓下去的那一下放回來,
       不然低音會一直卡在被壓住的音量上 */
    if (bassBus) {
      bassBus.gain.cancelScheduledValues(ctx.currentTime);
      bassBus.gain.setTargetAtTime(BASS_BUS_LEVEL, ctx.currentTime, 0.05);
    }
    if (padBus) {
      padBus.gain.cancelScheduledValues(ctx.currentTime);
      padBus.gain.setTargetAtTime(PAD_BUS_LEVEL, ctx.currentTime, 0.05);
    }
  }
  /* 鋼琴同理(不要 await:擋住的話下一拍就沒聲音了,還沒到位時 playNote
     會先用平台鋼琴那一組頂著)。808 是合成的,沒有東西要載 */
  if (playing && pianoBefore && pianoBefore !== pianoKit()) ensureSamples(pianoMidisOf());
  if (playing) ensureDrums();
}

/* 這段進行的鋼琴會用到哪些音(含移調)。startPlayback 裡也是同一份算法,
   播放中換琴時要再算一次 */
function pianoMidisOf(){
  const out = [];
  for (const spans of (voicings || [])) {
    for (const sp of (spans || [])) {
      if (!sp || !sp.v) continue;
      out.push(sp.v.bass + transposeOn);
      for (const n of sp.v.upper) out.push(n + transposeOn);
    }
  }
  return out;
}

function updateTransportIdle(){
  const n = parsed.bars.length;
  if (!n) { setTransport(T("emptyTitle"), T("emptySub")); return; }
  if (parsed.bars.some(b => !b.ok)) { setTransport(T("emptyTitle"), T("emptySub")); return; }
  setTransport(T("readyTitle"), T("readySub"));
}

function clearHighlight(){
  if (lastHighlight >= 0) {
    const el = barsGrid.children[lastHighlight];
    if (el) el.classList.remove("on");
    lastHighlight = -1;
  }
}

function paintPlayhead(){
  if (!playing) return;
  const beat = currentBeat();
  if (beat < countInBeats) {
    const all = beatsInBar() * 2;
    const n = Math.max(1, Math.min(all, Math.floor(beat) + 1));
    setTransport(T("countingIn"), T("countingInSub", { n, all }));
    clearHighlight();
  } else {
    const musicBeat = beat - countInBeats;
    const nBars = voicings.length;
    const absBar = Math.floor(musicBeat / beatsInBar());
    let bar = absBar;
    if (bar >= nBars) bar = loopOn ? bar % nBars : nBars - 1;
    if (bar !== lastHighlight) {
      clearHighlight();
      const el = barsGrid.children[bar];
      if (el) el.classList.add("on");
      lastHighlight = bar;
    }
    setTransport(
      /* 一小節兩顆和弦時要顯示**現在真的在響的那一顆**,不是這一格的第一顆 */
      T("playingTitle", { bar: bar + 1, chord: (() => {
        const x = barsNow()[bar];
        if (!x || !x.chords || !x.chords.length) return "";
        const within = musicBeat - Math.floor(musicBeat / beatsInBar()) * beatsInBar();
        const sp = spanAt(spansOf(x), Math.floor(within) * divNow());
        const c = sp && sp.chord ? sp : x.chords[0];
        return chordDisplay(c.chord) || c.text; })() }),
      T("playingSub", { bpm: bpmOn, style: styleName(absBar), loop: loopOn ? T("loopSuffix") : "" })
    );
  }
  rafId = requestAnimationFrame(paintPlayhead);
}

/* ── 名字放不下就不要寫 ────────────────────────────────────────
   字級是 CSS 用容器查詢算的(`.bar-name`),所以**這裡不要把公式抄第二遍**,
   直接讀算完的結果:低於 `NAME_MIN` 就整格不寫名字、改畫一顆點。
   一格一顆的時候永遠不會低於門檻(整格都是它的),所以只掃多顆的那幾格。
   **先把上一輪的判斷清掉再量**:`display:none` 之後的 `100cqi` 不一定還算得出來 */
const NAME_MIN = 8;
function fitBarNames(){
  const chips = [].slice.call(barsGrid.querySelectorAll(".bar-chip.multi"));
  if (!chips.length) return;
  for (const c of chips) c.classList.remove("no-name");
  const hide = chips.filter(c =>
    [].slice.call(c.querySelectorAll(".bar-name"))
      .some(nm => parseFloat(getComputedStyle(nm).fontSize) < NAME_MIN));
  for (const c of hide) c.classList.add("no-name");
}

function renderBars(){
  barsGrid.innerHTML = "";
  // 整段用同一個字母走法,才不會一格 D♭maj7 一格 F♯maj7
  const src = barsNow();
  const trSteps = transposeSteps(src);
  if (selectedBar >= flatChords(src).length) selectedBar = -1;
  let flat = 0;                       // 攤平的和弦序號(選取用的就是它)
  for (let i = 0; i < src.length; i++) {
    const b = src[i];
    const chip = document.createElement("div");
    chip.className = "bar-chip" + (b.ok ? "" : " bad");
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = i + 1;
    chip.appendChild(num);
    /* 一格裡可能有兩顆和弦,每一顆各自是一個可以點的按鈕。
       和弦名包一層 span:格子太窄時 CSS 靠 --len 把字縮小,
       不然會把 Cmaj7 斷成「Cmaj / 7」,看起來像別的和弦 */
    const list = b.chords && b.chords.length ? b.chords : [{ ok: false, text: b.text, chord: null }];
    /* 格子的寬度要照**算完的時值**(`spansOf`)不是寫的權重:
       最後一顆會去補滿小節,只看權重的話畫出來跟聽到的不一樣 */
    const sp = b.chords && b.chords.length ? spansOf(b) : null;
    if (list.length > 1) chip.classList.add("multi");
    for (let ci = 0; ci < list.length; ci++) {
      const c = list[ci];
      /* 和弦變化拆出來的那一顆(`added`)不是原譜的一顆,不佔選取序號:
         點它選的是後面那顆原本的和弦,編輯才對得回文字框 */
      const my = c.added ? flat : flat++;
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "bar-ch" + (c.ok ? "" : " bad") + (my === selectedBar ? " sel" : "");
      const name = document.createElement("span");
      name.className = "bar-name";
      name.textContent = c.ok ? chordDisplay(c.chord, trSteps) : c.text;
      cell.style.setProperty("--len", name.textContent.length);
      /* **格子的寬度照它佔幾拍**:撐兩拍的和弦格子就是兩倍寬。
         不然 `C / Am F` 畫出來三顆一樣寬,看不出第一顆比較長 */
      /* **撐兩拍的和弦格子就是兩倍寬**。不然 `C . Am` 畫出來兩顆一樣寬,
         看不出第一顆比較長——而「和弦換在哪裡」正是這個功能的重點 */
      if (list.length > 1 && sp) cell.style.flexGrow = String(Math.max(1, sp[ci].w || 1));
      cell.appendChild(name);
      // 點一下選起來(之後點音名/性質就是改這一顆)。點同一顆不取消:
      // 一直要有一顆在編輯,不然鍵盤不知道要改誰
      cell.addEventListener("click", () => selectBar(my));
      chip.appendChild(cell);
    }
    const p = posOf(selectedBar);
    if (p && p.bar === i) chip.classList.add("sel");
    barsGrid.appendChild(chip);
  }
  lastHighlight = -1;
  /* 一排四格,因為樂句就是四小節一句:第 5 格一定在第二排的開頭,
     12 小節藍調剛好三排。超過 12 格才改成一排八格(等於一排兩句),
     不然排數太多會把整頁撐開。**不要用六欄**:第 5 格會跑到第一排中間,
     看的人就數不出樂句了 */
  /* 欄數一定要照**剛剛畫出來的那幾格**算,不能另外去問 parsed.bars:
     兩邊有一瞬間對不上(見上面 reparse 的 resetLap),欄數就會配錯,
     症狀是「8 格擠在同一橫排」 */
  const n = src.length;
  /* **欄數要同時看格數與寬度**,不能只看格數。原本 `n > 12` 就一律八欄,
     但手機上整排只有三百多 px,八欄等於一格 40px——`Fmaj7` 被 `--len`
     縮到看不清楚(回報過「八個一橫排太窄了」)。
     八欄要有夠寬的容器才成立;不夠寬就維持四欄、多排幾列
     (手機本來就是已知要捲的那個平台)。
     **4 與 8 都是 4 的倍數**,所以第 5 格一定還在某一排的開頭,
     樂句照樣數得出來——這條跟「不要用六欄」是同一個理由。
     520 是量出來的:一格要放得下五個字的和弦(`Fmaj7`)又不縮字,
     八欄大約就要這麼寬。量不到寬度(還沒進 DOM)時當它夠寬,
     下一次 `renderBars` 會修正 */
  /* 門檻是**量出來的**:桌機的左欄只有 ~480px、平板直立更窄(~300–400px),
     手機單欄約 330px。第一版寫 520 結果八欄永遠不會發生,
     1280×720 的 16 小節反而從兩排變四排、超出 12px。
     430 才切在對的地方:手機與窄平板四欄、桌機與寬平板八欄 */
  const roomW = barsGrid.clientWidth;
  const setCols = c => {
    barsGrid.style.gridTemplateColumns = "repeat(" + c + ",minmax(0,1fr))";
    barsGrid.classList.toggle("dense", n > 4);
    barsGrid.classList.toggle("denser", n > 12);
    barsGrid.classList.toggle("eight", c === 8);
    fitBarNames();
  };
  setCols((n > 12 && (roomW === 0 || roomW >= 430)) ? 8 : 4);
  /* **欄窄又放不下名字就退成一排兩格**。判斷的是「真的放不下」不是「幾顆和弦」:
     `Cmaj7 A7` 兩顆就已經擠不下了,`D7 D7 D7 D7` 四顆反而放得下。
     所以先照四欄畫、量一次,真的有一格寫不出名字才退。
     **兩欄不會把樂句數壞**:第 5 格還是排頭(2 是 4 的因數)——
     「不要用六欄」那條擋的是第 5 格跑到排中間,兩欄沒有這個問題。
     只給**八小節以內**(練習循環):再長就是在打一整首歌了,
     那時候多一倍的排數放不下,名字看下面那排編輯條 */
  if (n <= 8 && roomW && barsGrid.querySelector(".bar-chip.no-name")) {
    setCols(2);
  }
  updatePalHint();

  const bad = parsed.bars.find(b => !b.ok);
  const err = $("parseError");
  if (bad) {
    $("parseErrorText").textContent = T("errUnknownChord", { tok: bad.text });
    err.classList.add("on");
  } else if (parsed.overflow) {
    $("parseErrorText").textContent = T("errTooMany", { n: MAX_BARS });
    err.classList.add("on");
  } else {
    err.classList.remove("on");
  }

  updateBarCount();
  updateLenSeg();
  playBtn.disabled = !parsed.bars.length || !!bad;
}

function reparse(){
  parsed = parseProgression(chordInput.value);
  updateFeel();
  /* **一定要排在 renderBars 前面**:和弦改了,上一圈換過的那一份就作廢了。
     漏掉的話 renderBars 會畫「上一首的格數」,但格線的欄數是照新的算的——
     12 小節換成 16 小節那一下,就會看到 8 格擠在同一橫排(回報過) */
  resetLap();
  renderBars();
  if (playing) {
    // 播放中改了和弦:重算配置,下一拍開始就吃新的進行
    voicings = buildVoicings(parsed.bars);
    if (!parsed.bars.length || parsed.bars.some(b => !b.ok)) stopPlayback();
    else if (!loopOn) endBeat = countInBeats + voicings.length * beatsInBar();
  } else {
    updateTransportIdle();
  }
  saveState();
}

/* ══ 控制項 ══════════════════════════════════════════════════════ */
function setBpm(v, fromInput){
  const n = Math.max(40, Math.min(240, Math.round(v) || 100));
  bpmOn = n;
  $("bpmEcho").textContent = n;
  if (!fromInput) $("bpmInput").value = n;
  if (playing) reanchorTempo(n);
  saveState();
}

function setTranspose(v){
  transposeOn = Math.max(-12, Math.min(12, Math.round(v)));
  $("transpose").value = transposeOn;
  const sign = transposeOn > 0 ? "+" : "";
  $("transposeValue").innerHTML = sign + transposeOn +
    '<span class="unit">' + T("semitoneUnit") + "</span>";
  // 小節格顯示的是「真的在響的和弦」,移調就要重畫。播放中也沒關係:
  // 下一幀 paintPlayhead 會把正在響的那一格重新點亮
  if (typeof parsed !== "undefined" && parsed) { renderBars(); updateBarCount(); }
  saveState();
}

function setStyle(s){
  styleOn = s;
  for (const b of $("styleSeg").children) {
    b.setAttribute("aria-pressed", b.dataset.style === s ? "true" : "false");
  }
  saveState();
}

function setToggle(el, on){
  el.setAttribute("aria-pressed", on ? "true" : "false");
}

/* ══ 儲存 ══════════════════════════════════════════════════════ */
const SEC_KEY = "backingtrack.sections.open";

/* ══ 一條網址就是一題 ═══════════════════════════════════════════
   老師把和弦、速度、拍號、樣式、移調編進網址,傳給學生;學生打開就是同一題。
   參數名用短的(c / bpm / m / s / t),網址看得懂也改得動 */
function shareURL(){
  const u = new URL(location.href);
  u.search = "";
  u.searchParams.set("c", chordInput.value.trim());
  u.searchParams.set("bpm", bpmOn);
  if (meterOn !== "4/4") u.searchParams.set("m", meterOn);
  if (styleOn !== "comp") u.searchParams.set("s", styleOn);
  if (transposeOn) u.searchParams.set("t", transposeOn);
  if (feelPick !== "auto") u.searchParams.set("f", feelPick);
  return u.toString();
}
/* 網址帶了參數就以網址為準(蓋過上次留在這台裝置上的設定)——
   傳連結的人要的就是「對方看到的跟我一樣」 */
function applyURLParams(){
  let q;
  try { q = new URL(location.href).searchParams; } catch (e) { return false; }
  const c = q.get("c");
  if (!c) return false;
  chordInput.value = c;
  const bpm = parseInt(q.get("bpm"), 10);
  if (!isNaN(bpm)) bpmOn = Math.min(240, Math.max(40, bpm));
  const m = q.get("m");
  if (m && METERS[m]) meterOn = m;
  const st = q.get("s");
  if (st && STYLE_KEYS.indexOf(st) >= 0) styleOn = st;
  const t = parseInt(q.get("t"), 10);
  if (!isNaN(t)) transposeOn = Math.min(12, Math.max(-12, t));
  const f = q.get("f");
  if (f && (f === "auto" || FEELS[f])) feelPick = f;
  return true;
}

function saveState(){
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      text: chordInput.value, bpm: bpmOn, transpose: transposeOn,
      style: styleOn, meter: meterOn, feel: feelPick,
      countIn: countInOn, loop: loopOn, reharm: reharmOn,
    }));
  } catch (e) {}
}

function loadState(){
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

function getSaved(){
  try {
    const raw = localStorage.getItem(SAVED_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function putSaved(arr){
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(arr)); } catch (e) {}
}

function renderSaved(){
  const list = $("savedList");
  list.innerHTML = "";
  const arr = getSaved();
  if (!arr.length) {
    const p = document.createElement("p");
    p.className = "saved-empty";
    p.textContent = T("savedEmpty");
    list.appendChild(p);
    return;
  }
  arr.forEach((item, i) => {
    const wrap = document.createElement("span");
    wrap.className = "saved-item";

    const load = document.createElement("button");
    load.type = "button";
    load.className = "name";
    load.textContent = item.name;
    load.title = T("savedLoad", { name: item.name });
    load.addEventListener("click", () => {
      chordInput.value = item.text;
      if (item.bpm) setBpm(item.bpm);
      if (typeof item.transpose === "number") setTranspose(item.transpose);
      if (item.style) setStyle(item.style);
      if (item.meter) setMeter(item.meter, true);
      reparse();
    });

    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "×";
    del.title = T("savedDelete", { name: item.name });
    del.addEventListener("click", () => {
      const cur = getSaved();
      cur.splice(i, 1);
      putSaved(cur);
      renderSaved();
    });

    wrap.appendChild(load);
    wrap.appendChild(del);
    list.appendChild(wrap);
  });
}

/* ══ 和弦鍵盤 ══════════════════════════════════════════════════
   重點是「不用打字也能組出和弦」:點音名加一格、點性質改一格,兩下就有 Cm7。
   文字框仍然是唯一的真相來源,鍵盤只是幫使用者改那一行字。 */
const PAL_ROOTS = ["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const PAL_QUALS = [
  { s: "",     k: "qualMaj" },
  { s: "m",    k: "qualMin" },
  { s: "7" },
  { s: "maj7" },
  { s: "m7" },
  { s: "m7♭5" },
  { s: "dim" },
  { s: "aug" },
  { s: "sus2" },
  { s: "sus4" },
  { s: "6" },
  { s: "9" },
  { s: "add9" },
  { s: "13" },
];

let selectedBar = -1;   // -1 = 沒選,性質鈕作用在最後一格

/* 把一個和弦 token 拆成 根音 / 性質 / 轉位低音。
   在原字串上切(不先正規化),使用者打的 ♯ ♭ 才不會被換成 # b。
   斜線同樣只有後面真的是音名時才當轉位,C6/9 的斜線要留在性質裡 */
function splitToken(tok){
  const m = /^([A-Ga-g][#b♯♭]?)(.*)$/.exec(tok);
  if (!m) return null;
  let suffix = m[2], bass = null;
  const cut = suffix.lastIndexOf("/");
  if (cut >= 0 && /^[A-Ga-g][#b♯♭]?$/.test(suffix.slice(cut + 1))) {
    bass = suffix.slice(cut + 1);
    suffix = suffix.slice(0, cut);
  }
  return { root: m[1], suffix, bass };
}
function joinToken(root, suffix, bass){
  return root + suffix + (bass ? "/" + bass : "");
}

/* ── 編輯的單位是「一顆和弦」,不是「一小節」 ──────────────────
   一小節可以有兩顆和弦之後,選取、鍵盤、工具列都要對得到某一顆。
   所以內部用**攤平的和弦序號**(第幾顆,從 0 數),小節結構另外記在 groups 裡 */
/* **要回含延長記號的原始 token**:編輯(鍵盤、插一格、刪一格)是從這裡
   重組整串文字的,只回和弦的話點一下就把延長記號吃掉了 */
function barGroups(){ return parsed.bars.map(b => (b.raw || b.chords.map(c => c.text)).slice()); }
/* 但**選取的單位是和弦**,延長記號不是可以點的東西,所以這兩個要跳過它 */
function chordTokens(){
  const out = [];
  for (const g of barGroups()) for (const t of g) if (!isHold(t)) out.push(t);
  return out;
}
/* 攤平的序號 → 在第幾格的第幾顆 */
function posOf(i){
  const g = barGroups();
  let n = 0;
  for (let bi = 0; bi < g.length; bi++) for (let j = 0; j < g[bi].length; j++) {
    if (isHold(g[bi][j])) continue;       // 延長記號不佔選取的序號
    if (n === i) return { bar: bi, idx: j };   // 但回的是**在 token 串裡的位置**
    n++;
  }
  return null;
}
/* 把「每一格一串和弦」組回文字。**全部都是一格一顆時用舊寫法**(`C - Am - F - G`),
   有任何一格不只一顆才寫小節線(`C Am | F | G`)——
   舊的存檔與分享連結因此一個字都不會變 */
function groupsToText(groups){
  return groups.every(g => g.length === 1)
    ? groups.map(g => g[0]).join(" - ")
    : groups.map(g => g.join(" ")).join(" | ");
}
function setGroups(groups){
  chordInput.value = groupsToText(groups.filter(g => g.length));
  reparse();
}
/* 只改某一顆和弦的文字,小節結構不動 */
function setChordAt(i, tok){
  const g = barGroups(), p = posOf(i);
  if (!p) return;
  g[p.bar][p.idx] = tok;
  setGroups(g);
}

function selectBar(i){
  selectedBar = i;
  const chips = barsGrid.querySelectorAll(".bar-ch");
  for (let n = 0; n < chips.length; n++) chips[n].classList.toggle("sel", n === selectedBar);
  const p = posOf(i);
  for (let n = 0; n < barsGrid.children.length; n++) {
    barsGrid.children[n].classList.toggle("sel", !!p && n === p.bar);
  }
  updatePalHint();
}

/* 鍵盤與工具列作用的目標:一直是「正在編輯的那一顆」。
   沒選到的時候當第 1 顆——這樣點下去一定改得到東西,不會默默加到最後面 */
function targetBar(){
  const n = chordTokens().length;
  if (selectedBar >= 0 && selectedBar < n) return selectedBar;
  return n ? 0 : -1;
}

/* 原本這裡是一行字寫「正在改第幾格的哪一顆」。那行字被**格線編輯條**取代了
   ——它把同一件事畫出來(選到的那一顆整段反白),而且還可以點。
   `updateBarTools()` 裡會重畫它,所以這裡只要轉手過去 */
function updatePalHint(){ updateBarTools(); paintPalRoot(); }

/* 點音名:換掉正在編輯那一格的根音,性質與轉位低音都留著。
   **不會自己往後跳一格**——改完第 3 格還是停在第 3 格,要改下一格就點下一格。
   一格都沒有的時候才開一格出來 */
function palRoot(root){
  const t = chordTokens();
  pushUndo();
  if (!t.length) { setGroups([[root]]); selectBar(0); return; }
  const i = targetBar();
  const p = splitToken(t[i]);
  setChordAt(i, p ? joinToken(root, p.suffix, p.bass) : root);
  selectBar(i);
}

/* 升降記號:套在正在編輯那一顆的**字母**上(♮ 是拿掉)。
   字母不動,所以 C♯ 按 ♭ 是 C♭ 不是 D♭——要 D♭ 就是先點 D 再點 ♭,跟寫譜一樣 */
const PAL_LETTERS = ["C","D","E","F","G","A","B"];
const PAL_ACCS = [{ a: "♭", n: "flat" }, { a: "", n: "natural", label: "♮" }, { a: "♯", n: "sharp" }];
function rootAcc(root){
  const c = root.slice(1);
  return c === "#" || c === "♯" ? "♯" : c === "b" || c === "♭" ? "♭" : "";
}
function palAcc(acc){
  const t = chordTokens();
  if (!t.length) return;
  const i = targetBar();
  const p = splitToken(t[i]);
  if (!p) return;
  const want = p.root[0].toUpperCase() + acc;
  if (want === p.root) return;
  pushUndo();
  setChordAt(i, joinToken(want, p.suffix, p.bass));
  selectBar(i);
}
/* 鍵盤上亮起「正在編輯那一顆」的字母與升降,一眼看得到現在是 D♭ 還是 C♯ */
function paintPalRoot(){
  const box = $("palRoots");
  if (!box) return;
  const t = chordTokens(), i = targetBar();
  const p = i >= 0 ? splitToken(t[i]) : null;
  const L = p ? p.root[0].toUpperCase() : null, A = p ? rootAcc(p.root) : null;
  for (const b of box.querySelectorAll("[data-letter]")) b.setAttribute("aria-pressed", String(b.dataset.letter === L));
  for (const b of box.querySelectorAll("[data-acc]")) b.setAttribute("aria-pressed", String(!!p && b.dataset.acc === A));
  /* 性質也要亮,不然不知道自己按了什麼(被回報過)。比的是**音程集合**不是字面:
     `M7`、`Δ7`、`maj7` 是同一顆,`m7b5` 與 `m7♭5` 也是 */
  const qk = p ? qualKey(p.suffix) : null;
  for (const b of $("palQuals").querySelectorAll("[data-qual]")) b.setAttribute("aria-pressed", String(qk !== null && b.dataset.qual === qk));
}
function qualKey(suffix){
  const c = parseChord("C" + (suffix || ""));
  return c ? c.intervals.slice().sort((x, y) => x - y).join(",") : null;
}

/* 點性質:換掉正在編輯那一格的性質,根音與轉位低音都留著 */
function palQual(suffix){
  const t = chordTokens();
  pushUndo();
  if (!t.length) { setGroups([["C" + suffix]]); selectBar(0); return; }
  const i = targetBar();
  const p = splitToken(t[i]);
  setChordAt(i, p ? joinToken(p.root, suffix, p.bass) : "C" + suffix);
  selectBar(i);
}

/* 小節數:先決定幾格(下拉,4 的倍數到 40),再一格一格填。
   變多就把現有的進行重複貼滿(4 → 8 就是同一句唱兩次),變少就截掉;
   一格都沒有的話開一排 C 出來讓人改 */
function setBarCount(n){
  const g = barGroups();
  pushUndo();
  const out = [];
  for (let i = 0; i < n; i++) out.push(g.length ? g[i % g.length].slice() : ["C"]);
  formParts = [];          // 手動改長度就回自由輸入,形式那行才不會對不上
  clearFormMeter();
  setGroups(out);
  selectBar(0);            // 直接停在第 1 顆,接著就能改
}

/* 刪一格:刪掉**正在編輯的那一顆所在的整格**。
   一格裡有兩顆的時候先刪掉那一顆,剩下的留著(那是「合併回一顆」) */
function palDelete(){
  const g = barGroups(), p = posOf(targetBar());
  if (!p) return;
  pushUndo();
  /* 刪掉一顆和弦要**連它後面的延長記號一起刪**:留著的話那幾拍會
     被前一顆吃掉,看起來像「我刪了一顆,旁邊那顆卻變長了」 */
  let span = 1;
  while (p.idx + span < g[p.bar].length && isHold(g[p.bar][p.idx + span])) span++;
  if (g[p.bar].length > span) g[p.bar].splice(p.idx, span);
  else g.splice(p.bar, 1);
  setGroups(g);
  selectBar(Math.min(targetBar(), Math.max(0, chordTokens().length - 1)));
}

/* ── 復原 ────────────────────────────────────────────────────
   調色盤、段落庫、工具列改到的都是整串文字,所以只要把改之前那一串存起來
   就能退回去。文字框自己打字有瀏覽器內建的復原,不用經過這裡 */
const undoStack = [];
function pushUndo(){
  undoStack.push(chordInput.value);
  if (undoStack.length > 30) undoStack.shift();
  updateBarTools();
}
function undoEdit(){
  if (!undoStack.length) return;
  chordInput.value = undoStack.pop();
  formParts = [];          // 退回去之後就當自由輸入,不然形式那行會對不上
  clearFormMeter();
  selectedBar = -1;
  reparse();
  updateBarTools();
}

/* ── 小節工具列 ──────────────────────────────────────────────
   選一格就能搬移、在後面插一格(複製)、刪掉。插入用複製的,因為
   「同一個和弦撐兩小節」跟「先插一格再改」都是這一顆按鈕 */
function dupBar(){
  const g = barGroups(), p = posOf(targetBar());
  if (!p) return;
  pushUndo();
  g.splice(p.bar + 1, 0, g[p.bar].slice());
  setGroups(g);
  selectBar(targetBar() + g[p.bar].length);
}

/* token 串裡的位置 → 這是第幾顆**和弦**(跳過延長記號) */
function chordIndexAt(p){
  const raw = (parsed.bars[p.bar] && parsed.bars[p.bar].raw) || [];
  let ci = 0;
  for (let j = 0; j < p.idx && j < raw.length; j++) if (!isHold(raw[j])) ci++;
  return ci;
}

/* 把「這一顆佔幾格」寫回 token。一顆和弦本身就是一拍,
   多出來的用 `/`(一拍)與 `.`(一格)補上去 */
function lenTokens(text, units){
  const cd = chordDiv(), out = [text];
  let extra = Math.max(0, units - cd);
  while (extra >= cd) { out.push("/"); extra -= cd; }
  while (extra > 0) { out.push("."); extra--; }
  return out;
}

/* ── 正在改的那一顆和弦加長/縮短一格 ──────────────────────────
   一格 = 八分音符(4/4 與 3/4 是半拍、6/8 是三分之一拍)。
   **借的是隔壁那一顆的時間**(有下一顆就跟下一顆借,沒有就跟上一顆),
   所以整格的總長度永遠不變——不然調一顆會把整首的小節長度弄亂。

   **下限是不對稱的**,而且那是文字語法決定的不是我挑的:
   一顆和弦寫出來的起跳就是**一拍**(`C` 本身 = 一拍,`/` `.` 只能往上加),
   所以**前面那幾顆最少一拍**;但**最後一顆是負責把小節補滿的那顆**,
   它的長度是「整格減掉前面」算出來的,所以可以短到**一格**。

   第一版把下限一律訂成一拍,結果 6/8 兩顆和弦(兩大拍)完全動不了、
   4/4 四顆也全部鎖死——那正是最需要調的情況。
   照語法真正寫得出來的範圍訂,才不會寫出存檔之後讀不回來的東西 */
function minUnits(i, n){ return i === n - 1 ? 1 : chordDiv(); }
function nudgeLen(d){
  const i = targetBar(), p = posOf(i);
  if (!p) return;
  const bar = parsed.bars[p.bar];
  if (!bar || bar.chords.length < 2) return;    // 一格一顆沒有長度可調
  const sp = spansOf(bar), ci = chordIndexAt(p), cd = chordDiv();
  const n = sp.length;
  const other = ci + 1 < n ? ci + 1 : ci - 1;
  if (other < 0) return;
  const mine = sp[ci].w + d, theirs = sp[other].w - d;
  if (mine < minUnits(ci, n) || theirs < minUnits(other, n)) return;
  sp[ci].w = mine; sp[other].w = theirs;
  writeSpans(p, sp.map(x => x.w), sp.map(x => x.text), ci);
}

/* ── 這一小節的編輯條:像 DAW 在軌道上切 region ──────────────────
   量過:四顆和弦時上面小節格的子格只有 **14–23px 寬**(手機 14、平板 16、
   筆電 23),而觸控的最低標準是 44px——「選哪一顆和弦」這件事在小節格裡
   根本做不到,而且四顆都寫同一個名字也分不出誰是誰。
   要四顆各有 44px 只有**整排寬度**做得到(480 ÷ 4 = 120px),
   所以它一定要自己佔一排,不能再塞在工具列旁邊(那裡只有 150–174px)。

   **四個動作各自有自己的目標**,不要疊在同一個點上
   (疊在一起就是「點下去不知道會發生什麼」——上一版的格線條就是這樣:
   同一格點下去有時是切、有時是併,要先算才知道):
     和弦方塊       → 選它(接著用下面的鍵盤改)  ← 最大的目標,九成的操作
     方塊之間的把手 → 拖曳改「在哪裡換和弦」(拖得到拍子中間)
     ＋             → 把選到的那一顆切成兩半(多一顆和弦)
     ×             → 把選到的那一顆併回前一顆(少一顆和弦)

   合法性一律**在畫的時候就算好**(`beSplitPlan` / `beMergePlan`),
   不能等按下去才擋:按鈕亮著卻按不動比停用還難懂。 */

/* 沒寫時值時的平分:跟 `spansOf` 那條「拍數平分、分不完的前面拿多的」同一份算法 */
function evenLens(n){
  const beats = beatsInBar(), cd = chordDiv(), out = [];
  const each = Math.floor(beats / n), extra = beats % n;
  for (let i = 0; i < n; i++) out.push((each + (i < extra ? 1 : 0)) * cd);
  return out;
}

/* 把一格的和弦與時值寫回文字。**跟平分一樣就不要寫延長記號**:
   `C Am | F G` 比 `C / Am / | F / G /` 好讀太多,而且舊的存檔、分享連結、
   段落庫全部都是前面那個寫法——寫回去要長得跟原本一樣 */
function writeSpans(p, lens, texts, selCi){
  const ev = evenLens(lens.length);
  const plain = lens.length === ev.length && lens.every((L, i) => L === ev[i]);
  const g = barGroups();
  /* **最後一顆不寫延長記號**:`spansOf` 本來就讓它去補滿整小節
     (「你只寫你在意的那幾顆,最後一顆負責把小節填滿」),
     寫了只是多兩個看不懂的符號——`C . Am` 比 `C . Am / .` 好讀太多 */
  g[p.bar] = plain ? texts.slice()
                   : lens.reduce((acc, L, j) => acc.concat(
                       j === lens.length - 1 ? [texts[j]] : lenTokens(texts[j], L)), []);
  pushUndo();
  setGroups(g);
  let flat = 0;
  for (let bi = 0; bi < p.bar; bi++) flat += parsed.bars[bi].chords.length;
  const cnt = (parsed.bars[p.bar] || { chords: [] }).chords.length;
  selectBar(flat + Math.max(0, Math.min(selCi, cnt - 1)));
}

/* ＋:把選到的那一顆切成兩半。**切在正中間**,分不成整數格時前面拿多的
   (跟平分同一條規則)。兩條限制:顆數不超過拍數;除了最後一顆,
   每一顆至少一拍(`minUnits`——文字語法寫不出比一拍短的非結尾和弦) */
function beSplitPlan(sp, ci){
  if (!sp.length || ci < 0 || ci >= sp.length) return null;
  if (sp.length >= Math.max(1, beatsInBar())) return null;
  const n2 = sp.length + 1, w = sp[ci].w;
  const a = Math.ceil(w / 2), b = w - a;
  if (a < minUnits(ci, n2) || b < minUnits(ci + 1, n2)) return null;
  const lens = sp.map(x => x.w), texts = sp.map(x => x.text);
  lens[ci] = a; lens.splice(ci + 1, 0, b);
  texts.splice(ci + 1, 0, texts[ci]);
  return { lens, texts, sel: ci + 1 };
}

/* ×:把選到的那一顆併回**前一顆**。選到第一顆時沒有前一顆可以併,
   那就把後面那顆併進來(留自己)——不然一格的第一顆永遠按不動,
   而「這一格我不要兩顆了」正是從第一顆按下去最自然 */
function beMergePlan(sp, ci){
  if (sp.length < 2) return null;
  const at = ci > 0 ? ci : 1;
  const lens = sp.map(x => x.w), texts = sp.map(x => x.text);
  lens[at - 1] += lens[at];
  lens.splice(at, 1); texts.splice(at, 1);
  return { lens, texts, sel: at - 1 };
}

function beApply(plan){
  const p = posOf(targetBar());
  if (!p || !plan) return;
  writeSpans(p, plan.lens, plan.texts, plan.sel);
}

/* ── 拖把手:改「在哪裡換和弦」 ────────────────────────────────
   一格 = 一個八分音符。拖的時候**只動 CSS**(左右兩塊即時跟著走),
   放開才寫回文字——中途每動一格就 `reparse()` 一次的話,
   整棵 DOM 會在手指底下重畫,拖起來會頓 */
function beGrip(ev, i, sp, p){
  const lane = $("beLane");
  if (!lane) return;
  const N = chordUnits(), n = sp.length;
  const lens = sp.map(x => x.w), starts = [];
  let acc = 0;
  for (const L of lens) { starts.push(acc); acc += L; }
  const lo = starts[i - 1] + minUnits(i - 1, n);
  const end = starts[i] + lens[i];
  const hi = end - minUnits(i, n);
  if (hi < lo) return;
  const rect = lane.getBoundingClientRect();
  const blocks = lane.querySelectorAll(".be-block");
  const grip = ev.currentTarget;
  const pct = u => (u / N * 100) + "%";
  let at = starts[i];
  grip.classList.add("drag");
  const move = e2 => {
    const k = Math.round((e2.clientX - rect.left) / rect.width * N);
    at = Math.max(lo, Math.min(hi, k));
    blocks[i - 1].style.width = pct(at - starts[i - 1]);
    blocks[i].style.left = pct(at);
    blocks[i].style.width = pct(end - at);
    grip.style.left = pct(at);
    /* **拖的時候方塊寫的是時值不是和弦名**:一拍半跟兩拍畫出來只差幾 px,
       看寬度猜不出來。名字放開就回來(整排重畫) */
    blocks[i - 1].textContent = lenLabel(at - starts[i - 1]);
    blocks[i].textContent = lenLabel(end - at);
    blocks[i - 1].style.fontSize = blocks[i].style.fontSize = "";
  };
  const up = () => {
    grip.classList.remove("drag");
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
    if (at === starts[i]) { renderBarEdit(); return; }   // 沒動也要重畫:方塊上還寫著時值
    lens[i - 1] = at - starts[i - 1];
    lens[i] = end - at;
    writeSpans(p, lens, sp.map(x => x.text), i);
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
  ev.preventDefault();
}

/* 畫編輯條。方塊的寬度是**算完的時值**(`spansOf`)不是寫的權重——
   最後一顆會去補滿小節,只看權重畫出來跟聽到的不一樣 */
function renderBarEdit(){
  const row = $("barEdit"), lane = $("beLane");
  if (!row || !lane) return;
  const p = posOf(targetBar());
  const bar = p && parsed.bars[p.bar];
  const add = $("beAdd"), del = $("beDel");
  lane.innerHTML = "";
  row.classList.toggle("off", !bar);
  $("beNum").textContent = bar ? String(p.bar + 1) : "";
  $("beNum").title = bar ? T("beNumLabel", { n: p.bar + 1 }) : "";
  if (!bar) {
    if (add) add.disabled = true;
    if (del) del.disabled = true;
    return;
  }
  const N = chordUnits(), beats = beatsInBar();
  const sp = spansOf(bar), selCi = chordIndexAt(p);
  const trSteps = transposeSteps(parsed.bars);
  /* 拍點畫一條淡線:拖把手的時候才看得出來拖到第幾拍 */
  lane.style.gridTemplateColumns = "repeat(" + beats + ",minmax(0,1fr))";
  for (let b = 0; b < beats; b++) {
    const g = document.createElement("div");
    g.className = "be-beat";
    lane.appendChild(g);
  }
  const laneW = lane.clientWidth || 300;
  const grips = [];
  let u = 0;
  for (let i = 0; i < sp.length; i++) {
    const x = sp[i], my = u;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "be-block" + (i === selCi ? " sel" : "") + (x.ok ? "" : " bad");
    btn.style.left = (my / N * 100) + "%";
    btn.style.width = (x.w / N * 100) + "%";
    const label = x.ok ? chordDisplay(x.chord, trSteps) : x.text;
    /* **和弦名字被切掉比字小一號嚴重得多**(`Cmaj7` 切成 `Cm…` 會被看成別的和弦),
       所以窄的時候先縮字、真的縮不下去就整個不寫——
       名字在上面的小節格本來就看得到,這一條的工作是「在哪裡換」 */
    const room = x.w / N * laneW - 10;
    const fs = Math.min(13, room / Math.max(1, label.length) / 0.76);
    if (fs >= 8) {
      btn.textContent = label;
      if (fs < 13) btn.style.fontSize = fs.toFixed(1) + "px";
    }
    btn.title = T("beBlockLabel", { chord: label, len: lenLabel(x.w) });
    btn.setAttribute("aria-label", btn.title);
    let flat = 0;
    for (let bi = 0; bi < p.bar; bi++) flat += parsed.bars[bi].chords.length;
    const pick = flat + i;
    btn.addEventListener("click", () => selectBar(pick));
    lane.appendChild(btn);
    if (i > 0) {
      /* **動不動得了要在畫的時候就算好**(跟 ＋ × 同一條規則):
         拖了沒反應比停用還難懂。四顆和弦的 4/4 只有最後一根把手動得了——
         **除了最後一顆,每一顆至少一拍**(`minUnits`),
         所以前面那幾根兩邊都已經在下限上了 */
      const free = my - sp[i - 1].w + minUnits(i - 1, sp.length)
                 <= my + x.w - minUnits(i, sp.length) - 1;
      const grip = document.createElement("button");
      grip.type = "button";
      grip.className = "be-grip" + (free ? "" : " fixed");
      grip.style.left = (my / N * 100) + "%";
      grip.title = T(free ? "beGripLabel" : "beGripFixed");
      grip.setAttribute("aria-label", grip.title);
      if (free) grip.addEventListener("pointerdown", ev => beGrip(ev, i, sp, p));
      grips.push(grip);
    }
    u += x.w;
  }
  // 把手最後才放進去:兩層都是 absolute,後面的疊在上面才抓得到
  for (const g of grips) lane.appendChild(g);
  const splitOK = !!beSplitPlan(sp, selCi), mergeOK = !!beMergePlan(sp, selCi);
  if (add) {
    add.disabled = !splitOK;
    add.title = splitOK ? T("beAddLabel", { n: beats }) : T("beAddFull", { n: beats });
    add.setAttribute("aria-label", add.title);
  }
  if (del) {
    del.disabled = !mergeOK;
    del.title = mergeOK ? T("beDelLabel") : T("beDelNone");
    del.setAttribute("aria-label", del.title);
  }
}

/* 「1½ 拍」那串字。6/8 一格是三分之一拍,所以分母要跟著拍號走 */
function lenLabel(units){
  const cd = chordDiv(), whole = Math.floor(units / cd), r = units % cd;
  const frac = r === 0 ? "" : cd === 3 ? (r === 1 ? "⅓" : "⅔") : "½";
  return T("lenBeats", { n: (whole || !frac ? String(whole) : "") + frac });
}

/* 小節數:**4 的倍數,到 40**。選的是「現在幾小節」,不是「要看哪一組段落」。
   為什麼是 4 的倍數:樂句就是四小節一句,小節格也是一排四格
   (超過 12 格才變一排八格),所以 4 的倍數永遠排得整齊。
   為什麼停在 40:一排八格就是五排,再往上版面收不住;
   `MAX_BARS` 是 64,但那已經不是「一首歌的長度」而是把整首曲子打進來了 */
const LEN_STEP = 4, LEN_MAX = 40;
function updateLenSeg(){
  const sel = document.getElementById("lenSel");
  if (!sel) return;
  const n = parsed.bars.length;
  const vals = [];
  for (let v = LEN_STEP; v <= LEN_MAX; v += LEN_STEP) vals.push(v);
  /* **自己打字打得出不是 4 的倍數的長度**(貼一段 5 小節的進行、刪掉一格),
     那時候選單還是要講實話:把現在這個數字插進去排好。
     漏掉的話它會停在別的數字上,看起來就像「我明明是 5 小節,它寫 4」 */
  if (n > 0 && vals.indexOf(n) < 0) { vals.push(n); vals.sort((a, b) => a - b); }
  /* 清單沒變就不要重畫:重畫會把展開中的選單收掉,而且切語言時才需要換字 */
  const key = vals.join(",") + "/" + currentLang;
  if (sel.dataset.key !== key) {
    sel.innerHTML = "";
    for (const v of vals) {
      const o = document.createElement("option");
      o.value = String(v);
      o.textContent = T("secLenGroup", { n: v });
      sel.appendChild(o);
    }
    sel.dataset.key = key;
  }
  sel.value = n > 0 ? String(n) : "";
}

function updateBarTools(){
  if (!$("barDup")) return;
  const n = chordTokens().length;
  const i = (selectedBar >= 0 && selectedBar < n) ? selectedBar : -1;
  const set = (id, disabled, label) => {
    const el = $(id);
    if (!el) return;
    el.disabled = disabled;
    el.setAttribute("title", label);
    el.setAttribute("aria-label", label);
  };
  set("barDup",   !n,                   T("barDupLabel"));
  set("barDel",   !n,                   T("barDelLabel"));
  {
    const p = posOf(i >= 0 ? i : 0);
    const bar = p && parsed.bars[p.bar];
    const cnt = bar ? bar.chords.length : 1;
    /* 原本這裡還有一顆「切兩顆 / 合併」。**格線編輯條把它涵蓋掉了**
       (點格線就是切、再點同一條就是併),照「加按鈕之前先問沒有它做不做得到」
       那條規則它就該收掉——順便把那 60px 的寬度讓給格線條 */
    /* 長度增減:一格一顆的時候沒有東西可以調(整格就是它),所以停用。
       數字顯示的是**算完的時值**不是寫的權重 */
    renderBarEdit();
  }
  set("barUndo",  !undoStack.length,    undoStack.length ? T("barUndoLabel") : T("barUndoNone"));
}

function qualLabel(q){ return q.k ? T(q.k) : q.s; }

function renderPalette(){
  const rootBox = $("palRoots");
  rootBox.innerHTML = "";
  for (const r of PAL_LETTERS) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pal-btn";
    b.textContent = r;
    b.dataset.letter = r;
    b.title = T("palLetterLabel", { root: r });
    b.setAttribute("aria-label", b.title);
    b.addEventListener("click", () => palRoot(r));
    rootBox.appendChild(b);
  }
  const gap = document.createElement("span");
  gap.className = "pal-gap";
  rootBox.appendChild(gap);
  for (const x of PAL_ACCS) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pal-btn";
    b.textContent = x.label || x.a;
    b.dataset.acc = x.a;
    b.title = T("palAccLabel", { acc: x.label || x.a });
    b.setAttribute("aria-label", b.title);
    b.addEventListener("click", () => palAcc(x.a));
    rootBox.appendChild(b);
  }
  const qualBox = $("palQuals");
  qualBox.innerHTML = "";
  for (const q of PAL_QUALS) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pal-btn";
    b.textContent = qualLabel(q);
    b.title = T("palQualLabel", { q: qualLabel(q) });
    b.setAttribute("aria-label", b.title);
    b.dataset.qual = qualKey(q.s) || "";
    b.addEventListener("click", () => palQual(q.s));
    qualBox.appendChild(b);
  }
  updatePalHint();
}

     要收到 Cmaj7 它才站得住。A♭m7-D♭7 是 V7 的三全音代理,那是這首的招牌 */
  { text: "Dm7 G7 | Dm7 G7 | Em7 A7 | Em7 A7 | Am7 D7 | Abm7 Db7 | Cmaj7 | Cmaj7", feel: "swing", meter: "4/4", role: "form" },  // Satin Doll 的 A 段,一小節兩顆
  { text: "Cmaj7 Am7 | Dm7 G7 | Em7 A7 | Dm7 G7",                  feel: "swing",   meter: "4/4", role: "form" },  // rhythm changes 的 A 段,一小節兩顆
  { text: "Am7 - Dm7 - G7 - Cmaj7 - Fmaj7 - Bm7b5 - E7 - Am7",     feel: "swing",   meter: "4/4", role: "form" },  // 一路下行五度(Fly Me to the Moon 的 A 段)
  { text: "Cmaj7 - Cmaj7 - D7 - D7 - Dm7 - G7 - Cmaj7 - Cmaj7",    feel: "swing",   meter: "4/4", role: "form" },  // I-II7-ii-V-I(Take the A Train 的 A 段)
  { text: "Dm9 - G13 - Cmaj9 - Cmaj9", feel: "swing",   meter: "4/4", role: "verse" },  // 同一個 ii-V-I 換九度聲位
  { text: "Am9 - Dm9 - E7b9 - Am9",    feel: "swing",   meter: "4/4", role: "verse" },  // 爵士小調
  { text: "Dm7 - G7 - Cmaj7 - Fmaj7 - Bm7b5 - E7 - Am7 - A7",      feel: "swing",   meter: "4/4", role: "form" },  // 大調 ii-V-I 接小調 ii-V-i(落葉型)
  { text: "Cmaj9 - Cmaj9 - Dm9 - G13 - Cmaj9 - A7b9 - Dm9 - G13",  feel: "swing",   meter: "4/4", role: "chorus" },  // smooth jazz
  { text: "Am9 - Am9 - Dm9 - Dm9 - Am9 - Am9 - Bm7b5 - E7b9",      feel: "swing",   meter: "4/4", role: "verse" },  // 爵士小調,ii°-V 推回開頭
  { text: "C7 - F7 - C7 - C7 - F7 - F7 - C7 - A7 - Dm7 - G7 - C7 - A7", feel: "swing", meter: "4/4", role: "form" },  // 爵士藍調:第 9 小節走 ii-V,收在 VI7
  { text: "Cmaj9 - Am9 - Dm9 - G13",   feel: "swing",   meter: "3/4", role: "verse" },  // 爵士圓舞曲
  { text: "Cmaj9 - Cmaj9 - Dm9 - G13 - Em9 - A7b9 - Dm9 - G13",    feel: "swing",   meter: "3/4", role: "chorus" },  // 爵士圓舞曲一句,收在 ii-V 推回開頭
  { text: "C9 - F9 - C9 - C9 - F9 - F9 - C9 - C9 - G13 - F9 - C9 - G13", feel: "swing", meter: "6/8", role: "form" },  // 爵士的慢藍調:九度聲位,ride 走 12/8 的 shuffle

  /* ── Funk:十六分。和聲很少、律動很多,所以都是 vamp ───────── */
  { text: "Am7 - Am7 - Dm9 - Dm9",     feel: "funk",    meter: "4/4", role: "verse" },  // i-iv 兩小節一換的 vamp
  { text: "Am7 - Dm9 - Am7 - Dm9",     feel: "funk",    meter: "4/4", role: "verse" },  // 同一個 vamp 一小節一換
  { text: "C9 - C9 - F9 - C9",         feel: "funk",    meter: "4/4", role: "verse" },  // 放克藍調的頭四小節
  { text: "Am7 - Dm9 - Am7 - Dm9 - Fmaj7 - G7 - Am7 - Am7",        feel: "funk",    meter: "4/4", role: "chorus" },  // vamp 四小節後接一句
  { text: "C9 - F9 - C9 - C9 - F9 - F9 - C9 - C9 - G9 - F9 - C9 - G9", feel: "funk", meter: "4/4", role: "form" },  // 12 小節的放克藍調
];

/* ── 形式 ──────────────────────────────────────────────────────
   一個 4 小節的循環聽再久都會膩,所以可以把段落接起來:
   點兩次第一組、再點兩次第二組,就是 A A B B。
   formParts 記的是「接了哪些段落」,文字框永遠從它重新組出來;
   使用者自己動手打字就把它清掉,回到自由輸入模式,兩邊不會打架。 */
let secRepeat = 1;     // 下一次點段落要接幾次
let formParts = [];    // [{ text }]
/* 這串進行「原本是幾拍子的」。從段落庫點來的才有,自己打字是 null。
   有值的時候另外兩個拍號會變暗:那是提示不是鎖,還是點得下去 */
let formMeter = null;
/* 「原本是什麼曲風的」。用途只有一個:接段落時擋住跨曲風亂接 */
let formFeel = null;

/* ── 段落的角色:主歌 / 導歌 / 副歌 / 完整形式 ───────────────────
   一段四小節的循環繞二十次是拿來練句子的,但要練「一首歌」就得有段落的起伏:
   主歌兩次 → 副歌兩次。所以每一組進行都帶一個 `role`,
   段落庫照角色分區,再加一顆「組一首」把整個循環一次接起來。

   **角色是這組進行本身的性質,不是使用者選的**:
   `C - G - Am - F`(Axis)天生是副歌的形狀、`Am - G - F - E7`(安達魯西亞)
   天生是主歌的形狀。跟曲風、拍號一樣寫在 `SECTIONS` 裡。
   `form` 是「它本身就是一整首」(12 小節藍調、爵士標準曲的 A 段),
   那種不進「組一首」的公式,點下去就是完整的一輪 */
const SEC_ROLES = ["verse", "pre", "chorus", "form"];
const ROLE_I18N = { verse: "roleVerse", pre: "rolePre", chorus: "roleChorus", form: "roleForm" };

/* 形式那一行寫的是段落名字不是 A B C:`主歌 ・ 主歌 ・ 副歌 ・ 副歌` 一看就懂,
   `A A B B` 還要自己回想 A 是什麼。同一個角色出現兩次以上就編號 */
function formLabels(){
  const seen = [], out = [];
  for (const p of formParts) {
    let i = seen.indexOf(p.text);
    if (i < 0) { seen.push(p.text); i = seen.length - 1; }
    out.push({ i, role: p.role || "verse" });
  }
  // 同一個角色有幾種不同的進行,才需要編號(主歌1 / 主歌2)
  const kinds = {};
  for (const o of out) (kinds[o.role] = kinds[o.role] || new Set()).add(o.i);
  return out.map(o => {
    const name = T(ROLE_I18N[o.role] || "roleVerse");
    if (kinds[o.role].size < 2) return name;
    return name + ([...kinds[o.role]].indexOf(o.i) + 1);
  });
}
function formLetters(){ return formLabels(); }

/* 接段落:每一段先切成「每一格一串和弦」,再一起組回文字。
   **不能直接用「-」串起來**——只要有一段裡面有 `|`,整串就會被當成小節線的寫法,
   前面那幾段的 `-` 就變成「同一小節裡的和弦」,四小節會被擠成一小節 */
function partGroups(text){
  return text.indexOf("|") >= 0
    ? text.split("|").map(seg => seg.split(/[\s,\-－]+/).filter(Boolean)).filter(a => a.length)
    : text.split(/[\s,\-－]+/).filter(Boolean).map(t => [t]);
}
function applyForm(){
  const groups = [];
  for (const p of formParts) for (const g of partGroups(p.text)) groups.push(g);
  chordInput.value = groupsToText(groups);
  reparse();
}

/* 段落清單放不下時會自己捲。上下各掛一層漸層,讓「還有更多」看得出來,
   被切一半的那一排也不會硬生生斷在那裡 */
function updateExFade(){
  const box = $("examples");
  if (!box) return;
  const room = box.scrollHeight - box.clientHeight;
  box.classList.toggle("more-below", room > 2 && box.scrollTop < room - 2);
  box.classList.toggle("more-above", room > 2 && box.scrollTop > 2);
}

function renderExamples(){
  const box = $("examples");
  box.innerHTML = "";
  /* 上面的分頁決定看哪一個拍號,清單裡再按長度分成 4 / 8 / 12 小節三區。
     以前全部混在一起(36 組一路排下來)找不到自己要的那種長度;
     分頁放在最上面是因為點下去的進行真的會換掉曲子的拍號,
     先講清楚現在在看哪一種拍子 */
  // 格子太窄時 CSS 會照最長的和弦縮字。同樣長度的進行共用同一個「最長字數」,
  // 整組才會是同一個字級——同一排字忽大忽小比小一點還難看
  const widest = {};
  for (const ex of SECTIONS) {
    const gs = partGroups(ex.text);
    // 一格兩顆時那一格要放得下兩個名字,所以字數算整格的
    widest[gs.length] = Math.max(widest[gs.length] || 0, ...gs.map(g => g.join(" ").length));
  }
  /* 列的一定是「現在這個曲風」的進行:上面那排就是選單,這裡不用再選一次。
     每個曲風的進行本來就不一樣(Pop 20 組、Funk 5 組),全部列出來只會找不到 */
  const mine = SECTIONS.filter(e => e.feel === feelNow);
  const title = $("secTitle");
  if (title) title.textContent = T("secTitleNow", { f: T(FEEL_I18N[feelNow] || "feelStraight"), n: mine.length });
  /* 這個曲風橫跨幾個拍號?只有一個就不用在標題上寫(Bossa 全是 4/4,寫了是廢話);
     跨兩個以上才補上去——Pop 的三拍是圓舞曲、六八拍是抒情歌,那是兩首不同的歌 */
  const metersHere = METER_KEYS.filter(m => mine.some(e => e.meter === m));
  /* **先按角色分,再按拍號**。原本是按「4 / 8 / 12 小節」分,
     但使用者要的是「先挑主歌再挑副歌」,長度是挑完才看的事
     (而且長度已經寫在膠囊上了——一排幾顆和弦就是幾小節) */
  for (const role of SEC_ROLES) {
    for (const m of metersHere) {
      const items = mine.filter(e => (e.role || "verse") === role && e.meter === m);
      if (!items.length) continue;
      const h = document.createElement("div");
      h.className = "ex-group";
      h.textContent = metersHere.length > 1
        ? T("secRoleMeterGroup", { r: T(ROLE_I18N[role]), m })
        : T(ROLE_I18N[role]);
      box.appendChild(h);
      for (const ex of items) renderExampleChip(box, ex, widest);
    }
  }
  renderSongBtn();
  refreshSecChrome();
}

/* ── 組一首:主歌 ×2 → (導歌) → 副歌 ×2 ────────────────────────
   一次把一整個循環接起來,不用自己點四次。挑的是這個曲風、同一個拍號裡
   **第一組**主歌與副歌(清單是固定順序的,所以每次點結果一樣、可預期);
   有導歌就夾在中間一次。
   藍調與爵士那種「本身就是一整首」的曲風沒有主副歌之分,那就不顯示這顆 */
function songPlan(){
  const mine = SECTIONS.filter(e => e.feel === feelNow);
  const pick = (role, m) => mine.find(e => (e.role || "verse") === role && e.meter === m);
  // 拍號跟著主歌走:一首歌不會主歌四拍、副歌六八拍
  for (const m of METER_KEYS) {
    const v = pick("verse", m), c = pick("chorus", m);
    if (!v || !c) continue;
    const plan = [v, v];
    const pre = pick("pre", m);
    if (pre) plan.push(pre);
    plan.push(c, c);
    return plan;
  }
  return null;
}
function renderSongBtn(){
  const host = $("secSong");
  if (!host) return;
  host.innerHTML = "";
  const plan = songPlan();
  if (!plan) { host.hidden = true; return; }
  host.hidden = false;
  const b = document.createElement("button");
  b.type = "button";
  b.className = "btn song-btn";
  /* 字樣要照**真的會接出來的那一串**寫,不要寫死「主歌×2 → 副歌×2」:
     有導歌的曲風接出來是五段,寫成四段就對不上按下去的結果 */
  const seq = [];
  for (const e of plan) {
    const name = T(ROLE_I18N[e.role] || "roleVerse");
    const last = seq[seq.length - 1];
    if (last && last.name === name) last.n++;
    else seq.push({ name, n: 1 });
  }
  b.textContent = T("secBuildSong", {
    f: T(FEEL_I18N[feelNow] || "feelStraight"),
    seq: seq.map(x => x.n > 1 ? x.name + "×" + x.n : x.name).join(" → "),
    n: plan.reduce((a, e) => a + partGroups(e.text).length, 0),
  });
  b.addEventListener("click", () => {
    pushUndo();
    formParts = plan.map(e => ({ text: e.text, role: e.role }));
    formMeter = plan[0].meter;
    formFeel = plan[0].feel;
    setMeter(plan[0].meter);
    setFeelPick(plan[0].feel);
    applyForm();
    renderExamples();
  });
  host.appendChild(b);
}

/* 一顆膠囊。點下去:接到形式後面 + 換曲風 + 換拍號。
   **不動伴奏樣式**:疏密是使用者那一軸的東西(見 CLAUDE.md「兩個軸」)。
   以前每一組進行都自己帶一個建議的疏密,點下去就把使用者選的蓋掉——
   選了「混合」再挑一組進行,混合就被換成「打點」,聽起來就像混合壞了(被回報過)。
   曲風與拍號是這首歌的事實,疏密不是 */
function renderExampleChip(box, ex, widest){
  const chords = partGroups(ex.text).map(g => g.join(" "));
  const b = document.createElement("button");
  b.type = "button";
  b.className = "ex-btn" + (chords.length > 4 ? " long" : "") + (chords.length > 8 ? " xlong" : "")
              + (formParts.some(p => p.text === ex.text) ? " on" : "");
  // --n 是幾顆和弦、--len 是最長那顆的字數,CSS 拿這兩個算字級,寬度不夠就自己縮
  b.style.setProperty("--n", chords.length);
  b.style.setProperty("--len", widest[chords.length]);
  // 一顆和弦一個等寬格子。整串丟進 textContent 只會得到一條擠在一起的字,
  // 長的那幾組還會被 ellipsis 吃掉尾巴
  for (const c of chords) {
    const cell = document.createElement("span");
    cell.className = "ex-ch";
    cell.textContent = c;
    b.appendChild(cell);
  }
  // 拆成格子之後讀屏會一格一格念,補一個完整的進行當標籤
  b.setAttribute("aria-label", ex.text);
  b.title = T("secAdd", { n: secRepeat });
  b.addEventListener("click", () => {
    /* 接上去的那一段如果是別的拍號**或別的曲風**,就當作重開一首:
       A 段三拍、B 段六八拍的曲子基本上不存在,A 段 City Pop、B 段 Blues 也一樣——
       硬接只會得到一串要自己清掉的東西,而且曲風只會留下後面那一段的 */
    if ((formMeter && formMeter !== ex.meter) || (formFeel && formFeel !== ex.feel)) formParts = [];
    for (let i = 0; i < secRepeat; i++) formParts.push({ text: ex.text, role: ex.role });
    /* 這句歌本來是幾拍子的,點下去就一起換過去。formMeter 記著它,
       另外兩個拍號會變暗——使用者不必自己想「這組是不是三拍的」 */
    formMeter = ex.meter;
    formFeel = ex.feel;
    setMeter(ex.meter);
    /* 曲風也是這組進行自己帶的:丸サ進行是 City Pop、C7-F7 是 Blues,
       這兩件事和弦推不出來(跟 Bossa、跟 Swing 用同一套語彙),所以要跟著點下去換。
       **一定要排在 setMeter 後面**:setFeelPick 是拿「現在的拍號」去檢查這個曲風
       有沒有節奏型,在 3/4 點一組 4/4 的放克,順序反了就會被擋掉、整組不會換 */
    setFeelPick(ex.feel);
    applyForm();
  });
  box.appendChild(b);
}

function refreshSecChrome(){
  updateLenSeg();
  for (const btn of $("repSeg").children) {
    btn.setAttribute("aria-pressed", +btn.dataset.rep === secRepeat ? "true" : "false");
  }
  updateExFade();
  if (typeof updateSecToggleText === "function") updateSecToggleText();
}

/* ══ 語言與主題 ══════════════════════════════════════════════════ */
function applyLanguage(lang){
  currentLang = (lang === "en") ? "en" : "zh";
  try { localStorage.setItem(LANG_KEY, currentLang); } catch (e) {}
  document.documentElement.lang = currentLang === "en" ? "en" : "zh-Hant";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (key) el.textContent = T(key);
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    const key = el.getAttribute("data-i18n-html");
    if (key) el.innerHTML = T(key);
  });
  document.querySelectorAll("[data-i18n-attr]").forEach(el => {
    const spec = el.getAttribute("data-i18n-attr");
    if (!spec) return;
    for (const pair of spec.split(",")) {
      const [attr, key] = pair.split(":").map(s => s.trim());
      if (attr && key) el.setAttribute(attr, T(key));
    }
  });
  document.title = T("pageTitle");

  const lt = $("langToggle");
  lt.textContent = currentLang === "en" ? "中" : "EN";
  const next = currentLang === "en" ? T("langToggleToZh") : T("langToggleToEn");
  lt.setAttribute("aria-label", next);
  lt.setAttribute("title", next);
  lt.setAttribute("aria-pressed", currentLang === "en" ? "true" : "false");

  refreshDynamicText();
}

/* 執行期才組出來的文字(小節數、移調數值、走帶列、存檔列)不在 data-i18n 的
   掃描範圍內,切語言時要另外重畫一次 */
function refreshDynamicText(){
  updateBarCount();
  updateBarTools();
  if (typeof updateSecToggleText === "function") updateSecToggleText();
  if (typeof updateMeterDim === "function") updateMeterDim();
  if (typeof updateFeelSeg === "function") updateFeelSeg();
  setTranspose(transposeOn);
  setPlayIcon(playing);
  renderSaved();
  renderPalette();
  renderExamples();
  if (!playing) updateTransportIdle();
  const bad = parsed.bars.find(b => !b.ok);
  if (bad) $("parseErrorText").textContent = T("errUnknownChord", { tok: bad.text });
  else if (parsed.overflow) $("parseErrorText").textContent = T("errTooMany", { n: MAX_BARS });
}

$("langToggle").addEventListener("click", () => applyLanguage(currentLang === "zh" ? "en" : "zh"));

/* sm_theme 一樣是所有工具共用的 key,值只有 "light" / "dark"。
   共用的是「使用者的選擇」,不是「還沒選之前的預設」。 */
function applyTheme(light){
  document.body.classList.toggle("light", light);
  $("themeToggle").setAttribute("aria-pressed", light ? "true" : "false");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", light ? "#FBF7EE" : "#0C0A07");
  try { localStorage.setItem(THEME_KEY, light ? "light" : "dark"); } catch (e) {}
}
$("themeToggle").setAttribute("aria-pressed", document.body.classList.contains("light") ? "true" : "false");
$("themeToggle").addEventListener("click", () => applyTheme(!document.body.classList.contains("light")));

/* ══ 綁定 ══════════════════════════════════════════════════════ */
chordInput.addEventListener("input", () => { formParts = []; clearFormMeter(); reparse(); });

playBtn.addEventListener("click", togglePlay);

$("bpmInput").addEventListener("input", (e) => {
  const v = parseInt(e.target.value, 10);
  if (!isNaN(v)) setBpm(v, true);
});
$("bpmInput").addEventListener("blur", () => setBpm(bpmOn));
$("bpmDown").addEventListener("click", () => setBpm(bpmOn - 1));
$("bpmUp").addEventListener("click", () => setBpm(bpmOn + 1));
for (const b of $("feelSeg").children) {
  b.addEventListener("click", () => setFeelPick(b.dataset.feel));
}
// 「自動」是開關不是曲風:按下去就交還給和弦去判
$("feelAutoBtn").addEventListener("click", () => setFeelPick("auto"));
for (const b of $("meterSeg").children) {
  // 自己動手換 = 我知道我在做什麼,那個「本來是幾拍」的提示就收起來
  b.addEventListener("click", () => { formMeter = null; setMeter(b.dataset.meter); });
}

$("transpose").addEventListener("input", (e) => setTranspose(parseInt(e.target.value, 10)));
$("trDown").addEventListener("click", () => setTranspose(transposeOn - 1));
$("trUp").addEventListener("click", () => setTranspose(transposeOn + 1));

for (const b of $("styleSeg").children) {
  b.addEventListener("click", () => setStyle(b.dataset.style));
}

$("countInToggle").addEventListener("click", () => {
  countInOn = !countInOn;
  setToggle($("countInToggle"), countInOn);
  saveState();
});
$("reharmToggle").addEventListener("click", () => {
  reharmOn = !reharmOn;
  setToggle($("reharmToggle"), reharmOn);
  /* 關掉就回到原譜那一份,不要停在剛剛換過的和弦上 */
  resetLap();
  renderBars();
  if (playing) voicings = buildVoicings(parsed.bars);
  saveState();
});
$("loopToggle").addEventListener("click", () => {
  loopOn = !loopOn;
  setToggle($("loopToggle"), loopOn);
  // 播放中切掉循環:把結束拍補上,讓它彈完這一輪就停
  if (playing) { const n = voicings.length * beatsInBar();
    endBeat = loopOn ? Infinity : countInBeats + Math.ceil((currentBeat() - countInBeats) / n) * n; }
  saveState();
});

$("lenSel").addEventListener("change", (e) => {
  const n = +e.target.value;
  if (n > 0) setBarCount(n);
});
for (const btn of $("repSeg").children) {
  btn.addEventListener("click", () => { secRepeat = +btn.dataset.rep; renderExamples(); });
}
$("formClear").addEventListener("click", () => {
  pushUndo();
  formParts = [];
  clearFormMeter();
  chordInput.value = "";
  selectedBar = -1;
  reparse();
});

/* 小節工具列 */
$("barDup").addEventListener("click", dupBar);
$("barDel").addEventListener("click", palDelete);

$("barUndo").addEventListener("click", undoEdit);

/* 這一小節的編輯條:＋ 切一半、× 併回前一顆。
   拖把手(改「在哪裡換和弦」)是 `renderBarEdit` 自己掛的 */
$("beAdd").addEventListener("click", () => {
  const p = posOf(targetBar()), bar = p && parsed.bars[p.bar];
  if (bar) beApply(beSplitPlan(spansOf(bar), chordIndexAt(p)));
});
$("beDel").addEventListener("click", () => {
  const p = posOf(targetBar()), bar = p && parsed.bars[p.bar];
  if (bar) beApply(beMergePlan(spansOf(bar), chordIndexAt(p)));
});

/* 段落庫的開關。收起來是預設:清單佔掉左邊將近一半的版面,
   但多數時候使用者只是要看自己那一段 */
let secOpen = false;
/* 螢幕夠大(兩欄而且夠高)段落庫就直接排在卡片下面,不用開關;
   小螢幕維持浮動面板 */
const secInlineMQ = window.matchMedia("(min-width:720px) and (min-height:900px)");
function secInline(){ return secInlineMQ.matches; }
function placeSecPanel(){
  const panel = $("exPanel"), inline = $("exInline");
  const wrap = document.querySelector(".ex-wrap");
  if (!panel || !inline || !wrap) return;
  const on = secInline();
  document.body.classList.toggle("sec-inline", on);
  const host = on ? inline : wrap;
  if (panel.parentElement !== host) host.appendChild(panel);
  if (on) {
    panel.hidden = false;
    $("examples").style.maxHeight = "";   // 高度交給 flex,不要用量出來的 px 鎖死
  } else {
    panel.hidden = !secOpen;
    if (secOpen) fitSecPanel();
  }
  updateExFade();
  if (typeof updateSecToggleText === "function") updateSecToggleText();
}
function setSecOpen(open){
  if (secInline()) return;   // 內嵌時一直開著
  secOpen = !!open;
  const panel = $("exPanel"), btn = $("secToggle");
  if (open) panel.removeAttribute("hidden"); else panel.setAttribute("hidden", "");
  if (open) fitSecPanel();
  btn.setAttribute("aria-expanded", open ? "true" : "false");
  updateSecToggleText();
  updateExFade();
  try { localStorage.setItem(SEC_KEY, open ? "1" : "0"); } catch (e) {}
}
/* 面板是浮的,但它如果比視窗剩下的高度還長,整頁還是會被撐出捲軸。
   打開時量一次「從清單上緣到視窗底」還有多少,直接鎖住清單的高度 */
function fitSecPanel(){
  const box = $("examples");
  if (!box || secInline() || !secOpen) return;
  box.style.maxHeight = "";
  const top = box.getBoundingClientRect().top;
  const room = Math.floor(window.innerHeight - top - 18);
  box.style.maxHeight = Math.max(120, Math.min(430, room)) + "px";
  updateExFade();
}

function updateSecToggleText(){
  /* 數的是**現在這個曲風**有幾組,不是全部 54 組:
     寫 54 會以為每個曲風都有 54 種進行(被問過),實際上 Pop 20、Funk 5 */
  const n = SECTIONS.filter(e => e.feel === feelNow).length;
  $("secToggleText").textContent = T("secToggle", { n });
  const label = secOpen ? T("secToggleOpen") : T("secToggle", { n });
  $("secToggle").setAttribute("title", label);
  $("secToggle").setAttribute("aria-label", label);
}
$("secToggle").addEventListener("click", () => setSecOpen(!secOpen));
/* 面板是浮的,點到外面或按 Esc 就收起來。點面板裡面(挑段落)不關,
   才接得出 A A B B */
document.addEventListener("pointerdown", (e) => {
  if (!secOpen) return;
  // 整個 .ex-wrap(開關那一排 + 面板)都算「裡面」:
  // 按「清空」想重新接一次形式時,面板不該跟著關掉
  const wrap = document.querySelector(".ex-wrap");
  if (wrap && wrap.contains(e.target)) return;
  setSecOpen(false);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && secOpen) setSecOpen(false);
});


$("linkBtn").addEventListener("click", async () => {
  const url = shareURL();
  const btn = $("linkBtn");
  try {
    await navigator.clipboard.writeText(url);
  } catch (e) {
    // 舊瀏覽器或沒給權限:退回選取一個暫時的輸入框再 execCommand
    const ta = document.createElement("textarea");
    ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    document.body.removeChild(ta);
  }
  const old = btn.textContent;
  btn.textContent = T("linkCopied");
  setTimeout(() => { btn.textContent = old; }, 1500);
});

$("saveBtn").addEventListener("click", () => {
  const text = chordInput.value.trim();
  if (!text) return;
  const name = window.prompt(T("savedNamePrompt"), text.slice(0, 28));
  if (!name) return;
  const arr = getSaved();
  arr.unshift({ name: name.slice(0, 40), text, bpm: bpmOn, transpose: transposeOn,
                style: styleOn, meter: meterOn });
  putSaved(arr.slice(0, 20));   // 留最近 20 組就夠了,再多這排膠囊會爆版
  renderSaved();
});

/* 空白鍵播放/停止。焦點在輸入框或按鈕上的時候不要搶——
   使用者正在打和弦,空白鍵必須是空白鍵 */
/* ← → 換到上一格/下一格,數字鍵 1–9 直接跳到那一格。
   焦點在輸入框裡時完全不攔 */
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = chordTokens().length;          // ← → 走的是「一顆一顆」,一格兩顆就走兩下
  if (!n) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    /* **Shift + 左右是改長度**,不是換選取。一格一顆的時候 `nudgeLen` 自己會回頭,
       所以不必在這裡判斷 */
    if (e.shiftKey) { nudgeLen(e.key === "ArrowRight" ? 1 : -1); return; }
    const cur = targetBar();
    selectBar(Math.max(0, Math.min(n - 1, cur + (e.key === "ArrowRight" ? 1 : -1))));
    return;
  }
  /* 數字鍵跳的是「第幾格」(那是使用者數得出來的東西),跳到那一格的第一顆 */
  if (/^[1-9]$/.test(e.key)) {
    const bar = +e.key - 1;
    if (bar >= parsed.bars.length) return;
    let flat = 0;
    for (let i = 0; i < bar; i++) flat += parsed.bars[i].chords.length;
    e.preventDefault();
    selectBar(flat);
  }
});

/* ⌘Z / Ctrl+Z 復原。焦點在文字框時不攔,那裡有瀏覽器自己的復原 */
document.addEventListener("keydown", (e) => {
  if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== "z") return;
  const t = e.target;
  if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT")) return;
  if (!undoStack.length) return;
  e.preventDefault();
  undoEdit();
});

document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" && e.key !== " ") return;
  const t = e.target;
  if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.tagName === "BUTTON")) return;
  e.preventDefault();
  togglePlay();
});

/* ══ 啟動 ══════════════════════════════════════════════════════ */
(function init(){
  const st = loadState();
  if (st) {
    if (typeof st.text === "string") chordInput.value = st.text;
    if (st.style && STYLE_KEYS.indexOf(st.style) >= 0) styleOn = st.style;
    if (st.meter && METERS[st.meter]) meterOn = st.meter;
    if (st.feel && (st.feel === "auto" || FEELS[st.feel])) feelPick = st.feel;
    if (typeof st.countIn === "boolean") countInOn = st.countIn;
    if (typeof st.loop === "boolean") loopOn = st.loop;
    if (typeof st.reharm === "boolean") reharmOn = st.reharm;
    if (typeof st.bpm === "number") bpmOn = st.bpm;
    if (typeof st.transpose === "number") transposeOn = st.transpose;
  }
  applyURLParams();   // 網址帶題目就以網址為準
  setStyle(styleOn);
  setMeter(meterOn, true);
  setToggle($("countInToggle"), countInOn);
  setToggle($("loopToggle"), loopOn);
  setToggle($("reharmToggle"), reharmOn);
  setBpm(bpmOn);
  setTranspose(transposeOn);
  renderExamples();
  renderSaved();
  parsed = parseProgression(chordInput.value);
  updateFeel();
  renderBars();
  let secWant = false;
  try { secWant = localStorage.getItem(SEC_KEY) === "1"; } catch (e) {}
  setSecOpen(secWant);
  placeSecPanel();          // 螢幕夠大就直接把段落庫排在卡片下面
  applyLanguage(currentLang);
  setPlayIcon(false);
  updateTransportIdle();
  selectBar(parsed.bars.length ? 0 : -1);
  updateBarTools();
  // 清單捲動或視窗高度改變時,上下的漸層要跟著換(高度是 vh 算的,轉向也會變)
  $("examples").addEventListener("scroll", updateExFade, { passive: true });
  window.addEventListener("resize", () => {
  placeSecPanel(); fitSecPanel(); updateExFade();
  /* 編輯條的方塊是 %,但「名字縮到多小、縮不下去就不寫」是照 px 算的。
     小節格同理:欄寬一變,放不放得下名字就跟著變 */
  renderBars();
});
  secInlineMQ.addEventListener("change", placeSecPanel);
})();
</script>
