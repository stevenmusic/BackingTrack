/* 這一格可以換成什麼。回傳一串候選,挑哪一個交給亂數 */
function subCandidates(bars, i, key, pcs, canSplit, noMood){
  const bar = bars[i];
  if (!bar || !bar.ok || bar.chord.slash) return [];   // 本來就有轉位就不要再動
  const c = bar.chord;
  const next = bars[(i + 1) % bars.length], prev = bars[(i - 1 + bars.length) % bars.length];
  const x = {
    key, d: ((c.rootPc - key) % 12 + 12) % 12, q: qualOf(c), rootPc: c.rootPc,
    suffix: c.suffix, text: c.text.slice(0, c.text.length - c.suffix.length),
    full: c.text,        // 整串(含性質)。轉位要用它,只拿根音會把 Dm7 變成 D/F
    next: next && next.ok ? next : null,
    nextRootPc: next && next.ok ? next.chord.rootPc : -1,
    nextBassPc: next && next.ok ? next.chord.bassPc : -1,
    nd: next && next.ok ? ((next.chord.rootPc - key) % 12 + 12) % 12 : -1,
    nq: next && next.ok ? qualOf(next.chord) : "",
    nextSame: !!(next && next.ok && next.chord.text === c.text) && bars.length > 1,
    prevRootPc: prev && prev.ok && bars.length > 1 ? prev.chord.rootPc : -1,
    isLast: i === bars.length - 1 && bars.length > 1,
    // 「這一對」後面那一格的根音。ii-V 要靠它判斷那顆屬七是不是真的往下五度解決
    afterRootPc: (() => {
      const a = bars[(i + 2) % bars.length];
      return a && a.ok ? a.chord.rootPc : -1;
    })(),
    prevSame: !!(prev && prev.ok && prev.chord.text === c.text) && bars.length > 1,
    // 這首有沒有真的出現過主和弦(I)。小調的進行常常從頭到尾沒有 I
    hasTonic: bars.some(bb => bb.ok && bb.chord.rootPc === key &&
                              (qualOf(bb.chord) === "maj" || qualOf(bb.chord) === "dom")),
  };
  /* ── 兩種「這一顆不要動它的根音」 ──────────────────────────
     1. **調外的和弦是作者故意寫的**:丸サ進行的 E7、藍調的 C7 都帶調外音,
        那就是那首歌的招牌。換成別的根音等於把招牌拆掉
     2. **上一格的屬七要解決到這裡**:`E7 - Am7` 的 Am7 換成 Cmaj7 的話,
        前面那顆 E7 就解決不到任何地方,聽起來會懸在半空
     兩種都只擋「換根音」的規則,加色彩音與轉位照舊。
     爵士系(Bossa / Swing)不套這條——爵士本來就是邊彈邊重配,
     ii-V 之後把 I 換成 iii 或 vi 是它的日常 */
  const scale = new Set(MAJOR_SCALE.map(n => (n + key) % 12));
  const chromatic = c.intervals.some(iv => !scale.has((c.rootPc + iv) % 12)) ||
                    !scale.has(c.rootPc);
  /* 「上一格要解決到這裡」有三種寫法,三種都不可以動這一格的根音:
       1. 屬七往下五度(`G7 → Cmaj7`)
       2. 屬七往下半音——三全音代理(`D♭7 → Cmaj7`)
       3. **減七往上半音——導音和弦**(`C♯dim7 → Dm7`)
     原本只認第一種,結果 City Pop 的 `C♯dim7 - Dm7 - G7` 裡 Dm7 套「ii→IV」
     變成 Fmaj7,前面那顆經過減七就解決不到任何地方——那顆和弦存在的唯一理由
     就是半音走上去接到 D */
  const pq = prev && prev.ok ? qualOf(prev.chord) : "";
  const pStep = prev && prev.ok ? ((c.rootPc - prev.chord.rootPc) % 12 + 12) % 12 : -1;
  const resolvesHere = (pq === "dom" && (pStep === 5 || pStep === 11)) ||
                       (pq === "dim" && pStep === 1);
  const keepRootOnly = JAZZ_FEELS.indexOf(feelNow) < 0 && (chromatic || resolvesHere);
  if (x.q === "other" || x.q === "dim") return [];

  /* ── 低音正在走一條級進的線時,不要動這一格的根音 ────────────
     `C - G/B - Am - Am/G - F - C/E - Dm7`(卡農)的 F 換成 Dm7,
     低音 G→F→E 就斷成 G→D→E;安達魯西亞 `Am - G - F - E7` 同理。
     這是 CLAUDE.md 那條「F 換成 Fm 下行線就沒了」的一般化——
     轉位存在的理由就是把低音線接順(`stepToNext`),同一個標準反過來用:
     **那條線比「換一顆和弦」重要**。前後都是級進、而且同一個方向才算 */
  const bassLine = (() => {
    if (!prev || !prev.ok || !next || !next.ok) return false;
    const a = ((c.bassPc - prev.chord.bassPc) % 12 + 12) % 12;
    const b2 = ((next.chord.bassPc - c.bassPc) % 12 + 12) % 12;
    const down = v => v === 10 || v === 11, up = v => v === 1 || v === 2;
    return (down(a) && down(b2)) || (up(a) && up(b2));
  })();

  /* ── 旁邊那格「根音一樣但和弦不一樣」時,那一對是一個手勢,不要動根音 ──
     `Am7 - D7 - Dm7 - G7`(City Pop)的 D7 → Dm7 是刻意在同一個根音上換顏色,
     把 Dm7 換成 Fmaj7 等於把那一下抹掉;`F - Fm - C` 的借用 iv、
     `Am7 - A7 - Dm7` 的副屬化都一樣,那兩格合起來才是一件事。

     **一模一樣的重複不算**(`text` 相同):`C - C - F - G` 的第二格換成 Am7、
     Blue Bossa 撐兩小節的 `Dm7 - Dm7` 換掉前一格,那正是代理和弦該做的事
     (CLAUDE.md 的 `C - C - C7` → `C - Cmaj7 - C7` 就是這一條)。
     踩過:一開始寫成「根音一樣就擋」,結果連重複的主和弦都不能換了 */
  const pairedRoot = [prev, next].some(nb => nb && nb.ok &&
                       nb.chord.rootPc === c.rootPc && nb.chord.text !== c.text);

  /* ── 換完之後不可以跟左右鄰居變成同一顆 ──────────────────────
     被回報過「有些替代和弦聽起來很怪」,追下去大半是這個:
     `Fmaj7 - Fm7 - Em7 - A7` 的 Fmaj7 套「借用 iv」變成 `Fm - Fm7`、
     `… Fmaj7 - Dm7 - G7` 的 Dm7 套「ii→IV」變成 `Fmaj7 - Fmaj7 - G7`——
     兩個都是**把一次和弦變化抹掉**,聽起來就是少了一格。
     比的是「根音 + 性質」不是字面:`Fm` 跟 `Fm7` 是同一顆和弦的兩種寫法。

     **只擋換根音的規則**。加色彩音、轉位、副屬化(`keepsRoot`)本來就不動根音,
     它們旁邊那顆一樣是原本就在那裡的——`C - C - C7` 換成 `C - Cmaj7 - C7`
     是很好聽的線性進行,不該被這條擋掉。
     經過和弦(`passing`)更不受限:它要求前一格是同一顆,換的就是重複的那一格 */
  const sameAs = (tok, nb) => {
    if (!nb || !nb.ok) return false;
    const t = parseChord(normalizeSymbol(tok));
    return !!t && t.rootPc === nb.chord.rootPc && qualOf(t) === qualOf(nb.chord);
  };
  const clashesNeighbour = (tok) => sameAs(tok, prev) || sameAs(tok, next);

  const out = [];
  const jazz = JAZZ_FEELS.indexOf(feelNow) >= 0;
  for (const r of SUB_RULES) {
    if (r.feels.indexOf(feelNow) < 0) continue;
    if (r.mood && (x.isLast || noMood)) continue;
    if (r.mood === "tonic" && !jazz) continue;
    /* 經過和弦(pass° / ♯IV°)不受上面那條保護的限制:它們要求前一格是同一顆,
       和弦本身已經講過一次了,換的是「重複的那一格」,沒有拆掉任何招牌 */
    if (keepRootOnly && !r.keepsRoot && !r.passing) continue;
    if (r.split && !canSplit) continue;
    if (!r.ok(x)) continue;
    if (r.split) {
      const t = r.to(x);
      if (t && t.split(" ").every(p => parseChord(normalizeSymbol(p)))) out.push(t);
      continue;
    }
    if (r.ext) {
      for (const q of EXT_TABLE[x.suffix]) {
        const t = x.text + q;
        if (extFits(t, pcs)) out.push(t);
      }
      continue;
    }
    for (const t of [r.to(x), r.also && r.also(x)]) {
      if (!t || t === c.text) continue;
      const tc = parseChord(normalizeSymbol(t));
      if (!tc) continue;
      if (!r.keepsRoot && !r.passing && clashesNeighbour(t)) continue;
      /* 上面那兩道門只管**根音真的換掉**的候選:低音線與「同一個根音的一對」
         都是根音的事,`IV→iv`(F → Fm)與加色彩音、轉位、副屬化不動根音,
         那條線與那個手勢原封不動 */
      if (tc.rootPc !== c.rootPc && !r.passing && !r.onPair &&
          (bassLine || pairedRoot)) continue;
      out.push(t);
    }
  }
  return [...new Set(out)];
}

let reharmOn = true;     // 繞第二圈開始換一兩顆和弦
let lapBuilt = -1;       // voicings 是照第幾圈建的
let lapBars = null;      // 這一圈實際在彈的和弦(沒換過就是 null)
/* 現在畫面上與排程要看的那一份和弦。沒有在換的時候就是使用者打的那一份 */
function barsNow(){ return lapBars || parsed.bars; }
function resetLap(){ lapBuilt = -1; lapBars = null; }

/* 這一圈要把哪幾格換掉。第一圈(lap 0)一定照原譜——先聽過原本長怎樣,
   後面才知道變的是什麼。一圈換一到兩格,多了就不像同一首了。
   第 1 格盡量不動(四格以上時):那一顆是整段的門面,一換就認不出來 */
function subBarsFor(lap, n){
  if (!reharmOn || lap <= 0 || n < 2) return {};
  const first = n >= 4 ? 1 : 0;
  const span = n - first;
  const howMany = hash01(lap, 41) < 0.4 ? 2 : 1;
  const out = {};
  for (let k = 0; k < howMany; k++) {
    const i = first + Math.floor(hash01(lap * 7 + k, 42) * span) % span;
    out[i] = hash01(lap * 13 + k, 43);
  }
  return out;
}

/* 這一圈實際要彈的和弦。lap 0 就是原譜,之後才開始換 */
function barsForLap(lap){
  const src = parsed.bars;
  /* 代理和弦換的是**一顆和弦**,不是一小節——一小節兩顆的時候只換其中一顆。
     所以先攤平,選號、前後文、換完之後再照原本的小節結構組回去 */
  const flat = flatChords(src);
  const subs = subBarsFor(lap, flat.length);
  if (!Object.keys(subs).length) return src;
  const key = keyOf(src), pcs = progPcs(src);
  const out = flat.map(c => ({ ok: c.ok, text: c.text, chord: c.chord }));
  let didSplit = false, didMood = false;
  for (const k of Object.keys(subs)) {
    const i = +k;
    /* 一顆拆兩顆只給「這一格只有它、沒寫時值」的:一格兩顆以上再拆就擠了,
       寫了 `/` `.` 的是使用者自己排好的時值,拆了會把它吃掉 */
    const home = src[flat[i].bar];
    const canSplit = home.chords.length === 1 && !(home.chords[0].w && home.chords[0].w !== chordDiv());
    const cand = subCandidates(out, i, key, pcs, canSplit && !didSplit, didMood);
    if (!cand.length) continue;
    const tok = cand[Math.min(cand.length - 1, Math.floor(subs[k] * cand.length))];
    const parts = tok.split(" ");
    const cs = parts.map(p => parseChord(normalizeSymbol(p)));
    if (cs.some(c => !c)) continue;
    if (parts.length > 1) didSplit = true;     // 一圈最多拆一顆:律動上一圈只多一次換和弦
    // 一圈最多換一次情緒(大三/大七 ↔ 小三/小七,見 SUB_RULES 上面那段)
    if (parts.length === 1 && flat[i].chord && (qualOf(cs[0]) === "min") !== (qualOf(flat[i].chord) === "min")) didMood = true;
    /* 拆出來的那一串掛在 `parts` 上;`chord` 留**後面那一顆**(就是原本那顆屬七),
       下一格換和弦時看到的前後文才跟原譜一樣 */
    out[i] = { ok: true, chord: cs[cs.length - 1], text: parts[parts.length - 1],
               parts: parts.length > 1 ? parts.map((p, j) => ({ ok: true, chord: cs[j], text: p,
                                                                 added: j < parts.length - 1 })) : null };
  }
  // 組回小節:結構照原本的,只有和弦換掉(拆開的那一格變成兩顆)
  let n = 0;
  return src.map(b => {
    const chords = [].concat(...b.chords.map(() => { const o = out[n++]; return o.parts || [o]; }));
    return { ok: chords.every(c => c.ok), chords, text: chords.map(c => c.text).join(" "),
             chord: chords[0].chord };
  });
}

/* 換圈:重建這一圈的和弦與聲位,順便把小節格重畫成真的在響的那幾顆。
   在「圈的第一小節第一拍」做,排程提前 0.2 秒,所以聽起來就是新的一圈換了彈法。
   播放中重畫小節格沒關係:下一幀 paintPlayhead 會把正在響的那一格重新點亮 */
function buildLap(lap){
  lapBuilt = lap;
  const bars = barsForLap(lap);
  lapBars = (bars === parsed.bars) ? null : bars;
  voicings = buildVoicings(bars);
  if (typeof renderBars === "function") renderBars();
}

/* 每一格回傳一串 span(和弦 + 佔哪幾格 + 聲位)。
   聲部連接是**跨小節線**接下去的:一小節裡第二顆和弦要接第一顆,
   下一小節的第一顆要接上一小節的最後一顆 */
function buildVoicings(bars){
  const out = [];
  let prev = null;
  for (const b of bars) {
    const spans = spansOf(b);
    for (const sp of spans) {
      if (!sp.ok || !sp.chord) { sp.v = null; continue; }
      sp.v = buildVoicing(sp.chord, prev);
      prev = sp.v.upper;
    }
    out.push(spans);
  }
  return out;
}

/* 排程時問「這一格的這一個 slot 是哪一顆和弦」 */
function spanAt(spans, slot){
  if (!spans || !spans.length) return null;
  for (const sp of spans) if (slot >= sp.from && slot < sp.to) return sp;
  return spans[spans.length - 1];
}

/* ══ 取樣鋼琴 ══════════════════════════════════════════════════
   跟 ScrollScore 指向同一組 Salamander(Tone.js 官方託管的完整版)。
   這組每個八度只錄 C / D# / F# / A 四個音,其餘音用 playbackRate 變調補位,
   最遠只差 1.5 個半音,聽不出失真。音域 A0–C8,鋼琴全音域都蓋得到,
   所以低音區不需要另外處理。 */
/* 同一組 Salamander 檔案的三條路:tonejs.github.io 是 ScrollScore 指的那條,
   後面兩條是同一份檔案在 Tonejs/audio repo 裡的 CDN 與 raw 位置。
   任何一條被擋掉(公司網路、地區封鎖)都還有得救 */
const SRC_PIANO = [
  "https://tonejs.github.io/audio/salamander/",
  "https://cdn.jsdelivr.net/gh/Tonejs/audio@master/salamander/",
  "https://raw.githubusercontent.com/Tonejs/audio/master/salamander/",
];
const SAMPLE_TABLE = (() => {
  const list = [{ letter: "A", oct: 0, pc: 9 }];
  for (let oct = 1; oct <= 7; oct++) {
    list.push({ letter: "C", oct, pc: 0 });
    list.push({ letter: "Ds", oct, pc: 3 });
    list.push({ letter: "Fs", oct, pc: 6 });
    list.push({ letter: "A", oct, pc: 9 });
  }
  list.push({ letter: "C", oct: 8, pc: 0 });
  return list.map(s => ({
    midi: (s.oct + 1) * 12 + s.pc,
    file: s.letter + s.oct + ".mp3",
  }));
})();

/* ══ 電鋼琴(Rhodes)══════════════════════════════════════════
   Funk 的鍵盤本來就不是平台鋼琴,是 Rhodes 電鋼琴(City Pop 原本也用它,照相似度換回平台鋼琴了,見 FEELS.citypop):
   山下達郎、Stevie Wonder、K-Pop 的 R&B 段落都是這個聲音。
   換的是**音色**,不是聲位或節奏——`buildVoicing` 與 `schedulePiano` 完全不動。

   jlearman.jRhodes3c:1977 Rhodes Mark I Stage 73,跟鋼琴、鼓、貝斯同樣在
   sfzinstruments 這個 org 底下。**取 mono 那一組**(單聲道 75–175KB,
   立體聲同一顆是兩倍大),立體聲寬度由 `playNote` 自己的 panner 給。

   檔名是 `As_<midi>__<音名>_<力度層>-mono.flac`,力度層那個數字**每往上一個
   取樣點就 +2**(F1 是 279、B1 是 281、E2 是 283…),但**不是每一層都錄滿整個鍵盤**
   (原作者說高音的音色差別不大)。所以這裡是兩層拼起來的:
   F1–E5 走 279 那層(mf,有 Rhodes 的 bark),A5 以上那四顆只剩 453 那層。
   兩層都是同一個峰值(量過都在 0.64–0.75),所以接縫只差亮度、不差音量,
   而且那四顆在最上面一個八度,伴奏聲位幾乎踩不到。
   **不要照公式去推 279+2n 的高音**——A5 的 301 根本不存在,會整顆 404 */
const SRC_RHODES = [
  "https://cdn.jsdelivr.net/gh/sfzinstruments/jlearman.jRhodes3c@master/jRhodes3c-looped-flac-sfz/",
  "https://raw.githubusercontent.com/sfzinstruments/jlearman.jRhodes3c/master/jRhodes3c-looped-flac-sfz/",
];
const RHODES_TABLE = [
  [29, "As_029__F1_279"], [35, "As_035__B1_281"], [40, "As_040__E2_283"],
  [45, "As_045__A2_285"], [50, "As_050__D3_287"], [55, "As_055__G3_289"],
  [59, "As_059__B3_291"], [62, "As_062__D4_293"], [65, "As_065__F4_295"],
  [71, "As_071__B4_297"], [76, "As_076__E5_299"],
  [81, "As_081__A5_453"], [86, "As_086__D6_455"], [91, "As_091__G6_457"],
  [96, "As_096__C7_459"],
].map(e => ({ midi: e[0], file: e[1] + "-mono.flac" }));

/* 哪一種曲風用哪一台琴。寫在 `FEELS[x].piano`,跟貝斯的 `kit` 同一個做法——
   不要在排程裡針對某一種曲風寫 if */
const PIANO_KITS = {
  acoustic: { src: SRC_PIANO,  table: SAMPLE_TABLE, gain: 1,    tau: 1   },
  /* **K-Pop 的和聲樂器是合成 pluck,不是電鋼琴**。查過現在的 K-Pop 製作:
     和聲那一層是「疊起來的 synth stab / pluck」加 supersaw,Rhodes 是九〇年代 R&B 的聲音,
     放在 808 與十六分 hi-hat 上面會整個年代錯亂(被回報「聽起來不像 K-Pop」)。
     兩顆失諧的鋸齒過一顆會關起來的低通,就是那個「叮」——沒有檔案要下載 */
  /* **音量要壓得比想像中低**。被回報過「K-Pop 的 lead synth 聽起來太突出」:
     pluck 的音頭很亮、又掛著殘響,在一堆 808 與十六分 hi-hat 之間很容易跳出來。
     它是**和聲層不是主旋律**——真的 K-Pop 裡這一層是墊在人聲底下的 */
  /* `lowCut` 與 `lead` 是**寫在音色裡的兩條**,不是排程裡的 if:
     - `lowCut`:這個音色不進低音區(K-Pop 的 pluck 不碰 midi 55 以下)
     - `lead`:它不是鍵盤而是 lead,一下最多幾顆音
     兩條都是「哪一台琴在彈」的性質,跟 `gain` / `tau` 同一層 */
  /* gain 從 0.42 收到 0.38:濾波器的落點改對之後它本來就亮了一階,
     同一個 gain 會變得太突出(以前被回報過「lead synth 太突出」) */
  pluck:    { synth: "pluck", gain: 0.38, tau: 1, lowCut: 55, lead: 2 },
  /* Rhodes 的音管衰減比平台鋼琴慢,tau 放長一點才像在延音。
     gain **要往下收**:同一個 peak 參數下這組取樣比 Salamander 大一倍
     (量過:四個音的和弦 Salamander 1.17、Rhodes 2.37),
     照原樣接進去 City Pop 整段會衝到 0.92。0.62 是把兩台拉到同一個刻度的值,
     動它就要重量一次整組響度 */
  rhodes:   { src: SRC_RHODES, table: RHODES_TABLE, gain: 0.62, tau: 1.5 },
};
function pianoKit(){
  if (typeof FEELS === "undefined" || typeof feelNow === "undefined") return "acoustic";
  return (FEELS[feelNow] || FEELS.straight).piano || "acoustic";
}
const pianoBanks  = { acoustic: new Map(), rhodes: new Map() };   // midi -> AudioBuffer
const pianoFailed = { acoustic: new Set(), rhodes: new Set() };
/* 舊名字留著:狀態列與整份程式都拿它當「平台鋼琴那一組」 */
const loadedSamples = pianoBanks.acoustic;
const failedSamples = pianoFailed.acoustic;
let sampleLoadPromise = null;

function nearestIn(list, midi){
  let best = list[0], bestDist = Infinity;
  for (const s of list) {
    const d = Math.abs((s.midi !== undefined ? s.midi : s) - midi);
    if (d < bestDist) { bestDist = d; best = s; }
  }
  return best;
}

/* 這次的進行(含移調)真的會用到哪些取樣。只抓這些,不整組載完——
   整組 29 個檔案在 iPad 上第一次開會等很久,而四小節的進行通常只需要五六個 */
function neededSampleMidis(midis, table){
  const need = new Set();
  for (const m of midis) need.add(nearestIn(table || SAMPLE_TABLE, m).midi);
  return [...need];
}

/* 載一台琴這次真的會用到的那幾顆音。回傳的 promise 等的是「這台琴」,
   不是整組取樣 */
function loadPianoKit(kit, midis){
  const K = PIANO_KITS[kit], bank = pianoBanks[kit], bad = pianoFailed[kit];
  const want = neededSampleMidis(midis, K.table).filter(m => !bank.has(m) && !bad.has(m));
  if (!want.length) return Promise.resolve();
  return Promise.all(want.map(midi => {
    const entry = K.table.find(s => s.midi === midi);
    return fetchDecode(K.src, entry.file)
      .then(buf => { bank.set(midi, buf); })
      .catch(() => { bad.add(midi); });   // 單一取樣缺了不影響其他音
  }));
}

function ensureSamples(midis){
  const kit = pianoKit();
  if (PIANO_KITS[kit] && PIANO_KITS[kit].synth) return Promise.resolve();   // 合成的,沒有檔案
  /* Rhodes 是 FLAC,舊的 iOS Safari 可能整組吃不下。整組都掛的時候
     **退回平台鋼琴**(mp3,一定載得到)而不是掉進三角波的保底音色——
     電鋼琴換成鋼琴只是音色不對,換成合成音會整首不能聽 */
  sampleLoadPromise = loadPianoKit(kit, midis).then(() => {
    if (kit !== "acoustic" && !pianoBanks[kit].size) return loadPianoKit("acoustic", midis);
  });
  return sampleLoadPromise;
}

/* ══ 音訊 ══════════════════════════════════════════════════════ */
let ctx = null, masterGain = null, limiter = null, outGain = null, softClip = null;
let reverbBus = null, drumBus = null, bassBus = null;
/* 伴奏團的其他成員:吉他、鍵盤鋪底(風琴/弦樂)、打擊小物 */
let combBus = null, padBus = null, percBus = null, drumGlue = null, roomBus = null;
/* 吉他與鋪底那兩條 bus 上的真混音處理(高通 / EQ / 壓縮),見 `applyMix` */
let combHp = null, combEq = null, combComp = null, combMakeup = null;
let padHp = null, padEq = null;
let masterHp = null, masterGlue = null, masterSat = null;
/* 每一條 bus 自己的 EQ / 壓縮 / 空氣 / chorus。預設全部透明(0dB、不壓、wet 0),
   數值寫在 `FEELS[x].mix`,跟 combHp 那一組同一個做法 */
let keysBus = null, keysEq = null, keysAir = null, keysChorus = null;
/* 超低頻與「拳頭」的那幾顆(`mix.bassHp` / `drumHp` / `drumLow` / `keysPres`),預設全部透明 */
let bassHpN = null, drumHpN = null, drumLowN = null, keysPresN = null;
let bassEqN = null, bassCompN = null, bassMk = null, bassDry = null, bassWet = null, drumAir = null, drumMidN = null, drumRevSend = null;
let combAir = null, combChorus = null, masterMid = null, masterAirN = null, revTone = null, drumWidth = null, padLp = null;
let echoBus = null, echoL = null, echoR = null;
/* 延遲時間跟著速度走:八分與附點八分(那是最常見的一組乒乓)。
   **速度一改就要重算**,不然換速度之後延遲會跟節奏錯開 */
function updateEcho(){
  if (!echoL || !echoR || !spb) return;
  const t = ctx.currentTime;
  echoL.delayTime.setTargetAtTime(Math.min(1.9, spb * 0.5), t, 0.05);
  echoR.delayTime.setTargetAtTime(Math.min(1.9, spb * 0.75), t, 0.05);
}
const BASS_BUS_LEVEL = 0.95;
/* 上一顆 808 低音彈到哪個音、什麼時候彈的。滑音要靠它 */
const last808 = { midi: -1, at: -99 };
const PAD_BUS_LEVEL = 0.58;
/* 空間麥克風的量。這是「鼓聽起來多大一間」的旋鈕,
   開太大鼓會糊掉、拍點就抓不到了(這個工具是拿來跟著彈的) */
const ROOM_BUS_LEVEL = 0.42;
let slowLfo = null;

/* 殘響用程式合成的脈衝響應,不外掛音檔,維持單檔架構。
   Salamander 是近距離收音、幾乎全乾的,沒有這層空間感會很「貼在臉上」。
   左右聲道各自獨立亂數 → 殘響才有真正的立體聲寬度;高頻隨時間衰減得比低頻快。 */
/* 固定種子的 mulberry32。殘響的尾巴、撥弦的激發、hi-hat 的雜訊全部走它:
   `Math.random()` 的話每次重新整理殘響就是另一條尾巴,量到的尖峰跟著飄 */
function mulberry32(seed){
  let a = seed | 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function buildImpulseResponse(seconds, decayPow){
  const rate = ctx.sampleRate;
  const len = Math.max(1, Math.floor(rate * seconds));
  const ir = ctx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    /* **左右兩聲道要是不相關的兩份雜訊**(種子不一樣),那是殘響「有寬度」的來源;
       同一份給兩邊的話整片殘響會塌回正中間,聽起來是「加了效果」不是「在一個空間裡」 */
    const rnd = mulberry32(ch ? 0x5bf03635 : 0x9e3779b9);
    let lp = 0;
    for (let i = 0; i < len; i++) {
      const t = i / len;
      const env = Math.pow(1 - t, decayPow);
      const noise = (rnd() * 2 - 1) * env;
      const a = 0.42 * (1 - t * 0.8) + 0.02;
      lp += a * (noise - lp);
      d[i] = lp;
    }
    const early = [0.011, 0.019, 0.031, 0.044, 0.058];
    for (let k = 0; k < early.length; k++) {
      const idx = Math.floor(rate * (early[k] + (ch ? 0.0031 : 0)));
      if (idx < len) d[idx] += (0.5 - k * 0.07) * (ch ? -1 : 1) * 0.6;
    }
  }
  return ir;
}

/* ══ 真正「看前面」的限幅器(AudioWorklet)═══════════════════════════
   盲聽裡「破音 / 爆音」被寫了六次(City Pop 最多)。量出來兩個原因,而且是同一件事:
   1. **飽和那一段其實在硬削波**:曲線裡 `if (x > 1) x = 1`,而 masterGain 先推了 1.9 倍,
      進飽和的尖峰量到 1.1–1.4(City Pop 0.38% 的取樣被削平),`oversample:"none"` 又會折疊出雜音
   2. **瀏覽器內建的限幅器不是磚牆**:它是一顆有自動補償增益的壓縮器,
      起音 1ms 攔不住鼓的音頭——所以原本的設計其實是**靠飽和的硬削波在削尖峰**,
      而且限幅器一直壓 6–7dB(中位數),整首被壓扁,那也是「鼓沒有 punch」的來源
   把輸入降下來就不削波了,但尖峰就穿過去撞最後那一關軟削波(量到 1–2.5% 的取樣)。
   **所以要的是一顆真的限幅器**:看前面 5ms,尖峰還沒到就把增益平滑地收下來,
   數學上保證輸出不超過天花板,而且不產生任何削波失真。
   演算法(每一個取樣):需要的增益 r = min(1, 天花板/|x|) → 往回 N+1 個取樣取最小值
   → 長度 N 的平均(攻擊的斜坡)→ 慢慢放開(release);聲音本身延遲 N 個取樣。
   保證:輸出第 n 個取樣時,平均窗裡每一個值都已經看過那個尖峰,所以平均 ≤ 它需要的增益。
   舊的瀏覽器沒有 AudioWorklet 就維持原本那條鏈(`fetch` 不到、`addModule` 失敗都一樣) */
const LIMITER_SRC = `
class LookaheadLimiter extends AudioWorkletProcessor {
  constructor(o){
    super();
    const p = (o && o.processorOptions) || {};
    this.N = Math.max(8, Math.round((p.lookahead || 0.005) * sampleRate));
    this.ceil = p.ceiling || 0.7;
    this.rel = Math.exp(-1 / ((p.release || 0.08) * sampleRate));
    this.r = new Float32Array(this.N + 1).fill(1); this.ri = 0;
    this.box = new Float32Array(this.N).fill(1); this.bi = 0; this.bsum = this.N;
    this.dl = [new Float32Array(this.N), new Float32Array(this.N)]; this.di = 0;
    this.g = 1; this.minG = 1; this.cnt = 0;
  }
  process(inputs, outputs){
    const inp = inputs[0], out = outputs[0];
    if (!out || !out.length) return true;
    const L = inp && inp[0], R = inp && (inp[1] || inp[0]);
    const n = out[0].length, N = this.N;
    for (let i = 0; i < n; i++) {

      const a = Math.max(Math.abs(xl), Math.abs(xr));

      this.ri = (this.ri + 1) % (N + 1);

      for (let k = 0; k <= N; k++) if (rr[k] < m) m = rr[k];

      this.g = gb < this.g ? gb : gb - (gb - this.g) * this.rel;

      this.dl[0][this.di] = xl; this.dl[1][this.di] = xr; this.di = (this.di + 1) % N;
      out[0][i] = ol * this.g;
      if (out[1]) out[1][i] = or * this.g;
      if (this.g < this.minG) this.minG = this.g;
    }
    if ((this.cnt += n) >= sampleRate / 2) {
      this.bsum = 0; for (let k = 0; k < N; k++) this.bsum += this.box[k];   // 浮點累加誤差歸零
      this.port.postMessage(this.minG); this.minG = 1; this.cnt = 0;

  }
}

let trueLimiter = null, limRed = [];
function installTrueLimiter(){
  if (!ctx.audioWorklet || !window.Blob || !window.URL) return;
  const url = URL.createObjectURL(new Blob([LIMITER_SRC], { type: "application/javascript" }));
  ctx.audioWorklet.addModule(url).then(() => {
    const node = new AudioWorkletNode(ctx, "lookahead-limiter", {
      numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2],
      processorOptions: { lookahead: 0.005, ceiling: TL_CEIL, release: 0.08 } });
    node.port.onmessage = e => { limRed.push(e.data); if (limRed.length > 240) limRed.shift(); };
    /* 換成新的鏈:飽和 → outGain → 看前面的限幅器 → 軟削波(現在只是保險,碰不到)。
       **masterGain 1.9 → 0.75**:進飽和的尖峰落在 0.8 以下,不再硬削波;
       舊的 DynamicsCompressor 不在路上了,響度改由 outGain 決定 */
    masterSat.disconnect(); limiter.disconnect(); outGain.disconnect();
    masterSat.connect(outGain); outGain.connect(node); node.connect(softClip);
    masterGain.gain.value = TL_IN; outGain.gain.value = TL_OUT; masterBase = TL_IN; applyMix();
    /* 有了真的限幅器,最後那一關軟削波**永遠碰不到**(輸出被保證在 TL_CEIL 以下),
       所以它的起彎點從 0.72 挪到 0.9:舊的鏈要它在 0.72 就開始彎,是因為那時候
       尖峰真的會穿過去;現在天花板可以回到響度規則的 0.85,整首大聲 1.7dB 又不失真 */
    softClip.curve = softCurve(0.9, 0.98);
    trueLimiter = node;
  }).catch(() => {}).finally(() => URL.revokeObjectURL(url));
}
const TL_IN = 0.75, TL_OUT = 2.35, TL_CEIL = 0.85;
/* 進母帶鏈之前的基準增益(看是哪一條鏈),每個曲風再乘 `mix.master`(沒寫就是 1)。
   **編制變密的曲風要自己往回收**:City Pop 第六輪加了四踩的大鼓、撐滿的貝斯、十六分 hi-hat 之後
   RMS 從 −12.5 衝到 −10.2(限幅器只壓 0.45dB,所以不是被壓扁,是真的變密了) */
let masterBase = null;
function softCurve(t, top){
  const n = 4096, c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1, a = Math.abs(x);
    const y = a <= t ? a : t + (top - t) * Math.tanh((a - t) / (top - t));
    c[i] = x < 0 ? -y : y;
  }
  return c;
}

function ensureAudio(){
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;

       所以不是「留很多餘裕」而是「推進限幅器再補回來」:
       masterGain 先把訊號推大 → 限幅器壓住尖峰(擋住和弦疊起來的破音)
       → outGain 把整體拉回接近滿刻度。三段一起調,動其中一個要重新量電平。 */

    masterGain.gain.value = 1.9; masterBase = 1.9;
    limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -10;
    limiter.knee.value = 0;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.001;

       但這是**拿來跟著彈**的伴奏,壓到那麼平會沒有呼吸。
       收回 1.3dB 之後落在 −11～−12.5,波峰因數 9–11dB(商業流行是 8–11、爵士 12–14) */

    softClip = ctx.createWaveShaper();
    softClip.curve = (() => {
      const n = 4096, c = new Float32Array(n), t = 0.72, top = 0.96;

    /* ══ 母帶鏈 ═══════════════════════════════════════════════════
       原本只有「限幅 → 補音量 → 天花板」三段。真的母帶處理在限幅**之前**
       還有三件事,而且順序是固定的:

       1. **超低頻高通(24Hz)**。20Hz 以下人聽不到,但它照樣佔動態範圍、
          照樣推限幅器——808 的正弦尾巴與大鼓的音頭都有一堆。切掉之後

          讓七八層各自獨立的樂器聽起來像**一次演奏**。
          起音一定要慢(30ms)——快了會把鼓的音頭吃掉,整首就軟了
       3. **飽和**。真的母帶都會過一點膠帶或電子管:偶次諧波讓中低頻聽起來更密,
          而且它把最尖的那幾個點先磨圓,限幅器就不必那麼用力。
          用三次多項式(`x - x³/3`,在小訊號時完全是線性的),量很輕(drive 1.25)

       這三段**動了就要整組重量響度**,跟原本那四段是同一條規則 */

       **不要用 tanh**:那條曲線在中間就開始彎,會把整首的動態壓掉 */

    bassDry = ctx.createGain(); bassWet = ctx.createGain(); bassWet.gain.value = 0;
    /* 貝斯的超低頻高通(`mix.bassHp`,預設 20Hz = 透明)。City Pop 分軌量到貝斯在 31Hz
       比參考曲多 12.6dB:唱片裡的電貝斯在 40Hz 以下本來就是收掉的(那是吃掉音量空間的「嗡」) */
    bassHpN = ctx.createBiquadFilter(); bassHpN.type = "highpass"; bassHpN.frequency.value = 20; bassHpN.Q.value = 0.7;
    bassBus.connect(bassHpN); bassHpN.connect(bassEqN);
    bassEqN.connect(bassDry); bassDry.connect(bassMk);
    bassEqN.connect(bassCompN); bassCompN.connect(bassWet); bassWet.connect(bassMk);
    bassMk.connect(masterGain);

    /* 節奏組以外的三條:吉他、鍵盤鋪底(風琴/弦樂)、打擊小物。
       各自一條的理由跟鼓、貝斯一樣——殘響量不一樣:
       吉他要一點空間感、鋪底要濕(它本來就是「遠」的那一層)、
       打擊小物幾乎全乾(沙鈴一有殘響就變成噴氣聲) */
    /* ── 這兩條 bus 上要有真的混音處理 ────────────────────────────
       原本整份檔案**一個 EQ 節點都沒有**(沒有 peaking、沒有 shelf),
       所有的濾波都在樂器自己裡面。那是「聽起來不夠專業」的另一半:
       真的混音在把一層放進去之前,會先叫它讓出別人的位置——
       吉他與鋪底的低頻要切掉(那一段是貝斯與大鼓的),
       節奏吉他要壓(壓縮本來就是 funk / AOR 切音的一部分,不是修 bug)。

       數值寫在 `FEELS[x].mix` 裡,**沒寫就是透明**
       (高通 20Hz、EQ 0dB、壓縮器門檻 0dB 等於不壓)——其餘六個曲風零差異。
       殘響送點移到**處理之後**:真的混音是 post-EQ 送的,
       不然送進殘響的還是沒切過的那一份低頻 */
    combBus = ctx.createGain();
    combBus.gain.value = 0.62;
    combHp = ctx.createBiquadFilter();
    combHp.type = "highpass"; combHp.frequency.value = 20; combHp.Q.value = 0.7;
    combEq = ctx.createBiquadFilter();
    combEq.type = "peaking"; combEq.frequency.value = 3200;
    combEq.Q.value = 0.9; combEq.gain.value = 0;
    combComp = ctx.createDynamicsCompressor();
    combComp.threshold.value = 0; combComp.knee.value = 6; combComp.ratio.value = 3;
    combComp.attack.value = 0.004; combComp.release.value = 0.12;
    /* `DynamicsCompressor` 沒有補償增益,壓完一定變小聲,所以自己補一顆 */
    combMakeup = ctx.createGain(); combMakeup.gain.value = 1;
    combBus.connect(combHp); combHp.connect(combEq); combEq.connect(combComp);
    combAir = shelf(ctx, "highshelf", 6500);
    combChorus = makeChorus(ctx);
    combComp.connect(combMakeup); combMakeup.connect(combAir);
    combAir.connect(combChorus.input); combChorus.output.connect(masterGain);
    const cSend = ctx.createGain();
    cSend.gain.value = 0.22;
    combMakeup.connect(cSend); cSend.connect(reverbBus);

    padBus = ctx.createGain();
    padBus.gain.value = PAD_BUS_LEVEL;
    padHp = ctx.createBiquadFilter();
    padHp.type = "highpass"; padHp.frequency.value = 20; padHp.Q.value = 0.7;
    padEq = ctx.createBiquadFilter();
    padEq.type = "peaking"; padEq.frequency.value = 380;
    padEq.Q.value = 1.1; padEq.gain.value = 0;
    /* 鋪底的低通(`FEELS[x].mix.padLp`,預設 20k = 透明)。盲聽第一批「鋪底 / 合成器」被勾 8/12 段,
       評語是「太尖銳、太突出、要溫暖一點」——這顆是拿來做 A/B 的 */
    padLp = ctx.createBiquadFilter();
    padLp.type = "lowpass"; padLp.frequency.value = 20000; padLp.Q.value = 0.5;
    padBus.connect(padHp); padHp.connect(padEq); padEq.connect(padLp); padLp.connect(masterGain);
    const pSend = ctx.createGain();
    pSend.gain.value = 0.42;
    padLp.connect(pSend); pSend.connect(reverbBus);
    /* 鍵盤(鋼琴 / Rhodes)原本每一顆音直接接 masterGain,**沒有 bus 就沒辦法混**。
       挖 280Hz(整首最擠的那一段)、補一點高頻(Rhodes 的鐘聲)、再過 chorus */
    keysBus = ctx.createGain();
    keysEq = ctx.createBiquadFilter();
    keysEq.type = "peaking"; keysEq.Q.value = 1; keysEq.gain.value = 0;
    keysAir = shelf(ctx, "highshelf", 5000);
    keysChorus = makeChorus(ctx);
    /* 鍵盤的 presence(`mix.keysPres`,預設 0dB)。Rhodes 在混音裡 500Hz 多 2.7dB、2kHz 少 4.9dB:
       太厚又太悶,那是它輸給平台鋼琴的原因——不是音色本身(單獨比 Rhodes 還略勝) */
    keysPresN = ctx.createBiquadFilter(); keysPresN.type = "peaking"; keysPresN.frequency.value = 2000; keysPresN.Q.value = 0.7; keysPresN.gain.value = 0;
    keysBus.connect(keysEq); keysEq.connect(keysPresN); keysPresN.connect(keysAir); keysAir.connect(keysChorus.input);
    keysChorus.output.connect(masterGain);
    applyMix();

    /* 鼓的空間麥克風。走自己的 bus 再進黏著壓縮,所以它跟近麥一起被壓——
       真的錄音就是這樣混的(房間麥被壓得越多,鼓聽起來越大越有空氣) */
    roomBus = ctx.createGain();
    roomBus.gain.value = ROOM_BUS_LEVEL;
    roomBus.connect(drumGlue);

    percBus = ctx.createGain();
    percBus.gain.value = 0.66;
    percBus.connect(masterGain);
    const rSend = ctx.createGain();
    rSend.gain.value = 0.07;
    percBus.connect(rSend); rSend.connect(reverbBus);

    /* Leslie / 合唱效果的共用 LFO。**只做一顆**,接到每一顆音的 gain 上——
       每個音自己開一顆 LFO 的話,一個和弦就多四顆振盪器,而且它們的相位
       各走各的,聽起來是四台風琴不是一台。
       深度在 `playKeysChord` 裡再乘上那顆和弦的音量(見那裡的註解) */
    slowLfo = ctx.createOscillator();
    slowLfo.frequency.value = 0.82;      // chorale(慢速)的轉速
    slowLfo.start();
  }
  // iOS/Safari 一定要在使用者手勢之後 resume,不然看起來在播、實際一點聲音都沒有。
  // 從背景切回來被系統暫停的情況也一起救回來
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

const activeSources = new Set();

/* 鋼琴的自然衰減:高音掉得快、低音撐得久(ScrollScore 校過的曲線) */
function decayTau(midi){
  const t = Math.max(0, Math.min(1, (midi - 21) / 87));
  return 1.0 + (1 - t) * 3.2;
}

function playNote(midi, when, dur, peak){
  dur *= artic("keys", when, 311);
  when += humanTime("keys", when, 301);
  const kitNow = pianoKit();
  const KS0 = PIANO_KITS[kitNow];
  if (KS0 && KS0.synth) {
    /* **這個音色不進低音區**(`lowCut`)。K-Pop 的 pluck 量到最低彈到 midi 36
       (65Hz)——那是鋼琴左手也走同一顆合成音色的結果。
       但那一段已經有 808 sub 與 `klow` 鋪底在撐,第三層低頻只會互相打架,
       而且 65Hz 的鋸齒過低通只是一聲悶響,根本不是「叮」 */
    if (KS0.lowCut && midi < KS0.lowCut) return;
    synthKeyNote(midi, when, dur, peak * KS0.gain); return;
  }
  if (!pianoBanks[kitNow]) return;
  /* 這首用哪一台琴。那一台整組沒載到就借平台鋼琴的取樣(見 ensureSamples),
     兩台都空的時候才掉到保底的三角波 */
  const kit = kitNow;
  const bank = pianoBanks[kit].size ? pianoBanks[kit] : pianoBanks.acoustic;
  const K = PIANO_KITS[pianoBanks[kit].size ? kit : "acoustic"];
  const usable = [...bank.keys()];
  peak *= K.gain;
  const g = ctx.createGain();
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  // 低音偏左一點點、高音偏右一點點,跟真的坐在鋼琴前面一樣,和弦才不會擠成一個點
  /* 低音在左、高音在右,那是真的鋼琴(低音弦在彈的人左手邊)。
     **但支點不是 C4**:左手的根音在 midi 36–48、右手的聲位在 55–72,
     以 60 當中心的話整台琴的能量全部落在左邊——量過整個 Bossa 的混音
     偏左 1.74dB,那是聽得出來的。支點壓到 54(伴奏真正的重心)才居中 */
  /* **低頻一律往中間收**。這是混音與母帶的通則(不只為了單聲道相容,
     刻黑膠時偏一邊的低頻會直接把針推出溝):50 以下把偏移收到三成五。
     鋼琴左手是撐兩拍的長音、又是整台琴最有能量的一層,
     不收的話整個 Bossa 偏左 1.5dB——量出來的,不是猜的 */
  if (pan) {
    const tilt = (midi - 54) / 110 * (midi < 50 ? 0.35 : 1);
    pan.pan.value = Math.max(-0.32, Math.min(0.32, tilt));
  }
  const out = pan || g;
  if (pan) g.connect(pan);
  out.connect(keysBus || masterGain);
  const send = ctx.createGain();
  send.gain.value = 0.3;
  out.connect(send); send.connect(reverbBus);

  /* ── 力度要改變**亮度**,不只改變音量 ────────────────────────
     鋼琴打輕的時候高次泛音少很多(琴槌壓縮得少、弦的高階模態激發得少),
     所以同一顆音輕彈是「暗」的不是「小聲」的。
     取樣只有一層力度,只調音量的話整段 comping 每一下都一樣亮——
     那是「像 MIDI」最主要的來源。

     真的多力度層太貴:Salamander 一顆音一層就 1.5–2.5MB,
     四層 × 七顆音是 50MB 下載、解碼後兩百多 MB 記憶體,手機會直接掛。
     一顆低通把高頻按力度收掉,拿到的是同一件事的九成 */
  const velRef = 0.42;                       // 大約是「用力彈」的 peak
  const vel = Math.max(0.12, Math.min(1, peak / velRef));
  let tone = null;
  /* 0.88 以上整顆濾波器是空跑的(截止已經在 14kHz 以上,取樣本身就沒有那麼多高頻),
     而最大聲的那幾下正是同時發聲最多的時候——省下的就是那時候的節點 */
  if (vel < 0.88) {
    tone = ctx.createBiquadFilter();
    tone.type = "lowpass";
    tone.frequency.value = 700 + 16000 * Math.pow(vel, 1.45);
    tone.Q.value = 0.35;
  }

  let src;
  if (usable.length) {
    const bestMidi = nearestIn(usable.map(m => ({ midi: m })), midi).midi;
    const buf = bank.get(bestMidi);
    src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = Math.pow(2, (midi - bestMidi) / 12);
    // 取樣本身可能比需要的延音短,尾段循環撐住(換算回取樣的原始時間軸)
    const needed = (dur + 0.6) * src.playbackRate.value;
    if (buf.duration < needed && buf.duration > 0.3) {
      src.loop = true;
      const loopLen = Math.min(0.6, buf.duration * 0.3);
      src.loopStart = Math.max(0, buf.duration - loopLen);
      src.loopEnd = buf.duration;
    }
  } else {
    // 取樣全掛掉時的保底音色:三倍音疊一疊,至少還彈得出東西來
    src = ctx.createOscillator();
    src.type = "triangle";
    src.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  }
  if (tone) { src.connect(tone); tone.connect(g); } else { src.connect(g); }

  /* 包絡:敲下去之後一路自然衰減(鋼琴不會自己撐在滿音量),
     音符結束時再補一段較快的釋放。用固定時間常數,短音長音每秒衰減比例一致 */
  const tau = decayTau(midi) * K.tau;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(peak, when + 0.004);
  g.gain.setTargetAtTime(0.0001, when + 0.004, tau);
  const relStart = when + Math.max(dur, 0.05);
  g.gain.setTargetAtTime(0.0001, relStart, 0.12);

  const stopAt = relStart + 0.7;
  src.start(when, leadOf(src.buffer));
  src.stop(stopAt);
  activeSources.add(src);
  src.onended = () => { activeSources.delete(src);
    try { src.disconnect(); if (tone) tone.disconnect(); g.disconnect(); } catch (e) {} };
}

/* count-in 的節拍聲:合成的短音,不佔取樣頻寬。第一拍高一點,分得出小節頭 */
function playClick(when, strong){
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = "square";
  osc.frequency.value = strong ? 1600 : 1100;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(strong ? 0.18 : 0.11, when + 0.002);
  g.gain.setTargetAtTime(0.0001, when + 0.004, 0.02);
  osc.connect(g); g.connect(masterGain);
  osc.start(when);
  osc.stop(when + 0.1);
  activeSources.add(osc);
  osc.onended = () => { activeSources.delete(osc); try { osc.disconnect(); g.disconnect(); } catch (e) {} };
}

/* ══ 鼓與貝斯 ══════════════════════════════════════════════════
   音源都在 sfzinstruments 底下,跟鋼琴的 Salamander 同一個 org:
   - 鼓:Virtuosity Drums(Versilian Studios × Karoryfer,KVRDC'21 參賽作),
     取中距離麥克風那一組,24bit/48k FLAC。大鼓與 hi-hat 各收幾個 round-robin,
     同一個音連打才不會像機關槍
   - 貝斯:Black And Blue Basses 的 darkblack 指彈電貝斯(Karoryfer,KVRDC'23),
     mf 力度。每三個半音收一顆,中間用 playbackRate 補,最遠差 1.5 個半音
   先走 jsDelivr(有 CDN 快取),失敗再退 raw.githubusercontent —— 兩邊同一份檔案。
   FLAC 走 decodeAudioData 的支援度不如 mp3,所以每個鼓件都留一份合成備援。 */
/* **網址停在 `Samples/` 就好**,麥克風位置(`mid/` 或 `room/`)由呼叫端接上去。
   原本寫到 `Samples/mid/`,加空間麥克風之後路徑會變成 `Samples/mid/mid/...`,
   整組鼓靜悄悄地一個都載不到——而且 `loadDrumLayer` 的 catch 是空的,
   完全不會報錯,只會退到合成鼓。踩過一次 */
const SRC_DRUMS = [
  "https://cdn.jsdelivr.net/gh/sfzinstruments/virtuosity_drums@master/Samples/",
  "https://raw.githubusercontent.com/sfzinstruments/virtuosity_drums/master/Samples/",
];
/* 貝斯有兩把,照感覺換:爵士與 bossa 用低音提琴(撥弦),流行搖滾用電貝斯。
   兩把都是 D. Smolken 錄的(Karoryfer),音色調性一致。
   低音提琴那把是 1958 Otto Rubner、五度定弦(CGDA),檔名用的是科學音名
   (pizz_g1 = MIDI 31,sfz 裡的 pitch_keycenter 就是這個數字),
   跟電貝斯那把「midi = 八度 × 12 + 音級」的寫法不一樣,不要混用 */
const SRC_BASS = [
  "https://cdn.jsdelivr.net/gh/sfzinstruments/karoryfer.black-and-blue-basses@main/Samples/darkblack/reg/",
  "https://raw.githubusercontent.com/sfzinstruments/karoryfer.black-and-blue-basses/main/Samples/darkblack/reg/",
];
const SRC_UPRIGHT = [
  "https://cdn.jsdelivr.net/gh/sfzinstruments/dsmolken.double-bass@master/pizz/",
  "https://raw.githubusercontent.com/sfzinstruments/dsmolken.double-bass/master/pizz/",
];

/* 依序試每個來源,第一個成功的就用;全部失敗才丟出去給呼叫端決定怎麼退 */
/* ── 載入進度 ──────────────────────────────────────────────────
   取樣越加越多,第一次按播放要等好幾秒,而畫面上只有一行「載入音色中…」
   ——不知道還要多久就會以為壞掉了。

   **每一份檔案都走 `fetchDecode`**,所以計數放在這裡就全部蓋得到,
   不必去每個 ensure* 裡面加。

   **分母會長大**:吉他取樣是一顆一顆排隊抓的(`decodeAudioData` 在主執行緒上做,
   十幾顆一起解會跟排程器搶),所以「總共幾份」是邊抓邊變的。
   直接算 done/total 的話百分比會往回跳,看起來像壞掉,
   所以顯示的數字**只准往上**(`shown`)。寧可走得慢一點也不要倒退 */
const loadStat = { total: 0, done: 0, shown: 0 };
function resetLoadProgress(){
  loadStat.total = 0; loadStat.done = 0; loadStat.shown = 0;
  const w = document.getElementById("loadWrap");
  if (w) { w.removeAttribute("hidden"); }
  renderLoadProgress();
}
function endLoadProgress(){
  const w = document.getElementById("loadWrap");
  if (w) w.setAttribute("hidden", "");
}
function renderLoadProgress(){
  const fill = document.getElementById("loadFill"), pct = document.getElementById("loadPct");
  if (!fill || !pct) return;
  const raw = loadStat.total ? Math.round(loadStat.done / loadStat.total * 100) : 0;
  loadStat.shown = Math.max(loadStat.shown, raw);
  fill.style.width = loadStat.shown + "%";
  pct.textContent = loadStat.shown + "%";
}
function fetchDecode(bases, path){
  loadStat.total++;
  renderLoadProgress();
  let i = 0;
  const attempt = () => fetch(bases[i] + path)
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
    .then(a => ctx.decodeAudioData(a))
    .catch(err => { i++; if (i < bases.length) return attempt(); throw err; });
  // 成功與失敗都算「做完了」:失敗的那一份不會再有人等它
  const done = () => { loadStat.done++; renderLoadProgress(); };
  return attempt().then(b => { done(); return b; }, e => { done(); throw e; });
}

/* ── 鼓:真的力度層,不是把音量調小 ────────────────────────────
   Virtuosity Drums 每一顆鼓都錄了好幾層力度(小鼓 32 層、大鼓與 hi-hat 4 層、
   框邊與 tom 16 層、ride 與 crash 3 層),每層還有 4 個 round robin。
   原本只取一層、靠 gain 調大小聲——那是**最像 MIDI 的地方**:
   真的鼓打輕不只是小聲,音色整個不一樣(泛音少、殼的共振少、越輕越悶)。
   改成照力度挑那一層,音色就跟著力度變。

   `vl` 越大越用力。下面每一顆挑 3–4 層平均鋪在那顆鼓的力度範圍上,
   `lo`/`hi` 是這一層負責的力度區間(0–1)。
   **`rr` 是那一層有幾個 round robin**,同一層連打不會是同一份取樣。 */
const DRUM_LAYERS = {
  kick:   { dir: "kick",  name: "kick_snon",         rr: 4, vl: [1, 2, 3, 4] },
  snare:  { dir: "snare", name: "snare_center",      rr: 0, vl: [5, 12, 19, 25, 30] },
  hihat:  { dir: "hh",    name: "hh_closed",         rr: 4, vl: [1, 2, 3, 4] },
  xstick: { dir: "snare", name: "snare_crossstick",  rr: 0, vl: [3, 7, 11, 15] },
  /* **ride 與 crash 一個檔案就 1MB**(長的鈸,FLAC 也壓不下來)。
     全部力度層 × 全部 round robin × 兩支麥克風 = 26MB,而且 `ensureDrums` 會**等**
     ride(換成合成音就不是爵士了)——按下播放要等十幾秒,搖擺根本播不起來(踩過)。
     所以它們標 `heavy`:第一批只抓一個 round robin,其餘背景補 */
  ride:   { dir: "ride",  name: "ride_ride",         rr: 4, vl: [1, 2, 3], heavy: true },
  hhped:  { dir: "hh",    name: "hh_pedal",          rr: 4, vl: [1, 2, 3] },
  htom:   { dir: "htom",  name: "htom_center",       rr: 0, vl: [6, 11, 15] },
  ltom:   { dir: "ltom",  name: "ltom_center",       rr: 0, vl: [6, 11, 15] },
  crash:  { dir: "crash", name: "crash_crash",       rr: 4, vl: [1, 2, 3], heavy: true },
  /* open hi-hat(City Pop 的反拍)。一個檔案 1MB、響 8–9 秒,所以跟鈸一樣標 heavy;
     **一定要被下一顆 closed hat 掐掉**(`chokeOhat`),真的 hi-hat 一踩下去就停了 */
  ohat:   { dir: "hh",    name: "hh_open",           rr: 4, vl: [1, 2, 3], heavy: true },

/* 這一顆鼓的取樣到了沒(808 自己處理,一律算到了) */
function drumReady(piece){
  if (drumKit() === "e808") return true;
  return !!(drumBuffers[piece] && drumBuffers[piece].some(x => x.mid && x.mid.length));
}
/* 一顆鼓的一層要抓哪幾個檔案。`mic` 是 "mid"(近) 或 "room"(空間)。
   有 round robin 的檔名帶 `_rrN`,沒有的(小鼓、框邊、tom)就靠力度層本身變化 */
function drumLayerFiles(piece, vl, mic, maxRR){
  const L = DRUM_LAYERS[piece];
  if (!L) return [];
  const out = [];
  const n = L.rr ? Math.min(L.rr, maxRR || L.rr) : 0;
  if (n) for (let r = 1; r <= n; r++) out.push(`${L.dir}/${mic}_${L.name}_vl${vl}_rr${r}.flac`);
  else out.push(`${L.dir}/${mic}_${L.name}_vl${vl}.flac`);
  return out;
}
/* 一開始一定要有的三顆。**先抓中間那一層讓它能出聲**,其餘力度層背景補
   (`DRUM_CORE_FIRST` 是第一批)。等四層全載完才開始播,iPad 上會等太久 */
const DRUM_CORE = ["kick", "snare", "hihat"];
/* 過門才用得到的鼓件,一樣背景載;還沒到位時 `synthDrum` 會頂著 */
const DRUM_EXTRA = ["htom", "ltom", "crash"];
const FEEL_PIECES = { straight: [], latin: ["xstick"], swing: ["ride", "hhped"],
                      funk: [], citypop: [], blues: [], kpop: [] };

/* ── 808 電子鼓 ────────────────────────────────────────────────
   TR-808 本來就**是一台合成鼓機**,不是錄音,所以這一組不下載任何檔案:
   大鼓是一顆往下滑的正弦(那條長尾巴就是 808 的招牌)、小鼓是雜訊加一顆中頻、
   拍手是三顆雜訊短點、hi-hat 是六顆方波疊出來的金屬感。
   K-Pop 的骨架就是這個聲音,用爵士鼓組打會完全不像。

   寫成「一整套音色」而不是「取樣載不到時的備援」:`synthDrum` 是備援
   (要盡量像原本那顆鼓),`synth808` 是**指定的音色**,兩件事不要混在一起。 */
function drumKit(){
  if (typeof FEELS === "undefined" || typeof feelNow === "undefined") return "acoustic";
  return (FEELS[feelNow] || FEELS.straight).drums || "acoustic";
}

/* `drumBuffers[piece]` 是一個陣列,每一格是一層力度:`{ vl, mid:[...], room:[...] }`。
   `mid` 是近麥克風、`room` 是空間麥克風(同一次演奏的另一支麥,不是殘響)。
   載到哪一層就有哪一層,沒載到的那幾層 `playDrum` 會自己挑最近的 */
const drumBuffers = {};
const drumRR = {};
for (const k of Object.keys(DRUM_LAYERS)) { drumBuffers[k] = []; drumRR[k] = 0; }
let drumsLoading = null, drumExtraLoading = null;
const feelPieceLoading = {};
const drumLayerLoaded = {};          // "piece:vl:mic" -> true,不要重複抓
/* **鼓載不到要看得見**。原本 catch 是空的,整組鼓一個都沒到也只是默默退到合成音,
   使用者只會覺得「怎麼每個曲風都一樣」——查不到原因。狀態列要講 */
let drumLoadFails = 0;
/* ── 補完整組鼓要等到「已經在播了」才開始 ──────────────────────
   全部力度層 + 空間麥克風加起來十幾 MB。它們是背景載沒錯,但**瀏覽器的連線是共用的**:
   一按播放就開始灌,會把同時在抓的鋼琴與貝斯擠掉,第一次按播放要等很久
   (踩過:有些曲風七秒還沒開始播)。
   所以開一個閘門,`startPlayback` 真的開始之後才放行;沒人按播放就八秒後自己放行 */
let fillGo = null;
function drumFillGate(){
  if (!fillGo) {
    let open;
    fillGo = new Promise(r => { open = r; });
    fillGo.open = open;
    setTimeout(() => open(), 8000);
  }
  return fillGo;
}
function openDrumFill(){ drumFillGate().open(); }
function drumsReady(){
  let n = 0;
  for (const k of DRUM_CORE) if ((drumBuffers[k] || []).some(x => x.mid.length)) n++;
  return n;
}

/* 載一顆鼓的一層。`mic` 分開存,所以空間麥克風可以晚一點到、到了就自動加進來 */
function loadDrumLayer(piece, vl, mic, maxRR){
  const key = piece + ":" + vl + ":" + mic + ":" + (maxRR || "all");
  if (drumLayerLoaded[key]) return Promise.resolve();
  drumLayerLoaded[key] = true;
  const files = drumLayerFiles(piece, vl, mic, maxRR);
  if (!files.length) return Promise.resolve();
  return Promise.all(files.map(path =>
    fetchDecode(SRC_DRUMS, mic + "/" + path)
      .then(b => {
        let slot = drumBuffers[piece].find(x => x.vl === vl);
        if (!slot) { slot = { vl, mid: [], room: [] }; drumBuffers[piece].push(slot);
                     drumBuffers[piece].sort((a, b2) => a.vl - b2.vl); }
        slot[mic].push(b);
      })
      .catch(() => { drumLoadFails++; })));   // 少一個 round robin 不影響其他的,但要記一筆
}

/* 一顆鼓的所有力度層。`first` 只抓中間那一層(讓它馬上能出聲),其餘回傳第二個 promise */
function loadDrumPiece(piece, withRoom){
  const L = DRUM_LAYERS[piece];
  if (!L) return { core: Promise.resolve(), rest: Promise.resolve() };
  const mid = Math.floor(L.vl.length / 2);
  /* **擋住播放的只有「中間那一層的一兩個 round robin」**。
     其餘力度層、其餘 round robin、整組空間麥克風全部背景補——
     還沒到位的時候 `pickDrumLayer` 會自己退到最近的那一層,聽得出來的差別只有
     「前幾秒的力度變化少一點」,不會沒聲音 */
  const firstRR = L.heavy ? 1 : 2;
  const core = loadDrumLayer(piece, L.vl[mid], "mid", firstRR);
  const rest = core.then(() => drumFillGate()).then(() => {
    const jobs = [loadDrumLayer(piece, L.vl[mid], "mid")];   // 補滿這一層的 round robin
    L.vl.forEach((vl, i) => { if (i !== mid) jobs.push(loadDrumLayer(piece, vl, "mid")); });
    /* 空間麥克風**只抓中間那一層**:它是拿來給空氣感的,力度層的差別在近麥已經有了,
       再乘一輪等於把下載量翻倍(ride 一個檔案就 1MB) */
    if (withRoom) jobs.push(loadDrumLayer(piece, L.vl[mid], "room", L.heavy ? 1 : 2));
    return Promise.all(jobs);
  });
  return { core, rest };
}
function loadDrumSet(pieces, withRoom){
  const cores = [], rests = [];
  for (const piece of pieces) {
    const { core, rest } = loadDrumPiece(piece, withRoom);
    cores.push(core); rests.push(rest);
  }
  // 背景補完整力度層與空間麥克風,不擋播放
  Promise.all(rests).catch(() => {});
  return Promise.all(cores);
}

function ensureDrums(){
  /* 808 改成真的取樣了(見 `SRC_D808`)。**還是不要順手把爵士鼓組載下來**
     ——那是 26MB,808 整組不到 400KB */
  if (drumKit() === "e808") return ensure808();
  if (!drumsLoading) {
    drumsLoading = loadDrumSet(DRUM_CORE, true);
    // 過門那幾顆不放進回傳的 promise 裡,播放不必等它
    if (!drumExtraLoading) drumExtraLoading = loadDrumSet(DRUM_EXTRA, true);
  }
  // 這次的感覺要用到的鼓件要等:ride 換成合成音就不是爵士了
  const jobs = [drumsLoading];
  if (smKitOn()) jobs.push(ensureSM());
  for (const piece of (FEEL_PIECES[feelNow] || [])) {
    if (!feelPieceLoading[piece]) feelPieceLoading[piece] = loadDrumSet([piece], true);
    jobs.push(feelPieceLoading[piece]);
  }
  // `FEELS[x].bgPieces`:要用但不擋播放(open hat 一個檔案 1MB,晚一兩小節到沒關係)
  for (const piece of ((FEELS[feelNow] || {}).bgPieces || []))
    if (!feelPieceLoading[piece]) feelPieceLoading[piece] = drumFillGate().then(() => loadDrumSet([piece], true));
  return Promise.all(jobs);
}

/* 電貝斯的檔名是 midi = 八度 × 12 + 音級(e2 = 28 = 四弦貝斯的最低音 E);

   兩把都只收我們用得到的那一段(E1 前後一個八度),不要整組載 */

   同一個音高一直播同一份取樣是「機器在按」最明顯的地方——
   真的貝斯手不可能兩次撥得一模一樣。
   兩把琴都錄了 4 份(電貝斯是 `_rr1..4`、低音提琴是 `_ma..md`),

      [38, "pizz_d2_"],  [41, "pizz_f2_"],

/* 哪一種感覺用哪一把:爵士的走動低音當然是低音提琴,bossa 也是——
   Getz/Gilberto 那個年代的 bossa 就是尼龍弦吉他加低音提琴。
   流行搖滾維持電貝斯 */
/* 哪一把貝斯。寫在 FEELS 裡:爵士與 bossa 的走動低音本來就是低音提琴,
   流行、city pop、放克、藍調是電貝斯 */
function bassKit(){ return (FEELS[feelNow] || FEELS.straight).kit || "electric"; }
const bassBuffers = { electric: new Map(), upright: new Map(), sub808: new Map() };   // midi -> AudioBuffer[]
const bassFailed  = { electric: new Set(), upright: new Set(), sub808: new Set() };
const bassRRLoaded = {};        // "kit:midi:rr" -> true
let bassRR = 0;

function loadBassOne(kit, K, entry, rr){
  const key = kit + ":" + entry[0] + ":" + rr;
  if (bassRRLoaded[key]) return Promise.resolve();
  bassRRLoaded[key] = true;
  return fetchDecode(K.src, entry[1] + rr + ".wav")
    .then(b => {
      const list = bassBuffers[kit].get(entry[0]) || [];
      list.push(b);
      bassBuffers[kit].set(entry[0], list);
    })
    .catch(() => { if (rr === K.rr[0]) bassFailed[kit].add(entry[0]); });

function ensureBass(midis){
  const kit = bassKit(), K = BASS_KITS[kit];
  if (K.synth) return Promise.resolve();   // 808 的低音是算出來的,沒有檔案要載
  const want = new Set();
  for (const m of midis) {
    let best = K.files[0];
    for (const e of K.files) if (Math.abs(e[0] - m) < Math.abs(best[0] - m)) best = e;
    want.add(best);
  }
  const list = [...want].filter(e => !bassFailed[kit].has(e[0]));
  // 第一份擋住播放,其餘的 round robin 等真的開始播了再補(跟鼓同一個閘門)
  const core = Promise.all(list.map(e => loadBassOne(kit, K, e, K.rr[0])));
  core.then(() => drumFillGate()).then(() =>
    Promise.all(list.map(e =>
      Promise.all(K.rr.slice(1).map(rr => loadBassOne(kit, K, e, rr)))))).catch(() => {});
  return core;

/* ══ 實錄取樣的樂器(吉他與弦樂)═══════════════════════════════

   City Pop 的鋪底同理(合成的鋸齒永遠不會是弦樂)。
   這跟「新樂器全部是算出來的」那條牴觸,是**刻意的取捨**:撥弦位置、梳狀濾波、
   迴圈低通全部做對之後,合成的弦還是少了「木頭箱體的共鳴」與「手指摩擦弦的聲音」
   ——那兩件事合成不出來,只能錄。

   **合成的那一版不刪,它退成備援**(跟 `synthDrum` 一模一樣的位置):
   取樣載不到、還沒到位、或這一顆音超出錄音的音域時自己掉回去,
   聽起來音色不對但不會沒聲音。

   全部走 Tone.js instruments 的 mp3(比 FLAC 好解,舊 iOS 也吃得下)。
   檔名的升記號寫成 `s`(`F#2` → `Fs2.mp3`),八度是科學音名(C4 = MIDI 60) */
function smpSrc(dir){
  return ["https://cdn.jsdelivr.net/gh/nbrosowsky/tonejs-instruments@master/samples/" + dir + "/",
          "https://raw.githubusercontent.com/nbrosowsky/tonejs-instruments/master/samples/" + dir + "/"];
}
/* 真的錄了哪幾顆音。**不要照公式去推**——每一種樂器的取樣點完全不一樣
   (鋼弦每個半音、電吉他每三個半音、小提琴只有 14 顆),
   推錯的那幾顆會整顆 404(Rhodes 的 A5 踩過同樣的坑) */
const SMP_KITS = {
  acoustic: { dir: "guitar-acoustic", notes:
    "D2 D#2 E2 F2 F#2 G2 G#2 A2 A#2 B2 C3 C#3 D3 D#3 E3 F3 F#3 G3 G#3 A3 A#3 B3 " +
    "C4 C#4 D4 D#4 E4 F4 F#4 G4 G#4 A4 A#4 B4 C5 C#5 D5" },

     收進來的話 G5 會低兩個八度——整串刷弦會冒出一顆莫名的低音,所以不收 */
  nylon:    { dir: "guitar-nylon", notes:
    "B1 D2 E2 F#2 G#2 A2 B2 C#3 D3 E3 F#3 G3 A3 B3 C#4 D#4 E4 F#4 G#4 A4 B4 " +
    "C#5 D5 E5 F#5 G#5 A5 A#5" },
  electric: { dir: "guitar-electric", notes:
    "C#2 E2 F#2 A2 C3 D#3 F#3 A3 C4 D#4 F#4 A4 C5 D#5 F#5 A5 C6" },
};
/* ── Gretsch Anniversary 的斷奏(Karoryfer「Black And Green Guitars」,CC0)──────

   拿長音剪短當切音,手指悶住弦的那一下根本不在錄音裡。

   每顆四個 round robin,一顆只有 80–140KB。

    /* 每一顆前 150ms 的 RMS dB(rr1 與 rr2 平均,midi 40 起)。**錄音的音量差到 17dB**
       (C4 −21.0、E4 −29.2、A4 −31.2),照原樣彈一個和弦會有一顆突然不見。
       全部拉到 −16.5——那是 Tone.js electric 那組量到的水準,所以 `glevel` 的意思不變 */
    db: [-17.2, -15.8, -15.3, -15.7, -15.7, -18.3, -16.8, -17.5, -17.4, -17.1, -23.7, -18.8, -21.4, -21.3, -23.4, -20.7, -17.2, -18.4, -17.8, -27.6, -21.0, -22.3, -23.0, -22.5, -29.2, -23.2, -24.6, -30.9, -26.9, -31.2, -30.8, -31.4, -30.2, -30.4, -32.3, -29.9, -31.3, -29.4, -26.9, -25.2, -23.3, -23.5, -21.3, -26.7, -21.9, -19.2, -22.8],
    target: -16.5 },

const PC_OF = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteMidi(n){                      // "F#2" → 42、"C4" → 60

const SMP_TABLE = (() => {

for (const smpK of [...Object.keys(SMP_KITS), ...Object.keys(SMP_EXT)]) {

}
function loadSmpOne(kit, midi, file){
