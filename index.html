<style>
/* 配色/字級/圓角/陰影的變數名與數值跟 ScrollScore、LoudMaster、SightScore 完全相同,
   六個工具掛在同一個 origin 底下,並排開著看得出是同一套東西 */
:root{
  --bg:#0C0A07;
  --panel:#161209;
  --panel-2:#201A0F;
  --gold:#C9A24B;
  --gold-bright:#EFD48A;
  --ivory:#F4ECDA;
  --muted:#8A7D5F;
  --muted-bright:#B6A576;
  --line:#2A2415;
  --shadow-sm:0 4px 14px rgba(0,0,0,.35);
  --shadow-md:0 10px 26px rgba(0,0,0,.5);
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-pill:999px;
  --fs-2xs:11px;
  --fs-xs:12px;
  --fs-sm:13px;
  --fs-md:14px;
  --fs-lg:16px;
  --fs-xl:19px;
  --fs-2xl:26px;
  --surface-inset:rgba(22,18,9,.55);
  --surface-inset-hi:rgba(22,18,9,.75);
  --card-tint:rgba(255,255,255,.035);
  --danger:#D9724C;
  --danger-bg:rgba(217,114,76,.1);
  color-scheme:dark;
}

/* ══ 淺色主題 ══════════════════════════════════════════════════
   同一組語意變數換一套值,版面與元件完全不用改寫。數值與其他工具一致。 */
body.light{
  --bg:#FBF7EE;
  --panel:#F4EEE0;
  --panel-2:#EDE6D4;
  --gold:#856418;
  --gold-bright:#6B5115;
  --ivory:#241E12;
  --muted:#6F6450;
  --muted-bright:#544B3B;
  --line:#D8CDB2;
  --shadow-sm:0 4px 14px rgba(90,72,30,.10);
  --shadow-md:0 10px 26px rgba(90,72,30,.14);
  --surface-inset:rgba(255,255,255,.7);
  --surface-inset-hi:rgba(255,255,255,.95);
  --card-tint:rgba(133,100,24,.05);
  --danger:#B5502D;
  --danger-bg:rgba(181,80,45,.08);
  color-scheme:light;
}

/* touch-action:manipulation 只關掉「雙擊放大」這個手勢,雙指縮放完全不受影響 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ivory);
  font-family:"Noto Sans TC",sans-serif;
  display:flex;flex-direction:column;min-height:100vh;
}

/* ── 頂欄 ───────────────────────── */
header{
  display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--panel);
}
.header-left,.header-right{display:flex;align-items:center;flex-wrap:nowrap;gap:8px 10px}
header h1{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(14px, 4vw, var(--fs-lg));
  letter-spacing:clamp(.02em, .5vw, .1em);
  font-weight:700;color:var(--gold);white-space:nowrap;
}
header h1 span{color:var(--ivory);font-weight:600}
/* 回首頁:文字與斷點都跟 ScrollScore / SightScore / LoudMaster 對齊,用同一套安靜文字連結 */
.home-link{
  display:inline-flex;align-items:center;gap:4px;
  color:var(--muted);font-size:var(--fs-md);text-decoration:none;
  padding:8px 4px;border-radius:var(--radius-sm);transition:color .15s;white-space:nowrap;
}
.home-link:hover,.home-link:focus-visible{color:var(--gold-bright)}
/* 中英文字數不同,固定保留較寬那個語言的寬度,切換語言時後面的標題不會位移 */
.home-link .btn-label{display:inline-block;min-width:35px;text-align:center}
/* 600px 是其他工具收掉這行字的同一個斷點,不要自己另訂 */
@media (max-width:600px){.home-link .btn-label{display:none}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1;
  border:1px solid var(--gold);background:transparent;color:var(--gold);
  font-family:inherit;font-size:var(--fs-md);font-weight:500;
  padding:8px 16px;height:38px;border-radius:var(--radius-pill);cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;white-space:nowrap;text-decoration:none;
}
.btn svg{flex:none}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--bg);outline:none}
.btn:active{background:var(--gold);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:not-allowed;background:transparent;color:var(--gold)}
.btn.primary{background:var(--gold);color:var(--bg);font-weight:700}
.btn.primary:hover,.btn.primary:focus-visible{background:var(--gold-bright)}
.btn.ghost{border-color:var(--line);color:var(--muted-bright)}
.btn.ghost:hover,.btn.ghost:focus-visible{background:var(--surface-inset-hi);color:var(--ivory);border-color:var(--line)}
/* aspect-ratio 讓寬度自動跟著當下 .btn 的高度走,永遠是正圓形 */
.btn.icon{aspect-ratio:1;padding:0}
#langToggle{aspect-ratio:1;padding:0;font-weight:700;letter-spacing:.02em}
#themeToggle[aria-pressed="true"]{background:var(--gold);color:var(--bg)}

/* ── 主舞台 ─────────────────────── */
main{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:13px;position:relative;
}
.stage{width:100%;max-width:680px}
/* 夠寬時把卡片拆成兩欄,整頁就不用一直往下捲。
   860px 以下自動疊回一欄,原本的順序不變 */
@media (min-width:680px){
  .stage{max-width:900px}
  .card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px;align-items:stretch}
  .card-foot{grid-column:1 / -1}
  .col > *:first-child{margin-top:0}
  /* 左欄(輸入+編輯)本來就比右欄長,右下角會空一塊。
     讓右欄的區塊把多出來的高度平均分掉,看起來才像是故意的 */
  .col{display:flex;flex-direction:column}
  .col + .col{justify-content:space-between}
}
@media (min-width:900px){
  .stage{max-width:1040px}
  .card{gap:0 26px}
}

.card{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:20px;box-shadow:var(--shadow-sm);
}

/* ── 和弦輸入 ─────────────────────── */
.field-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.field-head .label{font-size:var(--fs-xs);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.field-head .bars{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums;
  text-align:right;line-height:1.5;text-wrap:pretty}
#chordInput{
  width:100%;min-height:46px;resize:vertical;
  background:var(--surface-inset);border:1px solid var(--line);border-radius:var(--radius-md);
  color:var(--ivory);font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);
  letter-spacing:.04em;line-height:1.55;padding:9px 12px;
}
#chordInput:focus{outline:none;border-color:var(--gold);background:var(--surface-inset-hi)}
#chordInput::placeholder{color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:var(--fs-md);letter-spacing:0}
.field-hint{margin-top:4px;font-size:var(--fs-2xs);color:var(--muted);line-height:1.7;text-wrap:pretty}

/* 範例進行:一排安靜的小膠囊,點一下就填進去 */
/* 段落庫的那一排小控制:長度、重複次數、清空 */
.ex-head{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
/* 段落庫的開關。收起來時整塊清單不佔版面,展開才推開 */
.ex-toggle{height:26px;font-size:var(--fs-2xs);padding:0 11px;gap:6px}
.ex-toggle .caret{flex:none;transition:transform .15s}
.ex-toggle[aria-expanded="true"] .caret{transform:rotate(90deg)}
.ex-head #formClear{margin-left:auto}
.ex-segs{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.ex-segs-label{font-size:var(--fs-2xs);color:var(--muted);letter-spacing:.06em}
/* 面板用浮的,不要把下面的東西推開:一推開整頁就爆掉,而且看完就收起來了,
   本來就不該佔位置 */
.ex-wrap{position:relative}
.ex-panel{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;
  padding:9px 10px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-md);
  box-shadow:var(--shadow-md);
}
.ex-panel[hidden]{display:none}
.seg-mini{display:flex;border:1px solid var(--line);border-radius:var(--radius-pill);overflow:hidden}
.seg-mini button{
  border:none;background:transparent;color:var(--muted-bright);
  font-family:inherit;font-size:var(--fs-2xs);padding:4px 9px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s;
}
.seg-mini button + button{border-left:1px solid var(--line)}
.seg-mini button[aria-pressed="true"]{background:var(--gold);color:var(--bg);font-weight:700}
#formClear{height:26px;font-size:var(--fs-2xs);padding:0 11px}
/* 範例用格線不用 flex:進行長短差很多,flex 排出來每顆寬度都不一樣、
   最後一行還會落單。auto-fill 讓每一格等寬,空格子也保留寬度。
   min 取「164px 或半盒寬的大的那個」是為了封住第三欄:600px 視窗下這一塊有 518px 寬,
   164px 會排成三欄,每格只剩 40px,Cmaj7 就得縮到 9.7px 才塞得下 */
.examples{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(max(164px,calc((100% - 4px) / 2)),1fr));
  gap:4px;margin-top:6px;container:exbox / inline-size;
}
/* 八小節(與 12 小節藍調)那組一組佔一整橫排。8 顆和弦塞進半欄會擠成一團、
   字還會被切掉,兩組又貼在一起很容易點錯隔壁那組 */
.ex-btn.long{grid-column:1 / -1}
.ex-group{
  grid-column:1 / -1;margin-top:2px;
  font-size:var(--fs-2xs);color:var(--muted);letter-spacing:.06em;
}
.ex-group:first-child{margin-top:0}
/* 每一顆和弦各佔一個等寬格子、置中——一個和弦本來就是一小節,
   排起來跟下面的小節格對得上,長短不同的進行也不會有的字大有的字被吃掉 */
.ex-btn{
  display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));
  align-items:center;gap:2px;
  min-height:26px;padding:3px 7px;
  border:1px solid var(--line);background:var(--surface-inset);color:var(--muted-bright);
  font-family:"Noto Serif TC",serif;font-size:var(--fs-xs);letter-spacing:.02em;
  border-radius:var(--radius-md);cursor:pointer;
  container:exrow / inline-size;
  transition:background .2s,color .2s,border-color .2s;
}
/* 和弦被切成「Cmaj7 → Cm…」會被看成別的和弦,絕對不能發生。
   格子不夠寬就自己縮字:字級 = 這一顆膠囊的寬度 ÷ 和弦數 ÷ 最長那個和弦的字數,
   再跟 12px 取小的。0.78 是量出來的——Noto Serif 這幾個字元一個字約 0.73 個字高,
   留一點餘裕(12px 的 Bm7b5 要 44px、11px 要 40px)。
   用 container query 不用 media query:同一塊東西在單欄與兩欄的寬度差很多
   (600px 的視窗裡它有 518px 寬,800px 的視窗裡只剩 350px),照視窗寬度判一定判錯 */
.ex-ch{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;
  font-size:min(var(--fs-xs), calc((100cqi - (var(--n,4) - 1) * 2px) / (var(--n,4) * 0.76 * var(--len,5))));
}
/* 手機(600px 以下,已經是單欄)不必為了塞進一個畫面犧牲字級:
   盒子不到 420px 就一組佔一整排,四小節那組也一樣,和弦就回到 12px。
   桌機兩欄時盒子也可能只有 350px,但那裡一改成一排一組就會多出 120px 撐破畫面,
   所以這條要 media 跟 container 兩個條件都成立才生效 */
@media (max-width:600px){
  @container exbox (max-width:419px){
    .examples .ex-btn{grid-column:1 / -1}
  }
  .ex-segs-label{display:none}
  /* 手機是用手指點的,膠囊高一點才不會點到隔壁那組 */
  .ex-btn{min-height:34px}
}
/* 一格剩不到 40px 就排不下 8 顆了,改成四顆一行、兩行一組——
   八小節本來就是兩句四小節,斷在這裡最自然。換行後一行只剩 4 顆,字級跟著重算 */
@container exbox (max-width:340px){
  .ex-btn.long{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:1px}
  .ex-btn.long .ex-ch{
    font-size:min(var(--fs-xs), calc((100cqi - 6px) / (4 * 0.76 * var(--len,5))));
  }
}
.ex-btn:hover,.ex-btn:focus-visible{background:var(--gold);border-color:var(--gold);color:var(--bg);outline:none}
/* 清單捲得動的時候,切一半的那一排要淡出——直接切齊看起來像畫壞了。
   class 由 JS 依捲動位置掛上去(見 updateExFade) */
.examples.more-below{
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);
}
.examples.more-above{
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26px);
  mask-image:linear-gradient(to bottom,transparent 0,#000 26px);
}
.examples.more-above.more-below{
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26px,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(to bottom,transparent 0,#000 26px,#000 calc(100% - 26px),transparent);
}

/* ── 和弦鍵盤:不想打字就用點的 ─────────────────────────────
   兩排:上排音名、下排性質。點音名加一格、點性質改最後一格,
   兩下就能打出 Cm7,不必記得完整寫法 */
.palette{
  margin-top:7px;padding:7px 8px;
  background:var(--surface-inset);border:1px solid var(--line);border-radius:var(--radius-md);
}
.pal-row{display:flex;flex-wrap:wrap;gap:6px}
/* 音名用 grid 排。flex 會把最後一行剩下的幾顆撐滿整列,
   同一顆鈕在不同行寬度差一倍,看起來像壞掉 */
#palRoots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
/* 性質固定七欄:剛好 14 顆排成整齊的兩列,不會有最後一列落單的格子,
   高度也不會因為視窗寬度忽然多一列(auto-fill 在 800px 寬會掉成六欄、變三列) */
#palQuals{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;container:palq / inline-size}
.pal-row + .pal-row{margin-top:4px;padding-top:5px;border-top:1px solid var(--line)}
.pal-btn{
  min-width:0;
  border:1px solid var(--line);background:transparent;color:var(--ivory);
  font-family:"Noto Serif TC",serif;font-size:var(--fs-md);font-weight:600;letter-spacing:.02em;
  padding:4px 4px;border-radius:var(--radius-sm);cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.pal-btn:hover,.pal-btn:focus-visible{background:var(--gold);border-color:var(--gold);color:var(--bg);outline:none}
.pal-btn:active{transform:translateY(1px)}
/* 性質鈕比音名鈕安靜一階:音名是主要動作(加一格),性質是修飾 */
/* 性質鈕不跟著撐滿:14 顆會換行,若讓最後一行的幾顆平分寬度,
   同一顆鈕在不同行寬度差很多,看起來像壞掉 */
.pal-qual .pal-btn{
  font-family:"Noto Sans TC",sans-serif;font-weight:500;
  color:var(--muted-bright);padding:4px 2px;
  /* 兩欄又不夠寬時(680px 上下)一格只剩 35px,m7♭5 會滿出格子。
     跟範例膠囊同一招:字級跟著格子寬度縮。一格的可用寬 =(整排寬 − 6 個間距)÷7 − 內距,
     3.4 是量出來的(12px 的 m7♭5 要 40px) */
  font-size:min(var(--fs-xs), calc(((100cqi - 24px) / 7 - 6px) / 3.4));
}
.pal-qual .pal-btn:hover,.pal-qual .pal-btn:focus-visible{color:var(--bg)}
/* 手機單欄時七欄一格只剩 30 幾 px,字會縮到 9px,用手指點也不好點。
   那裡改成五欄三列(反正手機本來就要捲),字就回得來 */
@media (max-width:680px){
  #palQuals{grid-template-columns:repeat(5,minmax(0,1fr))}
  .pal-qual .pal-btn{font-size:min(var(--fs-xs), calc(((100cqi - 16px) / 5 - 6px) / 3.4))}
}
.pal-foot{display:flex;align-items:center;justify-content:space-between;gap:7px 10px;margin-top:5px;flex-wrap:wrap}
.pal-hint{font-size:var(--fs-2xs);color:var(--muted);line-height:1.6;text-wrap:pretty}

/* ── 小節格:每格一個和弦,播到哪一格就亮哪一格 ───────────── */
.bars-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
  margin-top:7px;
}
/* 一排八格時,第 4 與第 5 格之間開一點縫,兩句才分得開 */
.bars-grid.eight .bar-chip:nth-child(8n+5){margin-left:7px}
.bar-chip{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:42px;padding:6px 5px;cursor:pointer;
  background:var(--surface-inset);border:1px solid var(--line);border-radius:var(--radius-md);
  font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);font-weight:600;
  color:var(--ivory);letter-spacing:.02em;text-align:center;word-break:break-all;
  transition:background-color .12s,border-color .12s,color .12s;
}
.bar-chip:hover,.bar-chip:focus-visible{border-color:var(--gold);outline:none}
/* 選取中的那一格:之後點性質鈕就是改這一格。用外框不用填色,
   才不會跟「正在響」的那一格搞混 */
.bar-chip.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
/* 目前正在響的小節。用邊框+底色,不用 transform,免得整排格子在每小節抖一下 */
.bar-chip.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.bar-chip.bad{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
/* 小節一多就換四欄小格:12 小節的進行也只佔三列,跟四小節的兩列差不多高,
   整頁高度不會跟著進行長度跑掉 */
.bars-grid.dense .bar-chip{min-height:28px;font-size:var(--fs-sm);padding:3px 2px;line-height:1.25}
.bars-grid.dense .bar-chip .num{top:1px;left:4px;font-size:9px}
/* 接成 A A B B 之後動不動就 24、32 小節(八小節的段落接四次就 32 格)。
   四欄的話 32 格要排八列,整頁就被撐開了,所以再密一階:六欄或八欄、字再小一號 */
.bars-grid.denser .bar-chip{min-height:24px;font-size:var(--fs-xs);padding:2px 1px;line-height:1.25;container-type:inline-size}
.bars-grid.denser .bar-chip .num{top:0;left:3px;font-size:8px}
/* 六欄、八欄時一格只剩三、四十 px,Cmaj7 放不下。跟範例膠囊同一招:
   字級 = 格子寬 ÷ 字數,再跟原本的字級取小的,寧可小一號也不要斷字 */
.bars-grid.denser .bar-name{
  font-size:min(var(--fs-xs), calc((100cqi - 4px) / (0.76 * var(--len,3))));
}
.bar-chip .num{
  position:absolute;top:3px;left:7px;
  font-family:"Noto Sans TC",sans-serif;font-size:var(--fs-2xs);font-weight:400;
  color:var(--muted);font-variant-numeric:tabular-nums;
}
.bar-chip.on .num{color:var(--bg);opacity:.65}
.bar-chip.bad .num{color:var(--danger)}

/* 小節工具列:搬移、插入、刪掉、復原。按鈕一直都在(沒選取時是停用的),
   不然一選取就多一排、整個版面會跳一下 */
.bar-tools-btns{display:flex;gap:5px;flex:none}
.tool-btn{
  min-width:34px;height:28px;padding:0 10px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--surface-inset);color:var(--muted-bright);
  border-radius:var(--radius-sm);cursor:pointer;
  font-family:inherit;font-size:var(--fs-xs);line-height:1;
  transition:background .15s,color .15s,border-color .15s;
}
.tool-btn:hover:not(:disabled),.tool-btn:focus-visible:not(:disabled){
  background:var(--gold);border-color:var(--gold);color:var(--bg);outline:none;
}
.tool-btn:disabled{opacity:.3;cursor:not-allowed}

.parse-error{
  display:none;align-items:center;gap:7px;
  margin-top:12px;padding:10px 12px;
  border:1px solid var(--danger);background:var(--danger-bg);border-radius:var(--radius-md);
  color:var(--danger);font-size:var(--fs-sm);line-height:1.6;
}
.parse-error.on{display:flex}
.parse-error svg{flex:none}

/* ── 走帶列 ───────────────────────── */
.transport{display:flex;align-items:center;gap:12px;margin-top:10px}
.play-btn{
  flex:none;display:flex;align-items:center;justify-content:center;
  width:48px;height:48px;border-radius:50%;
  border:1px solid var(--gold);background:var(--gold);color:var(--bg);
  cursor:pointer;transition:background .2s,transform .1s;
}
.play-btn:hover:not(:disabled),.play-btn:focus-visible:not(:disabled){background:var(--gold-bright);outline:none}
.play-btn:active:not(:disabled){transform:scale(.96)}
.play-btn:disabled{opacity:.35;cursor:not-allowed}
.play-btn svg{width:22px;height:22px}
/* 這條 CSS 不能省:瀏覽器內建的 [hidden]{display:none} 綁在 HTML 命名空間上,
   對 <svg> 不生效,少了這行播放與暫停圖示會同時出現在按鈕裡 */
svg[hidden]{display:none}
.transport-txt{flex:1;min-width:0}
.transport-txt .line1{font-size:var(--fs-md);color:var(--ivory);font-weight:600;line-height:1.5}
.transport-txt .line2{font-size:var(--fs-xs);color:var(--muted);margin-top:2px;line-height:1.6;font-variant-numeric:tabular-nums}

/* ── 控制項區塊 ───────────────────── */
.control{
  margin-top:8px;padding:9px 11px;
  background:var(--surface-inset);border:1px solid var(--line);border-radius:var(--radius-md);
}
/* 速度與移調並排。夠寬就兩欄,窄了自己疊回一欄 */
.control-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:10px}
.control-pair > .control{margin-top:10px}
.control-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.control-head .label{font-size:var(--fs-xs);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.control-head .value{
  font-family:"Noto Serif TC",serif;
  font-size:var(--fs-xl);color:var(--gold-bright);font-variant-numeric:tabular-nums;
  letter-spacing:.02em;white-space:nowrap;
}
.control-head .value .unit{font-family:"Noto Sans TC",sans-serif;font-size:var(--fs-xs);color:var(--muted);margin-left:4px}
.slider-row{display:flex;align-items:center;gap:10px}
.step-btn{
  flex:none;width:32px;height:32px;border-radius:50%;padding:0;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:transparent;color:var(--muted-bright);
  font-family:inherit;font-size:var(--fs-lg);line-height:1;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;
}
.step-btn:hover:not(:disabled),.step-btn:focus-visible:not(:disabled){
  background:var(--gold);border-color:var(--gold);color:var(--bg);outline:none;
}
.step-btn:disabled{opacity:.3;cursor:not-allowed}
.scale{
  display:flex;justify-content:space-between;
  margin-top:6px;font-size:var(--fs-2xs);color:var(--muted);font-variant-numeric:tabular-nums;
}
/* −/＋ 鈕佔掉滑桿兩端的寬度,刻度要跟著縮排才會對到滑桿的頭尾 */
.scale.inset{padding:0 42px}

/* 滑桿:軌道 3px、金色圓鈕,跟 ScrollScore 的速度滑桿同一套 */
input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:3px;border-radius:2px;
  background:var(--line);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg);cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg);cursor:pointer;
}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(201,162,75,.35)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px rgba(201,162,75,.35)}
/* 移調滑桿的刻度畫在 0 半音(正中間),眼睛先看得到「這裡有一格」 */
#transpose{background:linear-gradient(var(--muted),var(--muted)) 50% 0 / 2px 100% no-repeat, var(--line)}

/* BPM:數字直接輸入,兩側 −/＋ 微調 */
.bpm-row{display:flex;align-items:center;gap:10px}
#bpmInput{
  flex:1;min-width:0;height:36px;text-align:center;
  background:var(--card-tint);border:1px solid var(--line);border-radius:var(--radius-md);
  color:var(--gold-bright);font-family:"Noto Serif TC",serif;font-size:var(--fs-2xl);font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  -moz-appearance:textfield;appearance:textfield;
}
#bpmInput::-webkit-outer-spin-button,#bpmInput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#bpmInput:focus{outline:none;border-color:var(--gold);background:var(--surface-inset-hi)}
.bpm-quick{display:flex;gap:6px;margin-top:6px}
.bpm-quick .btn{
  flex:1;height:30px;padding:0 10px;font-size:var(--fs-sm);
  border-color:var(--line);color:var(--muted-bright);
}
.bpm-quick .btn:hover,.bpm-quick .btn:focus-visible{background:var(--gold);border-color:var(--gold);color:var(--bg)}

/* 伴奏樣式:四選一 */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:6px 5px;min-height:46px;
  border:1px solid var(--line);background:transparent;color:var(--muted-bright);
  font-family:inherit;font-size:var(--fs-sm);font-weight:500;line-height:1.35;text-align:center;
  border-radius:var(--radius-md);cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;
}
.seg button svg{flex:none;opacity:.85}
.seg button:hover,.seg button:focus-visible{border-color:var(--gold);color:var(--ivory);outline:none}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:700}
.seg button[aria-pressed="true"] svg{opacity:1}

/* 開關列:count-in 與循環 */
/* 四個開關用 grid 排:flex-wrap 會讓落單的那個獨佔一整行、寬度跟別人差一截。
   auto-fit 會依寬度自己決定一行放幾個,每一行都填得滿 */
.toggles{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;margin-top:8px;
}
.toggle{
  min-width:0;
  display:flex;align-items:center;gap:9px;
  padding:8px 11px;border:1px solid var(--line);background:var(--surface-inset);
  border-radius:var(--radius-md);cursor:pointer;
  font-size:var(--fs-sm);color:var(--muted-bright);
  transition:background .2s,color .2s,border-color .2s;
}
.toggle:hover,.toggle:focus-visible{border-color:var(--gold);color:var(--ivory);outline:none}
.toggle[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:600}
.toggle .box{
  flex:none;width:18px;height:18px;border-radius:5px;
  border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;
}
.toggle .box svg{opacity:0}
.toggle[aria-pressed="true"] .box svg{opacity:1}

/* ── 儲存的進行 ───────────────────── */
.saved{margin-top:9px}
.saved-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
.saved-head .label{font-size:var(--fs-xs);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.saved-list{display:flex;flex-wrap:wrap;gap:6px}
.saved-empty{font-size:var(--fs-2xs);color:var(--muted);line-height:1.7}
.saved-item{
  display:inline-flex;align-items:center;gap:2px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:transparent;
  overflow:hidden;
}
.saved-item .name{
  background:none;border:none;color:var(--muted-bright);font-family:inherit;
  font-size:var(--fs-xs);padding:6px 4px 6px 12px;cursor:pointer;max-width:170px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.saved-item .name:hover,.saved-item .name:focus-visible{color:var(--gold-bright);outline:none}
.saved-item .del{
  background:none;border:none;color:var(--muted);font-family:inherit;font-size:var(--fs-md);
  line-height:1;padding:6px 10px 6px 4px;cursor:pointer;
}
.saved-item .del:hover,.saved-item .del:focus-visible{color:var(--danger);outline:none}

.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:5px}
.hint-kbd{font-size:var(--fs-2xs);color:var(--muted);line-height:1.6}
.hint-kbd kbd{
  font-family:inherit;font-size:var(--fs-2xs);color:var(--muted-bright);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--card-tint);
}
@media (max-width:480px){.hint-kbd{display:none}}
.status-line{font-size:var(--fs-2xs);color:var(--muted);line-height:1.6;text-align:right}
.status-line.warn{color:var(--danger)}

footer{
  border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  text-align:center;font-size:var(--fs-2xs);color:var(--muted);line-height:1.8;
}
footer a{color:var(--muted-bright);text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--gold-bright)}

@media (min-width:600px){
  main{padding:20px}
  .card{padding:18px 20px}
}
@media (max-width:400px){
  .card{padding:16px}
  .transport{gap:10px}
  .play-btn{width:48px;height:48px}
  .play-btn svg{width:19px;height:19px}
  .scale.inset{padding:0 38px}
}
/* ── 高螢幕:把多出來的高度用掉 ─────────────────────────────
   13 吋平板直立(1024×1366)整頁只用得到 700px,下面空一大塊很奇怪。
   兩欄的螢幕讓元件跟著視窗高度長大:clamp 的下限就是原本的尺寸,
   短螢幕(720/800 高)取到下限、完全不受影響,高螢幕才會撐開。
   手機不套用——那裡本來就要捲,元件再長大只是讓它更長 */
@media (min-width:680px){
  #chordInput{min-height:clamp(46px,7.6vh,130px)}
  .ex-btn{min-height:clamp(26px,2.4vh,34px)}
  /* 面板是浮的,清單高度由 fitSecPanel() 量出來鎖住(這裡是還沒量到之前的保險值) */
  .examples{
    max-height:min(52vh, 430px);
    overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:var(--muted) transparent;
  }
  .examples::-webkit-scrollbar{width:8px}
  .examples::-webkit-scrollbar-thumb{background:var(--muted);border-radius:4px}
  .examples::-webkit-scrollbar-thumb:hover{background:var(--gold)}
  .pal-btn{padding-top:clamp(4px,.55vh,16px);padding-bottom:clamp(4px,.55vh,16px)}
  .bar-chip{min-height:clamp(42px,5.4vh,86px)}
  /* 兩欄的螢幕用滑鼠點,格子可以再矮一點:12 小節三列時省下來的高度
     剛好是 720 高的筆電放不放得下的差別。手機維持 28px,那是用手指點的 */
  .bars-grid.dense{gap:6px}
  .bars-grid.dense .bar-chip{min-height:clamp(24px,3.2vh,56px);padding:2px}
  .bars-grid.denser{gap:6px}
  .bars-grid.denser .bar-chip{min-height:clamp(22px,2.9vh,44px)}
  .play-btn{width:clamp(48px,6.2vh,72px);height:clamp(48px,6.2vh,72px)}
  .seg button{min-height:clamp(46px,5.6vh,92px)}
  .toggle{padding-top:clamp(8px,1.5vh,22px);padding-bottom:clamp(8px,1.5vh,22px)}
  .tool-btn{height:clamp(28px,3.2vh,42px)}
  #bpmInput{height:clamp(36px,4.2vh,60px)}
  .step-btn{width:clamp(32px,3.7vh,48px);height:clamp(32px,3.7vh,48px)}
  .bpm-quick .btn{height:clamp(30px,3.4vh,46px)}
  /* 區塊之間的距離也跟著長:元件變大、間距沒變的話會擠在一起像貼紙 */
  .ex-head{margin-top:clamp(5px,.68vh,16px)}
  .examples{margin-top:clamp(6px,.8vh,16px)}
  .palette{margin-top:clamp(7px,.95vh,20px)}
  .bars-grid{margin-top:clamp(7px,.95vh,22px)}
  .transport{margin-top:clamp(10px,1.35vh,22px)}
  .control{margin-top:clamp(8px,1.3vh,20px)}
  .control-pair > .control{margin-top:clamp(10px,1.4vh,22px)}
  .toggles{margin-top:clamp(8px,1.3vh,20px)}
  .saved{margin-top:clamp(9px,1.3vh,20px)}
  /* 刻度的縮排要跟著 −/＋ 鈕的寬度走,不然 −12 / 0 / +12 會對不到滑桿頭尾 */
  .scale.inset{padding:0 calc(clamp(32px,3.7vh,44px) + 10px)}
}
/* 就算撐開了,高螢幕還是會剩一些。剩下的平均分到卡片上下,
   用 margin auto 不用 justify-content:center——flex 裡空間不夠時
   justify-content:center 會把上緣頂出捲動範圍,margin auto 不會 */
.stage{margin-block:auto}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>
<script>
/* 主題要在第一次繪製前就決定,不然淺色使用者會先看到一格黑畫面再閃成白的。
   key 跟其他工具共用(sm_theme),在任一個工具切過,其他工具打開就是同一個。 */
try {
  if (localStorage.getItem("sm_theme") === "light") {
    document.body.classList.add("light");
    document.querySelector('meta[name="theme-color"]').setAttribute("content", "#FBF7EE");
  }
} catch (e) {}
</script>

<header>
  <div class="header-left">
    <a href="https://stevenmusic.github.io/" class="home-link" data-i18n-attr="aria-label:homeLinkLabel,title:homeLinkLabel" aria-label="首頁" title="首頁">
      <span aria-hidden="true">←</span><span class="btn-label" data-i18n="homeLinkLabel">首頁</span>
    </a>
    <h1>Backing<span>Track</span></h1>
  </div>
  <div class="header-right">
    <button class="btn icon" id="themeToggle" aria-pressed="false" data-i18n-attr="aria-label:themeToggleLabel,title:themeToggleTitle" aria-label="切換淺色或深色主題" title="切換淺色 / 深色">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button class="btn" id="langToggle" aria-pressed="false" aria-label="Switch to English" title="Switch to English">EN</button>
  </div>
</header>

<main>
  <div class="stage">
    <div class="card">
      <!-- 寬螢幕分兩欄:左邊「怎麼輸入」、右邊「怎麼播」。
           窄螢幕自動疊回一欄,順序跟原本完全一樣 -->
      <div class="col">

      <!-- 和弦輸入 -->
      <div class="field-head">
        <span class="label" data-i18n="chordLabel">和弦進行</span>
        <span class="bars" id="barCount">4 小節</span>
      </div>
      <textarea id="chordInput" spellcheck="false" autocapitalize="off" autocorrect="off"
        data-i18n-attr="placeholder:chordPlaceholder,aria-label:chordLabel"
        placeholder="C - Am - F - G">C - Am - F - G</textarea>
      <p class="field-hint" data-i18n="chordHint">一個和弦一小節,4/4 拍。用空白或「-」分隔;不想打字就點下面那排。</p>

      <!-- 段落庫:預設收起來,點開才佔版面。挑長度、挑要接幾次,點一下就接到形式後面 -->
      <div class="ex-wrap">
      <div class="ex-head">
        <!-- 先決定幾小節,再一格一格填。這一排也順手決定段落庫要看哪一組 -->
        <div class="seg-mini" id="lenSeg">
          <button type="button" data-len="4" aria-pressed="false" data-i18n="len4">4 小節</button>
          <button type="button" data-len="8" aria-pressed="false" data-i18n="len8">8 小節</button>
          <button type="button" data-len="12" aria-pressed="false" data-i18n="len12">12 小節</button>

function getStoredLang(){
  try {
    const v = localStorage.getItem(LANG_KEY);
    return (v === "en" || v === "zh") ? v : "zh";
  } catch (e) { return "zh"; }
}
let currentLang = getStoredLang();

/* T(key, vars):執行期組字串的翻譯入口,{name} 佔位符做簡單取代。
   找不到 key 時原樣印出 key,方便一眼看出漏翻的地方 */
function T(key, vars){
  const dict = I18N[currentLang] || I18N.zh;
  let s = Object.prototype.hasOwnProperty.call(dict, key) ? dict[key] : key;
  if (vars) for (const k of Object.keys(vars)) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}

/* ══ 和弦解析 ══════════════════════════════════════════════════
   目標是「看得懂人手寫在譜上的那種和弦記號」,不是完整的和聲分析器。
   解析失敗時寧可明講看不懂哪一個 token,也不要自作聰明猜成別的和弦。 */
const NOTE_PC = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };

/* 每種和弦記號對應的音程(相對根音的半音數)。這份表直接對著 HarmonyMap 的

   兩個工具看得懂的和弦因此是同一套,在 HarmonyMap 查得到的,這裡就打得出來。
   9 度寫成 14 而不是 2,是因為疊起來要在八度以上才聽得出是九和弦,不是二度撞音。
   大小寫有意義(M7 是大七、m7 是小七),所以查表前不能整串 toLowerCase。
   兩個沒收的寫法:HarmonyMap 的「So What」有空白,當不了 token;
   「♯5」(aug 的別名)跟 C♯5 這種「升記號+強力和弦」的寫法撞在一起,一律當後者。 */
const QUALITY = {

  /* 大調系:大三、六、加音、大七與其延伸 */
  "": [0,4,7],
  "M": [0,4,7],
  "maj": [0,4,7],
  "major": [0,4,7],
  "aug": [0,4,8],
  "+": [0,4,8],
  "6": [0,4,7,9],
  "M6": [0,4,7,9],
  "add9": [0,4,7,14],
  "add2": [0,4,7,14],
  "add11": [0,4,7,17],
  "add4": [0,4,7,17],
  "add#11": [0,4,7,18],
  "addb5": [0,4,7,18],
  "maj7": [0,4,7,11],
  "M7": [0,4,7,11],
  "ma7": [0,4,7,11],
  "maj7#5": [0,4,8,11],
  "maj7b5": [0,4,6,11],
  "6/9": [0,4,7,9,14],
  "6add9": [0,4,7,9,14],
  "maj9": [0,4,7,11,14],
  "M9": [0,4,7,11,14],
  "maj9#5": [0,4,8,11,14],
